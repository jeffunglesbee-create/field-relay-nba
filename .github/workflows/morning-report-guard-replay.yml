name: Morning report guard replay

# Read-only. Asks the real proxy for the Morning Report the cron would have asked for,
# SAMPLES times per date (default 4 dates x 3 = 12 inferences, Rule 78), and runs the
# production team-name guard over each answer, so the prose the guard rejects can be read.
# The cron's own rejected prose is not kept (docs/CC-CMD-2026-10-30-morning-report-
# degraded-reason.md), so asking again is the only way to see it.
#
# Dispatch-only, NO schedule: this answers a question once. The permanent record is the
# row the cron writes (value.degraded / degraded_reason), not this.
#
# `secrets: inherit` is what hands the relay secret to the reusable runner (see its header);
# the caller must also grant contents: write.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replay:
    uses: ./.github/workflows/_reusable-probe.yml
    with:
      script: scripts/probe-morning-report-guard-replay.mjs
      commit_message: "chore: morning-report guard replay result [skip ci]"
    secrets: inherit
