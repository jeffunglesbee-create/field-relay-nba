name: TEMP Catchup Clean-Run Test

on:
  push:
    paths: ['.github/workflows/temp-catchup-clean-test.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tail worker logs (filtered) while triggering a clean request
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest tail field-relay-nba --format json --search "ARCHIVE-CATCHUP" > tail.log 2> tail.err &
          TAIL_PID=$!
          sleep 15
          python3 -c "
          import urllib.request, urllib.error
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          req = urllib.request.Request('https://field-relay-nba.jeffunglesbee.workers.dev/journalism/run', method='POST', headers={'User-Agent': UA})
          try:
              with urllib.request.urlopen(req) as r:
                  print('HTTP', r.status)
                  print(r.read().decode())
          except urllib.error.HTTPError as e:
              print('HTTP', e.code)
              print(e.read().decode())
          "
          sleep 10
          kill $TAIL_PID 2>/dev/null || true
          sleep 1
          echo "=== tail.log (filtered to ARCHIVE-CATCHUP) ==="
          cat tail.log || true
          echo "=== tail.err (last 15 lines) ==="
          tail -15 tail.err || true
