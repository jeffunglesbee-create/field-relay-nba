name: Soccer League Mislabel Scope Probe

# CC-CMD-2026-08-06-apply-soccer-league-label-fix. Mode-driven, covering:
#   slate  (Task 2) -- pre-deploy scheduling-hazard check
#   scope  (Task 3) -- measure real mislabel scope, emit correction SQL
#   apply  (Task 3) -- run the correction, report real row counts
#   verify (Task 4) -- confirm zero mismatches remain
#
# Built here rather than imported from field-playground: a relay data probe
# belongs in the relay's own repo, and Tasks 3/4 both require regenerating
# the scope fresh rather than trusting a staged, possibly-stale file.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'slate | scope | apply | verify'
        required: true
        default: 'slate'
        type: choice
        options: [slate, scope, apply, verify]
  # Standing regression detector. CC-CMD Task 4 requires the corrected set
  # stay at zero "for anything newly archived since" -- that's a continuing
  # property, not a one-time check, so it gets a continuing test. `verify`
  # exits non-zero when any mislabeled row reappears, which surfaces a
  # regression as a real failed run rather than silently re-accumulating.
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `inputs.mode` is empty on a schedule trigger (inputs only exist for
    # workflow_dispatch), so it defaults to verify -- the mode the cron is
    # for. Resolved once here so the run step, log filename and commit
    # message can never disagree about which mode actually ran.
    env:
      MODE: ${{ inputs.mode || 'verify' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run probe
        env:
          PROBE_MODE: ${{ inputs.mode || 'verify' }}
        run: |
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p outbox
          node scripts/soccer-league-mislabel-scope.mjs 2>&1 \
            | tee "outbox/soccer-league-mislabel-${MODE}-${TS}.log"

      - name: Commit result
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Soccer-League-Mislabel-Scope-Probe"
          # Separate adds: `git add` is atomic across pathspecs -- a glob that
          # matches nothing aborts the WHOLE command, so combining these meant
          # the .log never staged on any run that produced no .sql. Errors are
          # no longer sent to /dev/null; that is what hid this the first time.
          git add outbox/soccer-league-mislabel-*.log || echo "(no log to add)"
          git add outbox/soccer-league-mislabel-scope-*.sql || echo "(no sql to add)"
          git commit -m "soccer-league-mislabel ${MODE} result [skip ci]" || echo "(nothing new)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
