name: Soccer League Mislabel Scope Probe

# CC-CMD-2026-08-06-apply-soccer-league-label-fix. Mode-driven, covering:
#   slate  (Task 2) -- pre-deploy scheduling-hazard check
#   scope  (Task 3) -- measure real mislabel scope, emit correction SQL
#   apply  (Task 3) -- run the correction, report real row counts
#   verify (Task 4) -- confirm zero mismatches remain
#
# Built here rather than imported from field-playground: a relay data probe
# belongs in the relay's own repo, and Tasks 3/4 both require regenerating
# the scope fresh rather than trusting a staged, possibly-stale file.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'slate | scope | apply | verify'
        required: true
        default: 'slate'
        type: choice
        options: [slate, scope, apply, verify]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run probe (${{ inputs.mode }})
        env:
          PROBE_MODE: ${{ inputs.mode }}
        run: |
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p outbox
          node scripts/soccer-league-mislabel-scope.mjs 2>&1 \
            | tee "outbox/soccer-league-mislabel-${{ inputs.mode }}-${TS}.log"

      - name: Commit result
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Soccer-League-Mislabel-Scope-Probe"
          git add outbox/soccer-league-mislabel-*.log outbox/soccer-league-mislabel-scope-*.sql 2>/dev/null || true
          git commit -m "soccer-league-mislabel ${{ inputs.mode }} result [skip ci]" || echo "(nothing new)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
