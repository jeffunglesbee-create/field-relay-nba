name: Set DataImpulse Secrets (one-shot)
on:
  workflow_dispatch:
    inputs:
      di_user:
        description: DataImpulse login
        required: true
      di_pass:
        description: DataImpulse password
        required: true

jobs:
  set-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Set DATAIMPULSE_USER and DATAIMPULSE_PASS
        env:
          GH_TOKEN: ${{ secrets.RELAY_GH_PAT }}
          DI_USER: ${{ inputs.di_user }}
          DI_PASS: ${{ inputs.di_pass }}
        run: |
          printf '%s' "$DI_USER" | gh secret set DATAIMPULSE_USER --repo ${{ github.repository }}
          printf '%s' "$DI_PASS" | gh secret set DATAIMPULSE_PASS --repo ${{ github.repository }}
          echo "Secrets set."
