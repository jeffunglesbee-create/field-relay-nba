name: Hockey WP train

# docs/CC-CMD-2026-10-10-nhl-win-probability-from-xg.md — Tasks 1-4.
#
# Trains offline and commits a coefficient table; the Worker then scores live
# shots with a dot product and no ML runtime, which is the CC-CMD's first stop
# condition.
#
# CI because the shot files are 403-at-CONNECT from the container, and because
# three seasons of shots is ~60MB of download and ~400k rows of fitting.
#
# THE SPLIT IS WHOLE SEASONS. The script refuses to continue if any game id
# appears on both sides, because shots from one game share one label and a
# shuffled split would let Task 3's gate pass on memorised outcomes.
#
# src/hockey-wp-model.js is written ONLY when the gate passes. A model that
# loses to the de-vigged market baseline must not become the file the Worker
# imports — the CC-CMD's second stop condition is to report the numbers, not
# to ship anyway.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "training seasons, comma separated"
        required: false
        type: string
        default: "2021,2022,2023"
      test:
        description: "held-out season"
        required: false
        type: string
        default: "2024"
      iters:
        description: "optimiser iterations"
        required: false
        type: string
        default: "400"
      out:
        description: "outbox artifact prefix. Change it for a PARALLEL run that must not clobber the shipped calibration."
        required: false
        type: string
        default: "hockey-wp-calibration"
      no_model_write:
        description: "true = never write src/hockey-wp-model.js. Required for any re-split run."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: The trainer can still fail
        run: |
          node scripts/hockey-wp-lib.mjs  2>/dev/null || true
          node scripts/hockey-wp-train.mjs --self-test
          node scripts/hockey-wp-market.mjs --self-test

      - name: Train and calibrate
        run: |
          EXTRA=""
          if [ "${{ inputs.no_model_write }}" = "true" ]; then EXTRA="--no-model-write"; fi
          node --max-old-space-size=6144 scripts/hockey-wp-train.mjs \
            "--seasons=${{ inputs.seasons }}" "--test=${{ inputs.test }}" "--iters=${{ inputs.iters }}" \
            "--out=${{ inputs.out }}" $EXTRA

      - name: Commit the artifact and the coefficient table
        if: always()
        run: |
          set -euo pipefail
          git config user.email "claude@field.dev"
          git config user.name  "FIELD CI"
          # A PARALLEL RUN STAGES ONLY ITS OWN ARTIFACT. Staging
          # src/hockey-wp-model.js on a re-split run would push a model fit on a
          # different split over the deployed one.
          git add "outbox/${{ inputs.out }}"-*.json || true
          if [ "${{ inputs.no_model_write }}" != "true" ]; then
            git add src/hockey-wp-model.js || true
          fi
          # A FAILED RUN MUST COMMIT ITS REASON. The first train run died and
          # the cause was unreadable: this project's GitHub client cannot
          # follow the log blob redirect, and this step had nothing to stage.
          git add outbox/hockey-wp-train-failure-*.json || true
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "feat: hockey WP coefficients and calibration artifact [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after 3 attempts"; exit 1; }
