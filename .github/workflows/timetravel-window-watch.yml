# CC-CMD-2026-09-07-codex-write-nondestructive-and-recovery — the Task 0b
# follow-up, automated so nobody has to remember it.
#
# Task 0b could not read field-archive's Time Travel retention window: the
# CLOUDFLARE_API_TOKEN authenticates — the same token deployed the worker in run
# 34264096616 minutes earlier — and is refused on the D1 endpoint with
# `Authentication error [code: 10000]`. The window is therefore UNMEASURED, which
# is neither "there is one" nor "there is not", and Task 2's gate ("0a failed AND
# 0b confirms a window") is unmet.
#
# One human action unblocks it: minting a token with D1 read permission. This
# watches for that and reports which of two terminal answers arrived.
#
# A SECOND QUESTION RIDES THE SAME UNBLOCK, added 2026-09-20. `whoop_tokens` —
# the table the removed Whoop OAuth block wrote to — is either absent, empty, or
# holding live tokens, and nobody has ever looked. Its probe is refused by the
# same token with the same `Authentication error [code: 10000]` (measured in run
# 35482911059 and again in the ladder run that followed), so it is waiting on
# exactly the human action this watch already waits on. It rides here rather than
# in a second weekly cron: the thing being watched for is one token mint, and two
# schedules asking about it would cost twice and inform once.
#
# IT REPORTS. IT DOES NOT RECOVER. The side-restore exports production data into
# a scratch database, and standing operations against production D1 are
# authorised case by case — never wired to a cron by the session that noticed
# they were possible. `time-travel restore` is forbidden outright: it rewinds the
# ENTIRE database, and 60 deployed routes read or write d1:ARCHIVE_DB, several on
# */5 and */15 crons.
name: time travel window watch

on:
  schedule:
    # Weekly. The thing being waited on is a person minting a token, which does
    # not happen on a schedule — a daily run would spend Actions minutes to ask
    # the same question six more times a week for no extra information.
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: timetravel-window-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The classifier before the classification. It is fixture-driven and
      # includes the REAL captured refusal, so this costs seconds and catches a
      # parser that has quietly stopped telling the three states apart — which is
      # the failure mode of a check that has only ever seen one of them.
      - name: The classifier can still tell the three answers apart
        run: node scripts/timetravel-window-watch.mjs --self-test

      - name: Ask whether the window is readable yet
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/timetravel-window-watch.mjs | tee outbox/timetravel-window-watch.log

      # The commit message carries the state, so the answer is visible in `git
      # log` without opening an artifact. A PENDING week commits nothing at all —
      # the status file is byte-identical apart from its timestamp, and a weekly
      # "nothing changed" commit is noise that trains people to skip the one week
      # it does change.
      #
      # The cost of that choice, stated because it bit once: the committed file's
      # timestamp is when the ANSWER was recorded, not when the question was last
      # asked. The field is named `answer_recorded_at` for exactly that reason,
      # and the record of every asking is this workflow's own run history.
      - name: Commit only a CHANGED answer
        if: always()
        run: |
          # Two named files, not the directory.
          PROBE_PATHS="outbox/timetravel-window-watch-status.json outbox/timetravel-window-watch.log" \
          PROBE_AUTHOR_NAME="FIELD CI" \
          PROBE_AUTHOR_EMAIL="claude@field.dev" \
          bash scripts/probe-commit-retry.sh "chore: time travel window watch — ${STATE}"

      # ── whoop_tokens, riding the same unblock ────────────────────────────────
      # Same token, same refusal, same one human action. Its own harness runs
      # first for the same reason the one above does: a probe whose classifier
      # cannot be made to fail must not get to produce a verdict.
      - name: The whoop_tokens ladder can be made to fail
        run: |
          node scripts/probe-whoop-tokens.mjs --self-test
          node scripts/mutate-whoop-tokens.mjs

      # continue-on-error because `no-d1-scope` is the EXPECTED answer until the
      # token is minted, and it exits 1 on purpose — a state that settles nothing
      # must not report as a green run. A red step here would make the watch look
      # broken every week while it is working exactly as designed.
      - name: Ask whether whoop_tokens is readable yet
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/probe-whoop-tokens.mjs

      # The probe writes a timestamped log every run, so unlike the watch above
      # there is no byte-identical-file test to lean on: committing every week
      # would be 52 near-identical logs saying the token still has no D1 scope.
      # Commit only when the verdict CHANGES — which, for this question, is the
      # week it gets answered.
      - name: Commit a whoop_tokens log only when the verdict changed
        if: always()
        run: |
          # Sort by NAME, not mtime: the names carry a UTC stamp and every
          # checked-out file shares a checkout mtime, so -t would be a coin flip
          # between committed logs on any run that writes none.
          NEW=$(ls -1 outbox/whoop-tokens-probe-*.log 2>/dev/null | sort | tail -1)
          git ls-files --error-unmatch "$NEW" >/dev/null 2>&1 \
            && { echo "newest log is already tracked — the probe wrote none this run"; exit 0; }
          [ -n "$NEW" ] || { echo "no log written — nothing to commit"; exit 0; }
          NEW_VERDICT=$(grep -m1 '^  verdict: ' "$NEW" | sed 's/^  verdict: //')
          OLD=$(git ls-files 'outbox/whoop-tokens-probe-*.log' | sort | tail -1)
          OLD_VERDICT=$([ -n "$OLD" ] && grep -m1 '^  verdict: ' "$OLD" | sed 's/^  verdict: //' || echo none)
          echo "verdict: ${OLD_VERDICT} -> ${NEW_VERDICT}"
          if [ "$NEW_VERDICT" = "$OLD_VERDICT" ]; then
            rm -f "$NEW"
            echo "unchanged — not committing a 52nd copy of the same answer"
            exit 0
          fi
          PROBE_PATHS="$NEW" \
          PROBE_AUTHOR_NAME="FIELD CI" \
          PROBE_AUTHOR_EMAIL="claude@field.dev" \
          bash scripts/probe-commit-retry.sh "chore: whoop_tokens watch — ${NEW_VERDICT}"
