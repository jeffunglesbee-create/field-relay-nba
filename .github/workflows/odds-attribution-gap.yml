name: Odds attribution gap

# Fails when the day's odds spend stops decomposing into the sites that spent it.
#
# The companion to check-odds-attribution.mjs, which is static: it proves every
# call site NAMES itself and that the guard and the reconcile name the same nine
# consumers. It cannot prove the KV writes land. This can, once a day, against
# the live counters.
#
# 09:20 UTC, and the hour is almost irrelevant, which is the point. The first
# version ran at 23:30 to catch "the whole of today" — but GitHub's scheduled-run
# delay in this repo is 104 to 405 minutes (25 scheduled runs across 7 workflows,
# measured 2026-09-16; outbox/gha-cron-delay-2026-09-16.json), so 23:30 fires
# between 01:14 and 06:15 the NEXT UTC day and would have read the new day's
# empty counters every night. The script now asks /budget/odds for YESTERDAY by
# date, so a complete day is read whenever the runner wakes. 09:20 keeps the
# worst-case firing (16:05) inside the 2-day odds:site TTL with a day to spare.

on:
  schedule:
    - cron: '20 9 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'UTC date to judge (YYYY-MM-DD). Default: yesterday. Max 2 days back.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The predicate must be able to fail before its verdict means anything.
      - name: the watcher can fail
        run: node scripts/watch-odds-attribution-gap.mjs --self-test

      # pipefail: without it the step's exit code is the last tee's, which is
      # how run 35012890540 reported success over a script that exited 1.
      - name: Watch
        shell: bash
        if: always()
        run: |
          set -o pipefail
          node scripts/watch-odds-attribution-gap.mjs ${{ inputs.date && format('--date={0}', inputs.date) || '' }} 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" \
            | tee outbox/odds-attribution-gap-$(date -u +%Y%m%dT%H%M%SZ).log

      - name: Commit the log
        if: always()
        run: |
          git config user.email "claude@field.dev"
          git config user.name  "FIELD CI"
          git add outbox/odds-attribution-gap-*.log
          git diff --staged --quiet || git commit -m "chore: odds attribution gap watch"
          git pull --rebase origin main && git push origin HEAD:main
