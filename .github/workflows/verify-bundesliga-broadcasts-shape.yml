name: Verify Bundesliga Broadcasts Shape

# One-shot: CC-CMD-2026-08-02-proxy-bundesliga-broadcasts TASK 1. Real,
# live re-verification of the x-api-key and response shape for
# wapp.bapi.bundesliga.com/broadcasts/{comId}/{dayId}, using a genuinely
# current (comId, dayId) pair resolved fresh via the already-live
# /bundesliga-bapi/resolve-dayid route.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run verification
        run: node scripts/verify-bundesliga-broadcasts-shape.mjs
        continue-on-error: true

      - name: Push result
        run: |
          git config user.email "verify-bundesliga-broadcasts-shape@field"
          git config user.name "Verify-Bundesliga-Broadcasts-Shape"
          git add outbox/verify-bundesliga-broadcasts-shape-result.json 2>/dev/null || true
          git diff --cached --quiet && echo "No result to commit" && exit 0
          git commit -m "verify-bundesliga-broadcasts-shape result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done

      - name: Print result
        if: always()
        run: cat outbox/verify-bundesliga-broadcasts-shape-result.json 2>/dev/null || echo "No result file produced"
