name: TEMP Analytics Fix Verify

# TEMP-ANALYTICS-FIX-VERIFY-2026-07-13: live verification for the
# /journalism/generate Analytics Engine 2-index fix (c05581d), a same-session
# follow-up to CC-CMD-2026-07-13-relay-empty-catches-cluster5. Fires one real,
# minimal POST to /journalism/generate while tailing the worker to confirm
# the [ANALYTICS] error no longer fires and the success path is unaffected.
# Delete after use.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm install --no-save wrangler
      - name: Trigger real minimal journalism/generate call, capture tail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -x
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          OUT="outbox/temp-analytics-fix-tail-${TS}.json"
          mkdir -p outbox

          (
            sleep 12
            echo "=== real minimal call: POST /journalism/generate ==="
            curl -sS -X POST "https://field-relay-nba.jeffunglesbee.workers.dev/journalism/generate" \
              -H "Content-Type: application/json" \
              -d '{"prompt":"Write one short sentence confirming this diagnostic test call was received.","briefType":"diagnostic-verify","max_tokens":200}' \
              -o "outbox/temp-analytics-fix-result-${TS}.json" -w "HTTP %{http_code}\n"
            cat "outbox/temp-analytics-fix-result-${TS}.json"
          ) &

          timeout -k 5s 40s npx wrangler tail field-relay-nba --format json > "$OUT" 2>tail.err || true

          echo "=== tail.err ==="
          cat tail.err || true
          echo "=== File: $OUT (line count) ==="
          wc -l "$OUT" || true

      - name: Push result
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Debug-Probe"
          git add outbox/
          git commit -m "temp: analytics-fix verify capture [skip ci]" || echo "(nothing to commit)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
