name: Scoreboard P0 Probe

on:
  push:
    paths:
      - '.github/workflows/scoreboard-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe scoreboard route
        run: |
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          BASE="outbox/scoreboard-probe-${TS}"
          mkdir -p outbox
          echo "Probe time: $(date -u)" | tee "${BASE}.meta"
          echo "Target: https://field-relay-nba.jeffunglesbee.workers.dev/nba/liveData/scoreboard/todaysScoreboard_00.json" | tee -a "${BASE}.meta"
          curl -sS \
            -H "User-Agent: scoreboard-p0-probe-claude-sandbox" \
            -H "Accept: application/json" \
            "https://field-relay-nba.jeffunglesbee.workers.dev/nba/liveData/scoreboard/todaysScoreboard_00.json" \
            -o "${BASE}.body" \
            -w "HTTP_CODE=%{http_code}\nSIZE_BYTES=%{size_download}\nCONTENT_TYPE=%{content_type}\nTIME_TOTAL=%{time_total}s\n" \
            | tee -a "${BASE}.meta"
          echo "=== Meta ==="
          cat "${BASE}.meta"
          echo ""
          echo "=== Body head (first 4KB) ==="
          head -c 4000 "${BASE}.body" || true

      - name: Commit probe result
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Scoreboard-P0-Probe"
          git add outbox/
          git commit -m "scoreboard P0 probe result [skip ci]" || echo "(nothing new)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
          # The loop above exits 0 when ALL THREE attempts fail: its last command is
          # `sleep`, and `set -e` does not fire because a failing `&&` list is a tested
          # command. Verified under the exact Actions shell (bash -e -o pipefail).
          # Without this line a lost artifact reports as a green step.
          # is-ancestor, not HEAD equality: another bot pushing after us is normal here
          # and must not read as our failure.
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after 3 attempts"; exit 1; }
