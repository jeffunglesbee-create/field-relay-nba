name: completion-field-parity-verify
on:
  push:
    paths: ['.github/workflows/completion-field-parity-verify.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Re-submit MLB_2026-07-10_orioles_royals score to trigger went_to_ot enrichment
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -A "$UA" -X POST "https://field-relay-nba.jeffunglesbee.workers.dev/archive/score-by-id" \
            -H "Content-Type: application/json" \
            -d '{"id":"MLB_2026-07-10_orioles_royals","home_score":5,"away_score":3}'
          echo

      - name: Re-submit MLB_2026-07-10_tigers_phillies score too (second sample)
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -A "$UA" -X POST "https://field-relay-nba.jeffunglesbee.workers.dev/archive/score-by-id" \
            -H "Content-Type: application/json" \
            -d '{"id":"MLB_2026-07-10_tigers_phillies","home_score":10,"away_score":2}'
          echo

      - name: curl newspaper bundle for 2026-07-11 (yesterday resolves to 2026-07-10)
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -A "$UA" "https://field-relay-nba.jeffunglesbee.workers.dev/analytics/newspaper/2026-07-11" | python3 -m json.tool | grep -A20 '"completed_games"' | head -60
