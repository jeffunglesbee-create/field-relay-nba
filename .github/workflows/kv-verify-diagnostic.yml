name: KV Verify Diagnostic (temporary, CC-CMD-2026-07-08-afl-kali-kv-cache)
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Call 1 (expect MISS) and Call 2 (expect HIT)
        run: |
          set -x
          ROUND=$((200 + ${{ github.run_number }}))
          URL="https://field-relay-nba.jeffunglesbee.workers.dev/debug/kali-kv-verify?year=2026&round=${ROUND}"

          echo "=== Call 1 (expect MISS: real upstream fetch) ==="
          curl -s "$URL"
          echo
          sleep 3

          echo "=== Call 2, 3s later (expect HIT: served from KV) ==="
          curl -s "$URL"
          echo
