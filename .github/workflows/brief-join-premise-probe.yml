name: Brief join premise probe

# Read-only CI-as-proxy probe for CC-CMD-2026-08-20-brief-data-quality ask 5.
# Tests the claim "every row carries espn_event_id", which that ask is scoped on.
# Needs POST /d1/execute for a GROUP BY, which the sandbox cannot reach.
#
# Dispatch-only, NO schedule: — this answers a scoping question once. A cron on
# it would repeat the waste pattern documented in jubilant-bassoon
# outbox/cc-session-2026-08-16-scheduled-workflow-audit.md.
on:
  workflow_dispatch:
  push:
    paths:
      - 'outbox/.trigger-brief-premise'

permissions:
  contents: write

concurrency:
  group: brief-join-premise-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe espn_event_id coverage and brief join rate
        run: node scripts/probe-brief-join-premise.mjs

      # Unblocks asks 5 and 6b: the scoring baseline that ask 6b's measuredEffect
      # needs, and the real ESPN call volume + keyEvents shape that ask 5's
      # caching decision needs (Rule 78). Read-only.
      - name: Probe ask5/ask6 prerequisites
        run: node scripts/probe-ask5-ask6-prereqs.mjs

      # Rev 4 of the CC-CMD carries figures from earlier probe runs. Two of them
      # move: the gNN count went 535 -> 539, which either is measurement drift or
      # means ask 4a's guard is not holding, and the EPL-readiness claim has a
      # deadline of 2026-08-22. Neither should be read off a day-old number.
      - name: Probe rev-4 follow-ups (gNN guard, EPL readiness, ask 3 sizing)
        run: node scripts/probe-v4-followups.mjs

      # Before acting on archive-seed-coverage ask 3: EPL is already in the
      # LEAGUES seed table, so "not seeded at all" needs testing, not building on.
      - name: Probe the EPL seed premise
        run: node scripts/probe-epl-seed-premise.mjs

      - name: Probe whether the closing-odds hook has ever fired
        run: node scripts/probe-closing-hook-firing.mjs

      # Odds API probe. ODDS_API_KEY is passed as env to THIS STEP ONLY and is
      # never printed -- the script emits counts, HTTP statuses and
      # header-derived numbers, never the value. /v4/sports is the documented
      # zero-credit endpoint, so reading quota costs no quota (Rule 78).
      - name: Probe the Odds API (quota + why EPL/La Liga lack opening odds)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/probe-odds-api.mjs

      - name: Probe the odds team-name join (no API key used)
        run: node scripts/probe-odds-team-names.mjs

      # Pre-build probe for the FPL ask. Reads every field name from the live
      # payload rather than from the ask's 2026-05-17 Drive-sourced description
      # (Rule 73). Three cached GETs through the relay proxy — no key, no quota.
      - name: Probe the FPL payload shape
        run: node scripts/probe-fpl-shape.mjs

      - name: Commit manifest
        if: always()
        run: |
          git config user.name "FIELD CI"
          git config user.email "claude@field.dev"
          git add outbox/brief-join-premise-manifest-*.json outbox/ask5-ask6-prereq-manifest-*.json outbox/v4-followup-manifest-*.json outbox/epl-seed-premise-*.json outbox/closing-hook-firing-*.json outbox/odds-api-probe-*.json outbox/odds-team-names-*.json outbox/fpl-shape-probe-*.json || {
            echo "no manifest produced"; exit 0; }
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore: brief join premise manifest [skip ci]"

          # Many concurrent writers to outbox/; a lost race must not fail the
          # run, but a permissions failure must. Same split as deploy.yml.
          LOG=/tmp/premise-push.log; : > "$LOG"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main >>"$LOG" 2>&1 \
               && git push origin main >>"$LOG" 2>&1; then
              echo "Pushed manifest on attempt $i."; exit 0
            fi
            echo "Attempt $i lost the race; retrying."; sleep $((i * 5))
          done
          echo "::group::push log"; cat "$LOG"; echo "::endgroup::"
          if grep -qiE 'denied|403|permission|forbidden|authentication' "$LOG"; then
            echo "Push failed on PERMISSIONS."; exit 1
          fi
          echo "Race contention; result is in the log above."; exit 0
