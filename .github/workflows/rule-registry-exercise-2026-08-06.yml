name: Rule Registry Exercise (one-shot, 2026-08-06)

# CC-CMD-2026-08-06-close-rule-registry-carryforward.
#
# Flips rule-90 UNEXERCISED -> EXERCISED with a genuine, real case from
# this session. Rule 90's own text (jubilant-bassoon STANDARDS.md) says
# the flip happens "the moment a session finds a real case where the rule
# applied ... not deferred", so it is done here rather than noted.
#
# rule-92 (Watch Engine WC tier selection), rule-93 (OTW momentum), and
# rule-94 (_fieldDataReady sentinel) are DELIBERATELY LEFT UNTOUCHED --
# no work in this session touched any of those systems. Per Rule 90's own
# text an honest UNEXERCISED signal is "the correct, honest signal to
# surface ... not a false alarm to suppress." Flipping them to make the
# monitor go green would be fabrication (Rule 2, DO NOT INVENT). The
# monitor therefore REMAINS RED after this workflow, by design.
#
# NO actions/checkout, deliberately: this job is pure curl against the
# relay's /d1/execute and needs no working tree. Three consecutive runs
# on 2026-08-06 (31116882733, 31117153055, and deploy run 31115370947)
# died in "Set up job" with GitHub's own
# "Failed to resolve action download info. Error: Service Unavailable"
# during a platform incident -- an avoidable dependency for a job that
# never needed the repo. Snapshots print to the job log, which is the
# durable artifact; they are committed to outbox/ from the session
# instead of by this workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exercise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Snapshot BEFORE
        run: |
          echo "=== BEFORE ==="
          curl -sS -X POST "https://field-relay-nba.jeffunglesbee.workers.dev/d1/execute" \
            -H "Content-Type: application/json" \
            -H "X-FIELD-Relay: field-relay-cron-2026" \
            -d '{"sql":"SELECT key, title, updated_at FROM codex WHERE category = '"'"'rule-registry'"'"' ORDER BY key"}'
          echo

      - name: Mark rule-90 EXERCISED -- real case from this session only
        run: |
          echo "=== UPDATE rule-90 ==="
          curl -sS -X POST "https://field-relay-nba.jeffunglesbee.workers.dev/d1/execute" \
            -H "Content-Type: application/json" \
            -H "X-FIELD-Relay: field-relay-cron-2026" \
            -d '{"sql":"UPDATE codex SET title = ?, updated_at = datetime(\"now\") WHERE key = ?","params":["EXERCISED -- Rule 90: 2026-08-06, RULE-COMPLIANCE-FOLLOWUP-A applied for real. Two consecutive HANDOFF close-outs (2026-07-25/27, 2026-07-26/27) carried Rule-90 staleness forward as a live deploy blocker by memory; that claim was already false, resolved 2026-07-31 by c2d2327 which moved the check into the non-blocking rule90-staleness-monitor.yml. The mechanical artifact (daily monitor + codex query) held the true state while the human-propagated channel had gone stale and wrong -- exactly the failure mode this rule exists to prevent. Session verified against real monitor runs rather than the inherited claim (Rule 72).","rule-90"]}'
          echo

      - name: Deliberately NOT touched
        run: |
          echo "rule-92 (Watch Engine WC tier selection), rule-93 (OTW momentum), rule-94 (_fieldDataReady sentinel):"
          echo "no genuine applicable case in this session -- no work touched those systems."
          echo "Left UNEXERCISED on purpose. The staleness monitor REMAINS RED after this run, by design."

      - name: Snapshot AFTER
        run: |
          echo "=== AFTER ==="
          curl -sS -X POST "https://field-relay-nba.jeffunglesbee.workers.dev/d1/execute" \
            -H "Content-Type: application/json" \
            -H "X-FIELD-Relay: field-relay-cron-2026" \
            -d '{"sql":"SELECT key, title, updated_at FROM codex WHERE category = '"'"'rule-registry'"'"' ORDER BY key"}'
          echo
