name: Post-deploy live verification
on:
  workflow_run:
    workflows: ["Deploy RELAY Worker"]  # confirmed exact name via
                                          # `grep "^name:" .github/workflows/deploy.yml`
                                          # 2026-07-04 — do not re-guess this
    types: [completed]

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 25  # git log -20 in confidence-gate step requires ≥20 commits

      - name: Live-check endpoints
        run: |
          DATE=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d "yesterday" +%Y-%m-%d)
          OUT="outbox/live-verify-${{ github.event.workflow_run.id }}.md"
          mkdir -p outbox
          {
            echo "# Post-deploy live verification"
            echo "Run: ${{ github.event.workflow_run.id }} · Commit: ${{ github.event.workflow_run.head_sha }} · $(date -u)"
            echo
            echo "## /circadian/preview + /circadian/late (today + yesterday)"
            for phase in preview late; do
              for d in "$DATE" "$YESTERDAY"; do
                echo "### $phase / $d"
                curl -sf "https://field-relay-nba.jeffunglesbee.workers.dev/circadian/$phase/$d" || echo "REQUEST FAILED"
                echo
              done
            done
            echo "## Validation checks"
            echo "### bogus phase (expect 400)"
            curl -s -w "\nHTTP:%{http_code}\n" "https://field-relay-nba.jeffunglesbee.workers.dev/circadian/bogus/$DATE"
            echo "### bad date (expect 400)"
            curl -s -w "\nHTTP:%{http_code}\n" "https://field-relay-nba.jeffunglesbee.workers.dev/circadian/preview/not-a-date"
          } > "$OUT"
          cat "$OUT"

      - name: /context/game brief bridge probe -- espn_event_id lookup chain end-to-end
        # CC-CMD-2026-07-18-context-game-espn-briefs TASK live-verify.
        # Resolves the STAGED HTTP probe from that session (sandbox blocked egress).
        # Chain: D1 query finds a game_recap brief → ESPN ID extracted → relay hit
        # at /context/game/espn:{id} → assert archive.gameBriefs[0].brief_text non-null.
        # Fails CI (exit 1) if brief_text is null/empty for a game that has a known brief.
        # Zero game_recap briefs in D1 is a soft-skip (data-dependent, not a code bug).
        # base64 pattern: heredoc unindented Python breaks YAML literal block parsing.
        run: |
          echo "" | base64 -d > /tmp/context_game_brief_probe.py
          python3 /tmp/context_game_brief_probe.py

      - name: bracketDelta end-to-end probe -- espn:760516 gap-7 final verification
        # CC-CMD-2026-07-18-fix-bracketdelta-prefix TASK 5 (live).
        # Resolves the STAGED probe from that session (sandbox blocked egress).
        # Fix: bracket-do.js was writing game_id='espn:760516' (with prefix); findBracketDelta
        # queries with espn_event_id='760516' (bare) — exact-match WHERE clause never matched.
        # Fix: String(triggerResult.gameId).replace(/^[a-z]+:/, '') at write time.
        # D1 backfill: the one existing broken row was corrected via direct UPDATE (changes:1).
        # This step verifies the full chain: KV cache miss → D1 query → bracketDelta populated.
        # X-Cache:HIT means the 300s TTL hasn't expired yet — soft-warn but don't fail CI.
        # X-Cache:MISS means fresh D1 read — bracketDelta must be non-null (hard fail if not).
        run: |
          python3 - <<'PYEOF'
import json, sys, urllib.request

UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
RELAY = 'https://field-relay-nba.jeffunglesbee.workers.dev'
GAME_ID = 'espn:760516'

req = urllib.request.Request(
    f'{RELAY}/context/game/{GAME_ID}',
    headers={'User-Agent': UA},
)
with urllib.request.urlopen(req, timeout=20) as r:
    xcache = r.getheader('X-Cache', 'MISS')
    body = r.read()

d = json.loads(body)
bracket_delta = d.get('bracketDelta')
print(f'X-Cache: {xcache}')
print(f'bracketDelta: {json.dumps(bracket_delta)[:200] if bracket_delta is not None else "null"}')

if bracket_delta is None:
    if xcache == 'HIT':
        print('SOFT-WARN: bracketDelta null on KV cache HIT — stale 300s TTL response still active. Will self-heal. Not a code failure.')
        sys.exit(0)
    else:
        print(f'FAIL: bracketDelta null on KV cache MISS for {GAME_ID} — fix-bracketdelta-prefix did not take effect.')
        print('Full response:', json.dumps(d))
        sys.exit(1)

tg = bracket_delta.get('triggerGame', '')
print(f'PASS: bracketDelta populated. triggerGame={tg!r}')
PYEOF

      - name: Check for confidence-gate violations
        run: |
          # Find outbox files modified in the last 20 commits (a pragmatic
          # window covering "this same work session" without needing exact
          # correlation to this specific deploy, since outbox commits often
          # land a few minutes after the code commit that triggered deploy).
          RECENT_OUTBOX=$(git log -20 --name-only --pretty=format: -- 'outbox/cc-*.md' | grep -v '^$' | sort -u)
          ACKNOWLEDGED=$(grep -v '^#' docs/confidence-gate-acknowledged.txt | grep -v '^\s*$' || true)
          VIOLATION_FOUND=0
          for f in $RECENT_OUTBOX; do
            [ -f "$f" ] || continue
            if echo "$ACKNOWLEDGED" | grep -qxF "$f"; then
              echo "SKIPPED (acknowledged): $f — see docs/confidence-gate-acknowledged.txt for reason"
              continue
            fi
            SCORE=$(sed -n '/^## Confidence Score/,$p' "$f" | grep -oE '[0-9]+/100' | grep -oE '^[0-9]+' | tail -1)
            [ -z "$SCORE" ] && continue
            if [ "$SCORE" -lt 95 ]; then
              # Real violation only if src/ was actually touched in the
              # same recent window -- a sub-95 outbox with no code change
              # (i.e. it correctly stopped) is not a violation.
              SRC_TOUCHED=$(git log -20 --name-only --pretty=format: -- 'src/*.js' | grep -v '^$' | wc -l)
              if [ "$SRC_TOUCHED" -gt 0 ]; then
                echo "CONFIDENCE-GATE VIOLATION: $f reports $SCORE/100 (below 95) alongside real src/ changes in recent history."
                VIOLATION_FOUND=1
              fi
            fi
          done
          if [ "$VIOLATION_FOUND" -eq 1 ]; then
            echo "See output above for details." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "No confidence-gate violations detected in recent outbox history."

      - name: Rule registry check -- no unregistered "## Rule N" (N>=89) in STANDARDS.md or CLAUDE-CODE-PROMPT-RULES.md
        # CC-CMD-2026-07-11-rule89-collision-resolution TASK 5. Prevents a
        # second, uncoordinated rule-numbering authority from silently
        # existing again -- exactly how the Rule 89 collision this CC-CMD
        # closes was actually found (three days later, by accident).
        env:
          RELAY_GH_PAT: ${{ secrets.RELAY_GH_PAT }}
        run: |
          echo "" | base64 -d > /tmp/rule_registry_check.py
          python3 /tmp/rule_registry_check.py

      - name: Rule 90 staleness check -- no UNEXERCISED rule-registry entry older than 14 days
        # CC-CMD-2026-07-11-standards-rule90 TASK 3. Same D1 codex query
        # mechanism as the Rule 89 collision-resolution registry-existence
        # check added earlier tonight -- a distinct, complementary concern
        # (that check catches "never registered at all"; this one catches
        # "registered but never exercised within 14 days").
        run: |
          echo "" | base64 -d > /tmp/rule90_staleness_check.py
          python3 /tmp/rule90_staleness_check.py

      - name: Completion field-list superset check -- every COMPLETION_FIELDS member wired into both /archive/score-by-id and /archive/game
        # CC-CMD-2026-07-12-completion-field-parity TASK 2. Structural guardrail
        # against the exact root cause this CC-CMD fixed (went_to_ot) and the
        # inverse gap it found while building this check (finalized_at was never
        # set by /archive/game at all) -- a field added to one write path must
        # not be able to silently go missing from the other again.
        env:
          RELAY_GH_PAT: ${{ secrets.RELAY_GH_PAT }}
        run: |
          echo "" | base64 -d > /tmp/completion_field_parity_check.py
          python3 /tmp/completion_field_parity_check.py

      - name: Went-to-OT live invariant -- every MLB/WNBA row with finalized_at set also has went_to_ot set
        # CC-CMD-2026-07-12-completion-field-parity TASK 2 (revised)/TASK 3. Live
        # invariant, not a hardcoded point-check -- queries D1 directly on every
        # run and checks a genuine relationship between two independently-writable
        # fields, not one fixed example. Proven live to actually FAIL on a real
        # injected violation (then restore) during this CC-CMD's own verification --
        # see outbox/cc-completion-field-parity-2026-07-12.md for the recorded
        # fail-then-pass proof. Population is finalized_at IS NOT NULL (both write
        # paths set it the moment a row is genuinely complete) AND sport IN
        # ('MLB','WNBA') (the only two sports computeWentToOT can resolve via this
        # pipeline). Rows outside this population are a known, separate,
        # pre-existing backlog (reported below, not asserted against) -- retroactively
        # repairing it is its own dedicated backfill effort, same precedent as the
        # drama_peak saga this CC-CMD is modeled on.
        run: |
          echo "" | base64 -d > /tmp/wenttoot_invariant_check.py
          python3 /tmp/wenttoot_invariant_check.py

      - name: Soccer league label contract check -- every espnLeague-routed sportKey returns its real league name
        # CC-CMD-2026-07-14-soccer-league-label TASK 2. adaptESPNWCSoccer
        # hardcoded league:'FIFA World Cup' for all 13 competitions routed
        # through it (wc26 + 12 club leagues) for 3 weeks with zero thrown
        # exceptions or failed requests -- HTTP 200 with valid-looking JSON
        # the entire time. This check reads the sportKey list directly from
        # V2_LEAGUES (not a hardcoded key list) and the expected names from
        # SOCCER_LEAGUE_LABELS (both in src/index.js), so a future sport
        # added to either table is automatically covered. Zero games on a
        # given day is NOT a failure -- most leagues have zero games most
        # days; only a real, present game with a mismatched label fails
        # this check. Proven live (see outbox) to actually catch the
        # original bug shape (12/13 keys mismatched under the reverted
        # code) before being proven to pass against the real fix.
        env:
          RELAY_GH_PAT: ${{ secrets.RELAY_GH_PAT }}
        run: |
          echo "" | base64 -d > /tmp/soccer_league_label_check.py
          python3 /tmp/soccer_league_label_check.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outbox/live-verify-*.md
          git commit -m "chore: post-deploy live verification [skip ci]" || echo "nothing to commit"
          git push
