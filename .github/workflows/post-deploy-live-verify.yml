name: Post-deploy live verification
on:
  workflow_run:
    workflows: ["Deploy RELAY Worker"]  # confirmed exact name via
                                          # `grep "^name:" .github/workflows/deploy.yml`
                                          # 2026-07-04 — do not re-guess this
    types: [completed]

permissions:
  contents: write

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 25  # git log -20 in confidence-gate step requires ≥20 commits

      - name: Live-check endpoints
        run: |
          DATE=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d "yesterday" +%Y-%m-%d)
          OUT="outbox/live-verify-${{ github.event.workflow_run.id }}.md"
          mkdir -p outbox
          {
            echo "# Post-deploy live verification"
            echo "Run: ${{ github.event.workflow_run.id }} · Commit: ${{ github.event.workflow_run.head_sha }} · $(date -u)"
            echo
            echo "## /circadian/preview + /circadian/late (today + yesterday)"
            for phase in preview late; do
              for d in "$DATE" "$YESTERDAY"; do
                echo "### $phase / $d"
                curl -sf "https://field-relay-nba.jeffunglesbee.workers.dev/circadian/$phase/$d" || echo "REQUEST FAILED"
                echo
              done
            done
            echo "## Validation checks"
            echo "### bogus phase (expect 400)"
            curl -s -w "\nHTTP:%{http_code}\n" "https://field-relay-nba.jeffunglesbee.workers.dev/circadian/bogus/$DATE"
            echo "### bad date (expect 400)"
            curl -s -w "\nHTTP:%{http_code}\n" "https://field-relay-nba.jeffunglesbee.workers.dev/circadian/preview/not-a-date"
          } > "$OUT"
          cat "$OUT"

      - name: Check for confidence-gate violations
        run: |
          # Find outbox files modified in the last 20 commits (a pragmatic
          # window covering "this same work session" without needing exact
          # correlation to this specific deploy, since outbox commits often
          # land a few minutes after the code commit that triggered deploy).
          RECENT_OUTBOX=$(git log -20 --name-only --pretty=format: -- 'outbox/cc-*.md' | grep -v '^$' | sort -u)
          ACKNOWLEDGED=$(grep -v '^#' docs/confidence-gate-acknowledged.txt | grep -v '^\s*$' || true)
          VIOLATION_FOUND=0
          for f in $RECENT_OUTBOX; do
            [ -f "$f" ] || continue
            if echo "$ACKNOWLEDGED" | grep -qxF "$f"; then
              echo "SKIPPED (acknowledged): $f — see docs/confidence-gate-acknowledged.txt for reason"
              continue
            fi
            SCORE=$(sed -n '/^## Confidence Score/,$p' "$f" | grep -oE '[0-9]+/100' | grep -oE '^[0-9]+' | tail -1)
            [ -z "$SCORE" ] && continue
            if [ "$SCORE" -lt 95 ]; then
              # Real violation only if src/ was actually touched in the
              # same recent window -- a sub-95 outbox with no code change
              # (i.e. it correctly stopped) is not a violation.
              SRC_TOUCHED=$(git log -20 --name-only --pretty=format: -- 'src/*.js' | grep -v '^$' | wc -l)
              if [ "$SRC_TOUCHED" -gt 0 ]; then
                echo "CONFIDENCE-GATE VIOLATION: $f reports $SCORE/100 (below 95) alongside real src/ changes in recent history."
                VIOLATION_FOUND=1
              fi
            fi
          done
          if [ "$VIOLATION_FOUND" -eq 1 ]; then
            echo "See output above for details." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "No confidence-gate violations detected in recent outbox history."

      - name: Rule registry check -- no unregistered "## Rule N" (N>=89) in STANDARDS.md or CLAUDE-CODE-PROMPT-RULES.md
        # CC-CMD-2026-07-11-rule89-collision-resolution TASK 5. Prevents a
        # second, uncoordinated rule-numbering authority from silently
        # existing again -- exactly how the Rule 89 collision this CC-CMD
        # closes was actually found (three days later, by accident).
        env:
          RELAY_GH_PAT: ${{ secrets.RELAY_GH_PAT }}
        run: |
          echo "" | base64 -d > /tmp/rule_registry_check.py
          python3 /tmp/rule_registry_check.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outbox/live-verify-*.md
          git commit -m "chore: post-deploy live verification [skip ci]" || echo "nothing to commit"
          git push
