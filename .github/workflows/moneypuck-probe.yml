name: moneypuck-probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/moneypuck-probe.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm MoneyPuck regular-season goalie CSV exists in the same shape as playoffs
        run: |
          echo "" | base64 -d > /tmp/moneypuck_probe.py
          python3 /tmp/moneypuck_probe.py
