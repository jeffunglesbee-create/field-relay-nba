name: TEMP QC KV Restore

on:
  push:
    paths: ['.github/workflows/temp-qc-kv-restore.yml']

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore field:quality_calibration to its original value
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -w "\nHTTP:%{http_code}\n" -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: text/plain" \
            --data-binary @qc_restore.json \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/83edf19398da4ed184a42746cb85c9d7/values/field%3Aquality_calibration"
