name: TEMP QC KV Read

on:
  push:
    paths: ['.github/workflows/temp-qc-kv-read.yml']

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read field:quality_calibration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -w "\nHTTP:%{http_code}\n" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/83edf19398da4ed184a42746cb85c9d7/values/field%3Aquality_calibration"
