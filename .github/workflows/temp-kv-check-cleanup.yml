name: TEMP KV Check And Cleanup

on:
  push:
    paths: ['.github/workflows/temp-kv-check-cleanup.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check backfill:tried keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== 2026-07-14 ==="
          curl -sS -w "\nHTTP:%{http_code}\n" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/83edf19398da4ed184a42746cb85c9d7/values/backfill%3Atried%3A2026-07-14"
          echo "=== 2026-05-18 (expected: exists, correct) ==="
          curl -sS -w "\nHTTP:%{http_code}\n" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/83edf19398da4ed184a42746cb85c9d7/values/backfill%3Atried%3A2026-05-18"
          echo "=== delete 2026-07-14 if present (incorrect, from pre-fix test run) ==="
          curl -sS -w "\nHTTP:%{http_code}\n" -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/83edf19398da4ed184a42746cb85c9d7/values/backfill%3Atried%3A2026-07-14"
