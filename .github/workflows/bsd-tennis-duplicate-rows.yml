name: BSD Tennis Duplicate Rows

# Why is a player in two first-round matches?
#
# The player-twice guard on /bsd/tennis/draw refused two of the three editions
# it was verified against. Two readings fit and they call for opposite fixes:
# either two editions leaked past the season partition (the guard is right), or
# a cancelled fixture sits beside its replacement (the guard is too strict).
#
# This prints both rows of every duplicate so the question decides the fix,
# rather than the fix being written from the more convenient reading.
#
# Dispatch-only. This answers a question once; it is not a monitor.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Print both rows of every duplicate
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: node scripts/bsd-tennis-duplicate-rows.mjs
      - name: Commit the reading
        if: always()
        run: |
          git config user.email "claude@field.dev"
          git config user.name  "FIELD CI"
          git add outbox/bsd-tennis-duplicate-rows-*.json || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "probe: why a player appears in two first-round rows"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          exit 1
