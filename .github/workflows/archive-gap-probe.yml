# .github/workflows/archive-gap-probe.yml
#
# CI-as-proxy for CC-CMD-2026-08-08-investigate-mlb-wnba-archive-gap.
#
# The discriminating query has to go through POST /d1/execute (raw table read,
# no sport predicate), and the only GET-capable escape hatch from a session
# sandbox -- probe_relay_route -- cannot POST. This sandbox's proxy also
# returns 403 for *.workers.dev outright. A runner has unrestricted egress,
# which is the same reason the soccer-league-mislabel probe lives here.
#
# Read-only by construction: the script issues SELECTs only, and the CC-CMD
# forbids applying a fix.

name: Archive D1 probe

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Probe script under scripts/ to run'
        required: false
        default: 'archive-gap-probe.mjs'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run the probe
        # SCRIPT arrives via env, not `${{ }}` interpolated straight into the
        # shell line: a workflow_dispatch input is attacker-controllable by
        # anyone who can dispatch, and inline interpolation would let the
        # value close the quote and run arbitrary commands on a runner holding
        # `contents: write`. env passes it as data.
        env:
          SCRIPT_INPUT: ${{ inputs.script }}
        run: |
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          SCRIPT="${SCRIPT_INPUT:-archive-gap-probe.mjs}"
          # Reject anything but a bare .mjs filename -- no slashes, no ..
          case "$SCRIPT" in
            */*|*..*|"") echo "::error::invalid script input: $SCRIPT"; exit 1 ;;
            *.mjs) ;;
            *) echo "::error::script must end in .mjs: $SCRIPT"; exit 1 ;;
          esac
          test -f "scripts/$SCRIPT" || { echo "::error::scripts/$SCRIPT does not exist"; exit 1; }
          NAME="${SCRIPT%.mjs}"
          echo "TS=$TS" >> "$GITHUB_ENV"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          mkdir -p outbox
          node "scripts/${SCRIPT}" 2>&1 | tee "outbox/${NAME}-${TS}.log"
          # tee returns the exit status of tee, so ask the pipeline explicitly.
          exit "${PIPESTATUS[0]}"

      - name: Commit the log
        if: always()
        run: |
          git config user.email "archive-gap-probe@field"
          git config user.name "Archive-Gap-Probe"
          # Separate `git add` per pathspec: `git add` is atomic across
          # pathspecs under `bash -e`, so one unmatched glob would abort the
          # step before the push -- the defect that really hit
          # soccer-league-mislabel-scope-probe.yml on 2026-08-06.
          git add "outbox/${NAME}-${TS}.log" || echo "(no log to stage)"
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: ${NAME} output [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main -q && git rebase origin/main -q && git push origin main && exit 0
            echo "push attempt $i failed, retrying"
            sleep $((i * 3))
          done
          echo "::error::probe log could not be pushed after 5 attempts"
          exit 1
