name: TEMP Secret Rotation Verify

# TEMP-SECRET-ROTATION-VERIFY-2026-07-14: confirms FIELD_MCP_SECRET was
# genuinely rotated after the leak found in CC-CMD-2026-07-13-rule89-
# scoped-tools. Tests that the OLD leaked value is now rejected and the
# NEW value (from the repo secret) works. Does NOT print either value
# anywhere -- no set -x, no echoing headers, only HTTP status codes and
# small non-secret response snippets. Delete after use.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Confirm rotation (status codes only, never print secret values)
        env:
          FIELD_MCP_SECRET: ${{ secrets.FIELD_MCP_SECRET }}
        run: |
          mkdir -p outbox
          OUT="outbox/temp-secret-rotation-verify.txt"
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev/mcp"
          OLD_LEAKED_VALUE="***REDACTED-FIELD-MCP-SECRET***"

          echo "=== 1. OLD leaked value should now be REJECTED (expect 401) ===" > "$OUT"
          OLD_STATUS=$(curl -sS -o /tmp/old_resp.json -w "%{http_code}" -X POST "$RELAY" \
            -H "Authorization: Bearer $OLD_LEAKED_VALUE" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')
          echo "HTTP status: $OLD_STATUS" >> "$OUT"
          if [ "$OLD_STATUS" = "401" ]; then
            echo "RESULT: PASS -- old leaked value correctly rejected" >> "$OUT"
          else
            echo "RESULT: FAIL -- old leaked value still works! Rotation did not take effect." >> "$OUT"
          fi

          echo "" >> "$OUT"
          echo "=== 2. NEW value (from repo secret) should WORK (expect 200) ===" >> "$OUT"
          NEW_STATUS=$(curl -sS -o /tmp/new_resp.json -w "%{http_code}" -X POST "$RELAY" \
            -H "Authorization: Bearer $FIELD_MCP_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')
          echo "HTTP status: $NEW_STATUS" >> "$OUT"
          if [ "$NEW_STATUS" = "200" ]; then
            TOOL_COUNT=$(python3 -c "import json; d=json.load(open('/tmp/new_resp.json')); print(len(d['result']['tools']))")
            echo "RESULT: PASS -- new rotated value works, $TOOL_COUNT tools listed" >> "$OUT"
          else
            echo "RESULT: FAIL -- new value does not work" >> "$OUT"
          fi

          echo "" >> "$OUT"
          echo "=== Confirming neither secret value appears in this output ===" >> "$OUT"
          if grep -q "$OLD_LEAKED_VALUE" "$OUT"; then
            echo "!!! LEAK DETECTED IN OUTPUT FILE !!!" >> "$OUT"
          else
            echo "Confirmed clean: old value string not present in this output file." >> "$OUT"
          fi

          cat "$OUT"

      - name: Push result
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Debug-Probe"
          git add outbox/
          git commit -m "temp: secret rotation verify capture [skip ci]" || echo "(nothing to commit)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
