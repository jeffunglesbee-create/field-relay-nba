name: CFL date-keying migration

# CC-CMD-2026-10-16-cfl-archive-date-keying, TASK 3. The CFL rows the archive
# writer keyed on the UTC day.
#
# NEITHER MODE WRITES TO D1.
#   dry-run  plan, collisions, references; commits the plan and the
#            single-transaction SQL to outbox/
#   verify   reads every planned row back against a committed plan
#
# The write between them is that committed SQL, sent as one call to the D1
# REST API by a holder of a D1-capable credential. This repository's
# CLOUDFLARE_API_TOKEN is not one (7403, measured on this workflow's first
# run), and /d1/execute takes one statement, which would split each row's
# transaction in two. scripts/migrate-cfl-date-keying.mjs has the detail.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run | verify"
        required: true
        default: "dry-run"
      plan:
        description: "verify only: path of the dry-run manifest whose SQL was applied"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: cfl-date-keying-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Resolved once, so the run step, the file name and the commit message
      # cannot disagree about which mode ran.
      MODE: ${{ github.event.inputs.mode }}
      PLAN: ${{ github.event.inputs.plan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Self-test
        run: node scripts/migrate-cfl-date-keying.mjs --self-test

      - name: Migrate (${{ github.event.inputs.mode }})
        env:
          RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
        run: |
          set -o pipefail
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          OUT="outbox/cfl-date-keying-migration-${MODE}-${STAMP}"
          case "$MODE" in
            dry-run) node scripts/migrate-cfl-date-keying.mjs --out="$OUT" 2>&1 | tee "$OUT.log" ;;
            verify)  node scripts/migrate-cfl-date-keying.mjs --verify --plan="$PLAN" --out="$OUT" 2>&1 | tee "$OUT.log" ;;
            *)       echo "mode must be dry-run or verify, got '$MODE'" | tee "$OUT.log"; exit 1 ;;
          esac

      # TASK 4's guard, run against the same tables and committed with them,
      # because a job log is not an artifact. Before the apply it is EXPECTED
      # to fail and name every off-day row: that output is the before-baseline.
      # In verify mode anything but exit 0 fails this run.
      - name: Archive date-keying guard
        if: always()
        env:
          RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
        run: |
          set +e
          OUT="outbox/cfl-date-keying-guard-${MODE}-$(date -u +%Y%m%dT%H%M%SZ).log"
          node scripts/check-archive-date-keying.mjs > "$OUT" 2>&1
          code=$?
          echo "guard exit $code" >> "$OUT"
          cat "$OUT"
          if [ "$MODE" = verify ] && [ "$code" -ne 0 ]; then exit 1; fi
          exit 0

      - name: Commit the manifest
        if: always()
        run: |
          git config user.name "FIELD CI"
          git config user.email "claude@field.dev"
          # Separate adds: `git add` is atomic across pathspecs, and an
          # unmatched glob would abort the other.
          git add outbox/cfl-date-keying-migration-*.json || echo "no manifest"
          git add outbox/cfl-date-keying-migration-*.log || echo "no log"
          git add outbox/cfl-date-keying-migration-*.sql || echo "no sql"
          git add outbox/cfl-date-keying-guard-*.log || echo "no guard log"
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore: CFL date-keying migration ($MODE)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
          # The loop exits 0 when every attempt fails (its last command is
          # sleep). is-ancestor, not HEAD equality: another bot pushing after us
          # is normal and must not read as our failure.
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after 5 attempts"; exit 1; }
