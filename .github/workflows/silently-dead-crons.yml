name: Silently dead crons (read-only)

# odds-backfill.yml was red on every scheduled run from 2026-09-01 to
# 2026-09-15 — fifteen days, same error, exit 1 before its own logic ran.
# Nobody saw it because every check in this repo asks about ONE workflow at a
# time, and a cron that dies at its first guard leaves no artifact and no diff.
#
# WIDENED TO FOUR REPOS 2026-09-17, on the same evidence one level out. Scoped
# to its own repo it reported 0 dead crons on a day when:
#   field-laboratory / drift-sentinel   8 consecutive scheduled failures (from 09-13)
#   field-playground / Build Check      3 consecutive scheduled failures (from 09-15)
# Both crossed its own STREAK threshold; neither was in its 150 workflows.
#
# READ-ONLY: GitHub API, GET only. No D1, no relay.

on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The predicate must be able to fail before its verdict means anything.
      # These three are pure, so they run without credentials — which matters
      # here because a sandbox has no real token and the live half can only be
      # exercised by this workflow.
      - name: the watch can fail
        run: |
          node scripts/watch-silently-dead-crons.mjs --self-test
          node scripts/mutate-silently-dead-crons.mjs

      # RELAY_GH_PAT, not the run's GITHUB_TOKEN. The default token is scoped to
      # the repository it runs in, so with it this watch can only ever see
      # field-relay-nba — which is precisely the blindness being fixed. The PAT
      # is the established cross-repo mechanism here: eight workflows already
      # use it, including contracts-identity-check.yml, which checks out
      # jubilant-bassoon with it. If it cannot reach a listed repo, ghAll throws
      # and this run goes red by name rather than quietly surveying fewer repos.
      - name: Watch
        env:
          GITHUB_TOKEN: ${{ secrets.RELAY_GH_PAT }}
        run: node scripts/watch-silently-dead-crons.mjs
      - name: Commit the log
        if: always()
        run: |
          PROBE_AUTHOR_NAME="silently-dead-crons" \
          PROBE_AUTHOR_EMAIL="actions@github.com" \
          bash scripts/probe-commit-retry.sh "chore: silently dead crons watch"
