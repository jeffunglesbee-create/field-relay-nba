name: Score Fill (one-shot)

on:
  workflow_dispatch:
  schedule:
    - cron: '50 3,7,11,15,19,23 * * *'   # 10 min before every other drama-backfill (04:00, 08:00, 12:00, 16:00, 20:00, 00:00)

jobs:
  score-fill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run score fill
        env:
          RELAY_BASE: https://field-relay-nba.jeffunglesbee.workers.dev
        run: node scripts/score-fill.mjs
