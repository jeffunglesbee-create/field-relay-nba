name: Score Fill (one-shot)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'   # every 4h — runs upstream of drama-backfill (2h cron) so session-less games get scores before drama scoring attempts them

jobs:
  score-fill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run score fill
        env:
          RELAY_BASE: https://field-relay-nba.jeffunglesbee.workers.dev
        run: node scripts/score-fill.mjs
