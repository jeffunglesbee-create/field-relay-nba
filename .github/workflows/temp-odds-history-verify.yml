name: TEMP Odds History Verify

# TEMP-ODDS-HISTORY-VERIFY-2026-07-13: live verification for the resolved
# /odds/history/{game_id} route (CC-CMD-2026-07-13-odds-history-shadow-fix).
# Real game_id with real odds_history rows + adjacent /odds/* passthrough
# regression check + a forced empty-result case (real game_id format, no
# rows) to distinguish "no data" from a real query error. Delete after use.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Real live checks
        run: |
          set -x
          mkdir -p outbox
          OUT="outbox/temp-odds-history-result.txt"

          echo "=== real game_id with real odds_history rows ===" > "$OUT"
          curl -sS -D - "https://field-relay-nba.jeffunglesbee.workers.dev/odds/history/wnba_2026-06-28_goldenstat_newyorklib" >> "$OUT" 2>&1
          echo "" >> "$OUT"

          echo "=== game_id with zero rows (valid format, no data -- should be ok:true, odds:[]) ===" >> "$OUT"
          curl -sS -D - "https://field-relay-nba.jeffunglesbee.workers.dev/odds/history/nonexistent_game_id_zzz" >> "$OUT" 2>&1
          echo "" >> "$OUT"

          echo "=== missing game_id (should be 400) ===" >> "$OUT"
          curl -sS -D - "https://field-relay-nba.jeffunglesbee.workers.dev/odds/history/" >> "$OUT" 2>&1
          echo "" >> "$OUT"

          echo "=== adjacent /odds/* passthrough regression check ===" >> "$OUT"
          curl -sS -D - "https://field-relay-nba.jeffunglesbee.workers.dev/odds/v4/sports" >> "$OUT" 2>&1
          echo "" >> "$OUT"

          cat "$OUT"
      - name: Push result
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Debug-Probe"
          git add outbox/
          git commit -m "temp: odds-history verify capture [skip ci]" || echo "(nothing to commit)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
