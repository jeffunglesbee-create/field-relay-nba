name: TEMP Catch Tail Verify

# TEMP-CATCH-VERIFY-2026-07-13: forced-failure telemetry verification for
# relay-empty-catches-cluster1. Delete after use — see
# docs/CC-CMD-2026-07-13-relay-empty-catches-cluster1.md

on:
  workflow_dispatch:
    inputs:
      search:
        description: 'wrangler tail --search filter'
        required: true
        default: '[GOLF]'
      duration:
        description: 'seconds to tail'
        required: false
        default: '50'

permissions:
  contents: write

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install --no-save wrangler

      - name: Tail worker logs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEARCH: ${{ github.event.inputs.search }}
          DURATION: ${{ github.event.inputs.duration }}
        run: |
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          OUT="outbox/temp-catch-tail-${TS}.json"
          mkdir -p outbox
          timeout "${DURATION}s" npx wrangler tail --format json --search "$SEARCH" > "$OUT" 2>&1 || true
          echo "=== File: $OUT ==="
          cat "$OUT"
          echo "OUT=$OUT" >> $GITHUB_ENV

      - name: Push result
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Debug-Probe"
          git add outbox/
          git commit -m "temp: catch-tail verify capture [skip ci]" || echo "(nothing to commit)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
