name: Probe Bundesliga Default Matchday View

# One-shot: CC-CMD-2026-08-02-resolve-dayid-date-mode TASK 1. Real, fresh
# check of what the unparametrized bundesliga.com/en/bundesliga/matchday
# URL (no season/matchday suffix) currently returns for its default
# broadcasts request. This repo has no Playwright devDependency -- install
# it fresh in CI only (--no-save), same one-shot pattern as every other
# CI-as-proxy probe in this project.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install playwright (CI-only, not saved to package.json)
        run: npm install --no-save playwright
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run probe
        run: node scripts/probe-bundesliga-default-matchday-view.mjs
        continue-on-error: true
      - name: Push result
        run: |
          git config user.email "probe-bundesliga-default-matchday@field"
          git config user.name "Probe-Bundesliga-Default-Matchday"
          git add outbox/probe-bundesliga-default-matchday-view-result.json 2>/dev/null || true
          git diff --cached --quiet && echo "No result to commit" && exit 0
          git commit -m "probe-bundesliga-default-matchday-view result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
      - name: Print result
        if: always()
        run: cat outbox/probe-bundesliga-default-matchday-view-result.json 2>/dev/null || echo "No result file produced"
