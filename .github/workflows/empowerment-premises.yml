name: Empowerment Premises

# The premise pass for field-laboratory docs/CC-CMD-2026-10-15-empowerment-metrics.md
# Tasks 1-3, run before their types are built (lab CLAUDE.md Rule 100). JSON
# counting over every non-shell BSD capture in R2 and over 328 NHL games of the
# 2025-26 regular season; no metric is computed. DISPATCH ONLY.
#
# The R2 walk is copied from field-laboratory scripts/probe-empowerment.mjs
# (that repo is private; run 38962039219 could not fetch it), and the artifact
# checks the copy against the source's own census count of 786.
# BSD_API_TOKEN is read for P4's kickoff rows only; without it P4 says UNMEASURED.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  premises:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Self-test (every counter is driven non-zero, and kept at zero, on purpose)
        run: node scripts/empowerment-premises.mjs --self-test
      - name: Premise pass
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: node scripts/empowerment-premises.mjs
      - name: Commit the artifact
        if: always()
        run: |
          git config user.email "claude@field.dev"
          git config user.name  "FIELD CI"
          test -f outbox/empowerment-premises-latest.json || { echo "no artifact written"; exit 1; }
          git add outbox/empowerment-premises-latest.json
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "probe: empowerment premise pass (run $GITHUB_RUN_ID)"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          exit 1
