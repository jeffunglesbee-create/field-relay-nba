name: Verify Resolve Dayid Date Mode

# One-shot: CC-CMD-2026-08-02-resolve-dayid-date-mode TASK 3. Real, live
# verification of the new date-mode against a known real (season, date,
# matchday) triple from this session's own pre-build probe, cross-checked
# against the existing, untouched matchday-number mode.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run verification
        run: node scripts/verify-resolve-dayid-date-mode.mjs
        continue-on-error: true
      - name: Push result
        run: |
          git config user.email "verify-resolve-dayid-date-mode@field"
          git config user.name "Verify-Resolve-Dayid-Date-Mode"
          git add outbox/verify-resolve-dayid-date-mode-result.json 2>/dev/null || true
          git diff --cached --quiet && echo "No result to commit" && exit 0
          git commit -m "verify-resolve-dayid-date-mode result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
      - name: Print result
        if: always()
        run: cat outbox/verify-resolve-dayid-date-mode-result.json 2>/dev/null || echo "No result file produced"
