name: Odds backfill (spend-capped, one sport)

# docs/CC-CMD-2026-11-22-epl-rows-left-unpriced-by-c-palace.md, Task 2: repair the EPL rows the C Palace defect left without odds.
# GET /archive/odds-backfill is gated (FIELD_MCP_SECRET), WRITES opening_odds where it is NULL, and every call is a billed
# historical vendor fetch at 30 credits per sport-date. Dispatch-only, and the cap is in scripts/run-odds-backfill-capped.mjs, not in
# this file: the owner's credit number is a required input and the run refuses to cost more; a date is attempted once (a result
# file in outbox/ makes a repeat refuse, and it is written BEFORE the request); at most nine sport-dates; one sport; one attempt per
# date; the first failure ends the run; a call that spends credits and writes nothing ends it too. A PREFLIGHT runs first: a relay
# that has not deployed ?sport= would fetch every sport on the date, so the run is refused unless the relay answers 400 to an
# unknown label (the preflight names a date with no rows and costs nothing on either relay).
on:
  workflow_dispatch:
    inputs:
      dates:
        description: 'Up to 9 dates, YYYY-MM-DD, comma-separated, none twice. Each is 30 credits for the sport.'
        required: true
      sport:
        description: 'One sport, as the archive labels it (letters, digits and spaces; no list)'
        required: false
        default: 'EPL'
      approved_credits:
        description: 'The number of credits the owner approved, a whole number. The run refuses if dates x 30 is more.'
        required: true
      preflight_only:
        description: 'Check ONLY that the deployed relay honours ?sport= (no billed request, no file). Needs the same inputs.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: odds-backfill-capped
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # nine calls, each bounded at 120 s by the script; the first failure ends the run
    steps:
      # `ref: main`, so a dispatch that queued behind another one reads the result files the first one committed: the script
      # refuses a date that already has one. Every step runs on attempt 1 only: "Re-run jobs" repeats the same inputs on the same
      # commit, which would not see the first attempt's files, and a re-run would spend again.
      - uses: actions/checkout@v4
        with:
          ref: main

      # The inputs travel through `env`, never spliced into the script text.
      - name: Run the backfill, one attempt per date, no retry
        if: github.run_attempt == 1
        env:
          BACKFILL_DATES: ${{ inputs.dates }}
          BACKFILL_SPORT: ${{ inputs.sport }}
          APPROVED_CREDITS: ${{ inputs.approved_credits }}
          PREFLIGHT_ONLY: ${{ inputs.preflight_only && '1' || '' }}
          FIELD_MCP_SECRET: ${{ secrets.FIELD_MCP_SECRET }}
        run: node scripts/run-odds-backfill-capped.mjs

      # A paid result must not exist only on a runner that is about to be thrown away: it is also printed in the log above.
      - name: Keep the results
        if: always() && github.run_attempt == 1
        uses: actions/upload-artifact@v4
        with:
          name: odds-backfill-results
          path: outbox/odds-backfill-*-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*Z.json   # this runner's files only: other tools' outbox/odds-backfill-*.json are tracked
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit the results
        if: always() && github.run_attempt == 1
        run: |
          git config user.name "FIELD CI"
          git config user.email "claude@field.dev"
          git add outbox/odds-backfill-*-[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*Z.json || { echo "no result"; exit 0; }
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "outbox: odds backfill results"
          LOG=/tmp/push.log; : > "$LOG"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main >>"$LOG" 2>&1 \
               && git push origin main >>"$LOG" 2>&1; then
              echo "Pushed on attempt $i."; exit 0
            fi
            sleep $((i * 5))
          done
          echo "::group::push log"; cat "$LOG"; echo "::endgroup::"
          if grep -qiE 'denied|403|permission|forbidden' "$LOG"; then
            echo "Push failed on PERMISSIONS."
          fi
          # The push did not land, and this step does not turn that green: the results are in the artifact and the log.
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::the results are NOT on main; they are in the run's artifact and in the log above. Do not re-run: it would spend again."; exit 1; }
