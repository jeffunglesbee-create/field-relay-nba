name: Cache Tail Diagnostic (temporary, CC-CMD-2026-07-08-afl-kali-relayfetch-fix)
on:
  workflow_dispatch:

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Tail while triggering real requests
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -x
          # Start tail in the background, filtered to our diagnostic lines,
          # capturing to a file so we can print it after the run regardless
          # of how wrangler tail buffers stdout.
          wrangler tail field-relay-nba --format pretty > tail.log 2>&1 &
          TAIL_PID=$!

          # Give the tail websocket time to establish before firing requests.
          sleep 8

          # Fresh, never-before-requested round numbers each run (based on
          # the workflow run number) so this is always a genuine cold cache
          # key, not polluted by any prior manual testing this session.
          ROUND=$((100 + ${{ github.run_number }}))
          URL="https://field-relay-nba.jeffunglesbee.workers.dev/kali/predictions?year=2026&round=${ROUND}"

          echo "=== Request 1 (expect MISS) ==="
          curl -s -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" "$URL"
          sleep 3

          echo "=== Request 2, 3s later (checking for HIT) ==="
          curl -s -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" "$URL"
          sleep 3

          echo "=== Request 3, 3s later ==="
          curl -s -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" "$URL"

          # Let any trailing log lines flush before we stop tailing.
          sleep 5
          kill $TAIL_PID 2>/dev/null || true
          wait $TAIL_PID 2>/dev/null || true

          echo "=== Captured tail.log ==="
          cat tail.log
