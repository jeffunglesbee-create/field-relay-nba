name: Probe template self-test

# CC-CMD-2026-08-09-create-field-laboratory-repo, Task 6.
#
# The worked example of a CALLER of _reusable-probe.yml, and the real
# verification that the ported template works in this repo.
#
# The `permissions` block below is the point, not boilerplate. A reusable
# workflow can only NARROW what its caller grants, never widen it -- so the
# template's own `permissions: contents: write` is insufficient unless the
# caller grants it too. That was the one real bug found while building the
# original, and it is the thing most likely to be dropped when someone copies
# this file as a starting point.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selftest:
    uses: ./.github/workflows/_reusable-probe.yml
    with:
      script: scripts/probe-template-selftest.mjs
      commit_message: "chore: probe template self-test result [skip ci]"
