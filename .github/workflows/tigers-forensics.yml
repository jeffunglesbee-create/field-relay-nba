name: Tigers Forensics (one-shot)

# Task 1 of CC-CMD-2026-09-13-alias-table-silent-overwrite:
#
#   "Confirm or refute the date story for all 68 rows. The artifact is the max
#    date among odds-carrying `Tigers` rows. If any post-dates 2026-08-21, the
#    'no false data' paragraph is wrong and this becomes a data-integrity
#    question, not just a coverage one."
#
# A workflow rather than a probe because the census response carrying the answer
# is ~44KB and the answer sits at the end of it. Runs here, commits the answer,
# and the artifact outlives both.
#
# ONE-SHOT: workflow_dispatch only, no schedule. It exists to close a task, not
# to watch anything. Delete it when the CC-CMD closes.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ask the census for every row named Tigers
        run: |
          python3 << 'PYEOF'
          import json, os, urllib.request
          from datetime import datetime, timezone

          UA = ("Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/124.0 Safari/537.36")
          URL = ("https://field-relay-nba.jeffunglesbee.workers.dev"
                 "/identity/substitution-census?sport=MLB&name=Tigers")

          req = urllib.request.Request(URL, headers={"User-Agent": UA})
          with urllib.request.urlopen(req, timeout=180) as r:
              d = json.loads(r.read())
          if not d.get("ok") or not d.get("complete"):
              raise SystemExit(f"census incomplete: ok={d.get('ok')} {d.get('coverage')}")

          rows = d.get("named_rows") or []
          with_odds = [r for r in rows if r.get("has_opening_odds")]

          # THE FIRST VERSION OF THIS GOT THE VERDICT WRONG, and the way it was
          # wrong is worth keeping. It classified a row by its GAME DATE falling
          # inside the regression window — using the date of play as a proxy for
          # the moment the odds were written. Eleven rows came back "refuting";
          # ten of them were dates backfilled by hand three hours earlier, AFTER
          # the fix, and were entirely correct. Same family as the captured_at
          # trap documented two commits earlier: a date that is easy to reach for
          # standing in for the one that answers the question.
          #
          # WHAT ACTUALLY DECIDES IT is when the row was WRITTEN, against two
          # timestamps that are facts, not estimates:
          FLIP = "2026-08-21T23:17:42Z"   # 0faf37f, the commit that took MLB's alias
          FIX  = "2026-09-13T13:09:00Z"   # e6f57b1 live; hullcity left AMBIGUOUS_TEAM
          def norm(t): return (t or "").replace("+00:00", "Z")

          # A HISTORICALLY BACKFILLED ROW'S captured_at IS THE SNAPSHOT ANCHOR —
          # fetchSportOddsHistorical requests noon UTC on the game's own date, so
          # the stamp lands within minutes of it. A LIVE capture does not. That
          # difference is a durable discriminator and needs no memory of which
          # dates anyone happened to run.
          def is_historical_anchor(r):
              c = norm(r.get("opening_captured_at"))
              if not c or not c.startswith(r["date"]):
                  return False
              hh = c[11:13]
              return hh in ("11", "12")

          buckets = {"written_before_the_flip": [], "written_after_the_fix": [],
                     "backfilled_after_the_fix": [], "SUSPECT": []}
          for r in with_odds:
              c = norm(r.get("opening_captured_at"))
              if not c:
                  buckets["SUSPECT"].append(r)
              elif c < FLIP:
                  buckets["written_before_the_flip"].append(r)
              elif c >= FIX:
                  buckets["written_after_the_fix"].append(r)
              elif is_historical_anchor(r):
                  # Written by a historical backfill. During the window the join
                  # could not reach a Tigers row at all — D1 `Tigers` resolved to
                  # hullcity, the vendor sent `Detroit Tigers` -> detroittigers,
                  # the pair missed — so no backfill inside the window could have
                  # written it. It must post-date the fix.
                  buckets["backfilled_after_the_fix"].append(r)
              else:
                  buckets["SUSPECT"].append(r)

          inside = buckets["SUSPECT"]
          out = {
              "measured_at": datetime.now(timezone.utc).isoformat(),
              "question": "were any odds WRITTEN to a row named Tigers while the alias was wrong?",
              "coverage": d.get("coverage"),
              "rows_named_tigers": len(rows),
              "of_those_with_opening_odds": len(with_odds),
              "max_date_with_opening_odds": d.get("named_max_date_with_opening_odds"),
              "regression_window": {"alias_flipped": FLIP, "fix_deployed": FIX},
              "accounting": {k: len(v) for k, v in buckets.items()},
              "odds_carrying_rows_inside_the_window": inside,
              "verdict": ("REFUTED - odds were written while the alias was wrong"
                          if inside else
                          "CONFIRMED - every odds-carrying row is accounted for by a write "
                          "before the flip or after the fix; none during"),
              "all_rows": rows,
          }
          stamp = datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          path = f"outbox/tigers-forensics-{stamp}.json"
          with open(path, "w") as fh:
              json.dump(out, fh, indent=2)

          summary = [
              "### Tigers forensics — CC-CMD-2026-09-13-alias-table-silent-overwrite Task 1",
              "", f"`{d.get('coverage')}`", "",
              f"- rows named Tigers: **{len(rows)}**",
              f"- of those carrying opening odds: **{len(with_odds)}**",
              f"- max game date with odds: **{out['max_date_with_opening_odds']}**",
              f"- unaccounted-for rows: **{len(inside)}**",
              "", "| how the odds got there | rows |", "|---|---|",
          ] + [f"| {k} | {v} |" for k, v in out["accounting"].items()] + [
              "", f"**{out['verdict']}**",
          ]
          print("\n".join(summary))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(summary) + "\n")
          PYEOF

      - name: Commit the answer
        run: |
          git config user.name "tigers-forensics"
          git config user.email "actions@github.com"
          git add outbox/
          git diff --cached --quiet && exit 0
          git commit -m "probe: tigers forensics — CC-CMD Task 1 [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin main || git rebase --abort || true
            sleep $((i * 5))
          done
          exit 1
