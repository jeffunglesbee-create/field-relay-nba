# Re-run after fixing the POST-method allowlist gate
name: TEMP Jinx Recompute Test

on:
  push:
    paths: ['.github/workflows/temp-jinx-recompute-test.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: POST /analytics/jinx/recompute?date=2026-07-11
        run: |
          python3 << 'PYEOF'
          import urllib.request, urllib.error, json
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          req = urllib.request.Request(
              'https://field-relay-nba.jeffunglesbee.workers.dev/analytics/jinx/recompute?date=2026-07-11',
              method='POST',
              headers={'X-FIELD-Relay': 'field-relay-cron-2026', 'User-Agent': UA},
          )
          try:
              with urllib.request.urlopen(req) as r:
                  print(f"HTTP {r.status}")
                  print(r.read().decode())
          except urllib.error.HTTPError as e:
              print(f"HTTP {e.code}")
              print(e.read().decode())
          PYEOF
