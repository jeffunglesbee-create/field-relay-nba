name: ESPN core API mirror

# docs/CC-CMD-2026-10-14-espn-host-flip.md Task 3 (the owner's order of 2026-11-19, "Move the 5 other
# relay routes to runners"). ESPN's core API answers 403 to the relay Worker and 200 to a runner, so
# this reads it and writes ARCHIVE_DB espn_core_mirror through the relay's /d1/execute; the relay's
# five read sites read that table (src/espn-core-mirror.js).
#
# NO schedule, deliberately: GitHub fires this repo's crons a median 377 minutes apart (measured
# 2026-11-19). The relay's own */15 cron dispatches this (dispatchEspnCoreMirror, src/index.js), and a
# dispatched run starts within seconds. A run passes again every 2 minutes while a soccer game is
# live, for up to 12 minutes, so runs do not overlap; a queued one waits rather than cancelling.
#
# Writes only D1 rows; commits nothing.

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Also sweep finished soccer games this many ET days back (0 to 14)'
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: espn-core-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
      BACKFILL_DAYS: ${{ inputs.backfill_days }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mirror
        run: node scripts/espn-core-mirror.mjs --backfill-days "${BACKFILL_DAYS:-0}"
