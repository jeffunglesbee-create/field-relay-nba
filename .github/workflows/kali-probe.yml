name: kali-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELAY_GH_PAT }}
      - name: Probe Kali H2H + Teams + Tips
        env:
          KALI_KEY: ${{ secrets.KALI_AFL_TOKEN }}
        run: |
          BASE="https://kaliaflstats.com/api/afl/v1"
          H="Authorization: Bearer $KALI_KEY"

          echo "=== teams (first 5) ==="
          curl -sf -H "$H" "$BASE/teams?limit=5" | python3 -m json.tool | tee outbox/kali-teams.txt

          echo "=== h2h: carlton vs collingwood (slug form) ==="
          curl -sv -H "$H" "$BASE/head-to-head?teamA=carlton&teamB=collingwood&limit=5" 2>&1 | tee outbox/kali-h2h-slug.txt

          echo "=== h2h: team IDs from /teams ==="
          CARL_ID=$(curl -sf -H "$H" "$BASE/teams" | python3 -c "import sys,json; teams=json.load(sys.stdin)['data']; carl=[t for t in teams if 'carlton' in t.get('id','').lower()]; print(carl[0]['id'] if carl else 'not-found')")
          echo "Carlton ID: $CARL_ID"
          COLL_ID=$(curl -sf -H "$H" "$BASE/teams" | python3 -c "import sys,json; teams=json.load(sys.stdin)['data']; coll=[t for t in teams if 'collingwood' in t.get('id','').lower()]; print(coll[0]['id'] if coll else 'not-found')")
          echo "Collingwood ID: $COLL_ID"
          curl -sf -H "$H" "$BASE/head-to-head?teamA=$CARL_ID&teamB=$COLL_ID&limit=5" | python3 -m json.tool | tee outbox/kali-h2h-ids.txt

          echo "=== tips round 16 ==="
          curl -sf -H "$H" "$BASE/tips?year=2026&round=16&limit=3" | python3 -m json.tool | tee outbox/kali-tips.txt

          echo "=== predictions round 16 ==="
          curl -sf -H "$H" "$BASE/predictions?year=2026&round=16&limit=3" | python3 -m json.tool | tee outbox/kali-predictions.txt

          echo "=== leaderboards disposals 2026 ==="
          curl -sf -H "$H" "$BASE/leaderboards?stat=disposals&year=2026&limit=5" | python3 -m json.tool | tee outbox/kali-leaderboards.txt

      - name: Commit probe results
        run: |
          git config user.email "probe@field.app"
          git config user.name "FIELD Probe"
          git add outbox/kali-*.txt
          git diff --cached --stat
          git commit -m "probe: Kali H2H + tips + leaderboards [skip ci]" || echo "nothing to commit"
          git push
