name: kali-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe NHL Draft + Boxscore endpoints
        run: |
          echo "=== draft/picks/now ==="
          curl -sf -H "Referer: https://www.nhl.com/" -H "Origin: https://www.nhl.com" \
            "https://api-web.nhle.com/v1/draft/picks/now" | python3 -m json.tool | head -60

          echo "=== draft-tracker/picks/now ==="
          curl -sf -H "Referer: https://www.nhl.com/" -H "Origin: https://www.nhl.com" \
            "https://api-web.nhle.com/v1/draft-tracker/picks/now" | python3 -m json.tool | head -60

          echo "=== draft/rankings/now ==="
          curl -sf -H "Referer: https://www.nhl.com/" -H "Origin: https://www.nhl.com" \
            "https://api-web.nhle.com/v1/draft/rankings/now" | python3 -m json.tool | head -40

          echo "=== gamecenter boxscore player shape ==="
          curl -sf -H "Referer: https://www.nhl.com/" -H "Origin: https://www.nhl.com" \
            "https://api-web.nhle.com/v1/gamecenter/2025030324/right-rail" | python3 -m json.tool | head -60
