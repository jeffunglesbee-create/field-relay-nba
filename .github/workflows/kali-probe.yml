name: kali-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Kali AFL Stats
        env:
          KALI_KEY: ${{ secrets.KALI_AFL_TOKEN }}
        run: |
          BASE="https://kaliaflstats.com/api/afl/v1"
          mkdir -p outbox

          echo "--- fixture ---"
          curl -sf -H "Authorization: Bearer $KALI_KEY" "$BASE/fixture" | python3 -m json.tool | head -60 | tee outbox/kali-fixture.txt

          echo "--- matches r16 ---"
          curl -sf -H "Authorization: Bearer $KALI_KEY" "$BASE/matches?year=2026&round=16" | python3 -m json.tool | head -80 | tee outbox/kali-matches.txt

          echo "--- player-stats r15 limit=2 ---"
          curl -sf -H "Authorization: Bearer $KALI_KEY" "$BASE/player-stats?year=2026&round=15&limit=2" | python3 -m json.tool | head -80 | tee outbox/kali-player-stats.txt

          echo "--- advanced r15 limit=2 ---"
          curl -sf -H "Authorization: Bearer $KALI_KEY" "$BASE/player-stats-advanced?year=2026&round=15&limit=2" | python3 -m json.tool | head -80 | tee outbox/kali-advanced.txt

          echo "--- standings 2026 ---"
          curl -sf -H "Authorization: Bearer $KALI_KEY" "$BASE/standings?year=2026" | python3 -m json.tool | head -60 | tee outbox/kali-standings.txt

          echo "--- h2h carlton vs collingwood ---"
          curl -sf -H "Authorization: Bearer $KALI_KEY" "$BASE/head-to-head?teamA=carlton&teamB=collingwood" | python3 -m json.tool | head -40 | tee outbox/kali-h2h.txt

      - name: Commit probe results
        run: |
          git config user.email "probe@field.app"
          git config user.name "FIELD Probe"
          git add outbox/kali-*.txt
          git diff --cached --stat
          git commit -m "probe: Kali AFL Stats results [skip ci]" || echo "nothing to commit"
          git push
