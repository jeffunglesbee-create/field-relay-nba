name: kali-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Kali AFL Stats API
        env:
          KALI_KEY: ${{ secrets.KALI_AFL_TOKEN }}
        run: |
          BASE="https://kaliaflstats.com/api/afl/v1"
          H="Authorization: Bearer $KALI_KEY"
          mkdir -p outbox

          echo "=== fixture ===" && curl -sf -H "$H" "$BASE/fixture" | python3 -c "
import sys,json; d=json.load(sys.stdin)
data=d.get('data',[])
print(f'count: {len(data)}')
if data: print('fields:', list(data[0].keys())); print('sample:', json.dumps(data[0], indent=2))
" 2>&1 | tee outbox/kali-fixture.txt

          echo "=== matches R16 ===" && curl -sf -H "$H" "$BASE/matches?year=2026&round=16" | python3 -c "
import sys,json; d=json.load(sys.stdin)
data=d.get('data',[])
print(f'count: {len(data)}')
if data: print('fields:', list(data[0].keys())); print('sample:', json.dumps(data[0], indent=2))
" 2>&1 | tee outbox/kali-matches.txt

          echo "=== player-stats R15 ===" && curl -sf -H "$H" "$BASE/player-stats?year=2026&round=15&limit=3" | python3 -c "
import sys,json; d=json.load(sys.stdin)
data=d.get('data',[])
print(f'count: {len(data)}')
if data: print('fields:', list(data[0].keys())); print('sample:', json.dumps(data[0], indent=2))
" 2>&1 | tee outbox/kali-player-stats.txt

          echo "=== advanced R15 ===" && curl -sf -H "$H" "$BASE/player-stats-advanced?year=2026&round=15&limit=2" | python3 -c "
import sys,json; d=json.load(sys.stdin)
data=d.get('data',[])
print(f'count: {len(data)}')
if data: print('fields:', list(data[0].keys())); print('sample:', json.dumps(data[0], indent=2))
" 2>&1 | tee outbox/kali-advanced.txt

          echo "=== h2h ===" && curl -sf -H "$H" "$BASE/head-to-head?teamA=carlton&teamB=collingwood" | python3 -c "
import sys,json; d=json.load(sys.stdin)
print(json.dumps(d, indent=2)[:800])
" 2>&1 | tee outbox/kali-h2h.txt

          echo "=== standings ===" && curl -sf -H "$H" "$BASE/standings?year=2026" | python3 -c "
import sys,json; d=json.load(sys.stdin)
data=d.get('data',[])
print(f'count: {len(data)}')
if data: print('fields:', list(data[0].keys())); print('top3:', json.dumps(data[:3], indent=2))
" 2>&1 | tee outbox/kali-standings.txt

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit results
        run: |
          git config user.email "probe@field.app"
          git config user.name "FIELD Probe"
          git add outbox/kali-*.txt
          git commit -m "probe: Kali AFL Stats API results [skip ci]" || echo "nothing to commit"
          git push
