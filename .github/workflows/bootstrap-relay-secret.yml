name: Bootstrap RELAY_SHARED_SECRET

# Writes RELAY_SHARED_SECRET into this repository's own Actions secrets, so
# deploy.yml's Courier sync step has something to read and can forward it to
# field-laboratory. Dispatch-only.
#
# WHY THIS EXISTS. field-laboratory's check:sport-vocabulary reads this relay's
# games tables through POST /d1/execute, which is credentialled. That value was
# inline in that repo's script until 2026-08-23, when its check:secrets caught it
# and failed verify. The script now reads process.env.RELAY_SHARED_SECRET with no
# fallback, so the value has to arrive over the Courier -- and the Courier needs
# an Actions secret here to read from. Nothing in this repo had one: every gate
# compares against a compiled-in string literal, and `env.RELAY_SHARED_SECRET`
# appears exactly once in src/index.js on an OUTBOUND call, never in an auth
# check.
#
# RECOUNTED 2026-09-05, because the numbers above had rotted and a comment about
# a credential is the wrong place for a stale count:
#
#   13   hardcoded occurrences of the literal in src/index.js
#    1   site reading env.RELAY_SHARED_SECRET (with the literal as its fallback)
#    2   auth comparison sites, the ones this workflow greps for
#
# The line reference is deliberately gone rather than corrected. It said ~9257
# and the comparisons are now past 15400; a number that moves every time the
# file grows is a citation that will be wrong again by the next reading. The
# grep below finds them by content, which is the only durable way.
#
# WHAT THIS MEANS FOR ROTATION, stated here because this file is where someone
# will look. The value cannot be rotated by changing the secret alone: those 13
# literals still authenticate, and this workflow READS one of them as the
# authority. The order is (1) remove the literals so env is the only source,
# (2) then rotate. Reversed, this workflow reinstalls the old value.
#
# THE VALUE COMES FROM SOURCE, NOT FROM A PASTE. src/index.js is the authority --
# the deployed worker compares against that literal and nothing else, so a value
# typed anywhere else could disagree with what actually authenticates. Reading it
# here means the secret cannot drift from the gate. It also makes this the
# rotation tool: change the literal, deploy, dispatch this, and the secret
# follows.
#
# This does not reduce the value's exposure. It is committed in src/index.js (27
# occurrences), src/analytics-engine.js, 5 workflows and 8 docs. Moving it into a
# secret store gives field-laboratory a way to receive it without adding a 42nd
# copy; it does not make it a secret.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exactly one distinct literal, or stop. An extraction that silently picks
      # one of several would write a value some gates reject, and that failure
      # would surface as a 401 in another repo days later.
      - name: Extract the gate literal from source
        id: extract
        run: |
          mapfile -t FOUND < <(grep -ao "X-FIELD-Relay') !== '[^']*'" src/index.js \
            | sed "s/.*!== '//; s/'$//" | sort -u)
          echo "distinct gate literals: ${#FOUND[@]}"
          if [ "${#FOUND[@]}" -ne 1 ]; then
            echo "::error::expected exactly 1 distinct gate literal, found ${#FOUND[@]}"
            echo "Reading one of several would write a value some gates reject."
            exit 1
          fi
          echo "::add-mask::${FOUND[0]}"
          echo "value=${FOUND[0]}" >> "$GITHUB_OUTPUT"
          echo "extracted, masked, length ${#FOUND[0]}"

      - name: Get GitHub OIDC token
        id: oidc
        run: |
          TOKEN=$(curl -sH "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=field-deploy" | jq -r .value)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      # ALLOWED_REPOS in the Courier gates the CALLER (field-relay-nba); the
      # target is a body parameter, so writing back into this same repo is the
      # same call shape as the three field-* syncs in deploy.yml.
      - name: Write RELAY_SHARED_SECRET into this repository
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RELAY_SECRET: ${{ steps.extract.outputs.value }}
        run: |
          RESULT=$(curl -s -X POST https://field-deploy.jeffunglesbee.workers.dev/secret \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"field-relay-nba\",\"name\":\"RELAY_SHARED_SECRET\",\"value\":\"$RELAY_SECRET\"}")
          echo "Result: $RESULT"
          echo "$RESULT" | grep -q '"ok":true' \
            && echo "RELAY_SHARED_SECRET written. deploy.yml forwards it to field-laboratory on its next run." \
            || { echo "::error::Write FAILED: $RESULT"; exit 1; }
