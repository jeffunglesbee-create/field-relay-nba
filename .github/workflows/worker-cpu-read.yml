name: Worker CPU read (read-only)

# How much CPU do this account's Workers and Durable Objects use, and did any
# invocation hit a runtime limit (exceededResources, 1102)? Cloudflare's GraphQL
# Analytics API, per Worker per UTC day. See scripts/worker-cpu-read.mjs for
# what it reads, what it does not (CPU per route), and why it exists.
#
# DISPATCH ONLY. It answers a question; it changes nothing but its own log.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'UTC days to read, ending yesterday (1-30)'
        required: true
        default: '7'
        type: string
      mode:
        description: 'summary (every Worker) or localise (one Worker, one status, by time bucket)'
        required: true
        default: 'summary'
        type: choice
        options: [summary, localise]
      worker:
        description: 'localise only: the Worker'
        required: false
        default: 'field-relay-nba'
        type: string
      status:
        description: 'localise only: the invocation status'
        required: false
        default: 'exceededMemory'
        type: string

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: the read can fail
        run: node scripts/worker-cpu-read.mjs --self-test

      # pipefail: without it the step's exit code is tee's.
      - name: Read CPU from Cloudflare analytics
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DAYS: ${{ inputs.days }}
          MODE: ${{ inputs.mode }}
          WORKER: ${{ inputs.worker }}
          STATUS: ${{ inputs.status }}
        run: |
          set -o pipefail
          STAMP=$(date -u +%Y-%m-%dT%H%M)
          SUFFIX=""
          if [ "$MODE" = localise ]; then
            SUFFIX="-localise-$(printf '%s-%s' "$WORKER" "$STATUS" | tr -cd 'A-Za-z0-9_-')"
          fi
          { echo "=== worker cpu read  utc=$(date -u +%FT%TZ)  days=$DAYS  mode=$MODE ==="
            node scripts/worker-cpu-read.mjs
          } 2>&1 | tee "outbox/worker-cpu-read${SUFFIX}-${STAMP}.log" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the log
        if: always()
        run: |
          PROBE_AUTHOR_NAME="worker-cpu-read" \
          PROBE_AUTHOR_EMAIL="actions@github.com" \
          bash scripts/probe-commit-retry.sh "chore: worker cpu read"
