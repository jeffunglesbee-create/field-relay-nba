name: Drama Peak Backfill (one-shot)

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run backfill
        env:
          RELAY_BASE: https://field-relay-nba.jeffunglesbee.workers.dev
        run: node scripts/drama-backfill.mjs
