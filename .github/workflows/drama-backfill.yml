name: Drama Peak Backfill (one-shot)

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Before count
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute field-archive --remote \
            --command="SELECT COUNT(*) as total, SUM(CASE WHEN drama_peak IS NOT NULL THEN 1 ELSE 0 END) as populated FROM regular_season_games WHERE date >= '2026-06-01'"

      - name: Compute scores (writes updates.sql)
        env:
          RELAY_BASE: https://field-relay-nba.jeffunglesbee.workers.dev
          SQL_OUT: updates.sql
        run: node scripts/drama-backfill.mjs

      - name: Apply updates to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Lines in updates.sql: $(wc -l < updates.sql)"
          npx wrangler d1 execute field-archive --remote --file=updates.sql

      - name: After count
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute field-archive --remote \
            --command="SELECT COUNT(*) as total, SUM(CASE WHEN drama_peak IS NOT NULL THEN 1 ELSE 0 END) as populated FROM regular_season_games WHERE date >= '2026-06-01'"
