name: rule-registry-check-test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rule-registry-check-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Real check + synthetic Rule 999 failure case + real-rule pass case
        env:
          RELAY_GH_PAT: ${{ secrets.RELAY_GH_PAT }}
        run: |
          echo "" | base64 -d > /tmp/rule_registry_ci.py
          echo "########## TEST 1: real current state ##########"
          python3 /tmp/rule_registry_ci.py real || echo "(exit $? -- real state check completed)"
          echo
          echo "########## TEST 2: synthetic Rule 999, no registry entry -- must show as missing ##########"
          python3 /tmp/rule_registry_ci.py synthetic-fail || echo "(exit $? -- synthetic check completed)"
          echo
          echo "########## TEST 3: real registered rules (89, 91) only -- must show zero missing ##########"
          python3 /tmp/rule_registry_ci.py pass-only
