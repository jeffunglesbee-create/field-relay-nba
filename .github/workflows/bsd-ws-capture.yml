name: BSD WS capture

# docs/CC-CMD-2026-10-16-bsd-ws-frame-shape.md (field-laboratory).
#
# Records raw BSD WebSocket frames from one live websocket_plus match and commits
# outbox/bsd-ws-frame-shape-latest.json plus the verbatim frames.
#
# CI because the container cannot reach sports.bzzoiro.com (403 at CONNECT) and
# because BSD_API_TOKEN lives here as a secret. Read-only: the socket subscribes
# to one event id and nothing is pushed anywhere but the outbox.
#
# wait_minutes: how long to poll /bsd/events/live for a websocket_plus event
# before giving up (exit 3, state no-qualifying-event, artifact still committed).

on:
  workflow_dispatch:
    inputs:
      wait_minutes:
        description: Minutes to wait for a live websocket_plus event
        default: '5'
      duration_minutes:
        description: Minutes of frames to record
        default: '10'
      league_ids:
        description: Comma-separated BSD league ids to accept (blank = any). 1 EPL, 3 La Liga, 4 Serie A, 5 Bundesliga, 7 UCL, 8 Europa
        default: ''

permissions:
  contents: write

concurrency:
  group: bsd-ws-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: The recorder and analyzer can still fail
        run: node scripts/bsd-ws-capture.mjs --self-test

      - name: Record the frames
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: node scripts/bsd-ws-capture.mjs --wait-minutes "${{ inputs.wait_minutes }}" --duration-minutes "${{ inputs.duration_minutes }}" --league-ids "${{ inputs.league_ids }}"

      # scripts/probe-commit-retry.sh, not the inline loop this file started with:
      # run 40619664790 (2026-10-28) recorded 10 minutes of frames, concluded
      # success, and landed NOTHING on main. The inline `git pull --rebase ... &&
      # git push` loop plus an is-ancestor guard reads a half-rebased detached HEAD
      # as "landed". The helper aborts to a clean branch, auto-resolves only
      # regenerated *-latest.json files, and fails loudly otherwise.
      - name: Commit the artifact
        if: always()
        run: |
          PROBE_AUTHOR_NAME="FIELD CI" \
          PROBE_AUTHOR_EMAIL="claude@field.dev" \
          PROBE_PATHS='outbox/bsd-ws-*' \
          bash scripts/probe-commit-retry.sh "chore: BSD WS capture artifact"
