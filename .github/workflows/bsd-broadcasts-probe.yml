name: BSD broadcasts probe

# docs/CC-CMD-2026-10-10-bsd-broadcasts-territory.md — Tasks 3 and 5.
#
# TASK 3 IS THE DOCUMENT'S GATE AND ITS PREMISE WAS NEVER MEASURED. The surface
# probe recorded country_code as a KEY NAME and set territory.scoped: true from
# its presence. Presence is not population, and the same artifact proved twice
# that this vendor serves a field and leaves it empty: attendance null on
# 193/193, round_name an empty string on 193/193. The stop condition turns on
# the VALUE: "If country_code is null on most rows, STOP and report before
# building a filter on it."
#
# Task 5 asks whether the endpoint reaches non-football sports, where FIELD's
# actual broadcast holes are.
#
# CI because sports.bzzoiro.com is 403-at-CONNECT from the container and
# BSD_API_TOKEN lives here as a secret.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD to discover events on. Empty = today."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: The probe can still fail
        run: node scripts/bsd-broadcasts-probe.mjs --self-test

      - name: Measure the country_code rate and the non-football coverage
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            node scripts/bsd-broadcasts-probe.mjs "--date=${{ inputs.date }}"
          else
            node scripts/bsd-broadcasts-probe.mjs
          fi

      - name: Commit the artifact
        if: always()
        run: |
          set -euo pipefail
          git config user.email "claude@field.dev"
          git config user.name  "FIELD CI"
          git add outbox/bsd-broadcasts-probe-*.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: BSD broadcasts probe artifact (Tasks 3 and 5)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after 3 attempts"; exit 1; }
