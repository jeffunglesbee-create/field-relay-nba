name: TEMP Rule89 MCP Tools Verify

# TEMP-RULE89-MCP-VERIFY-2026-07-13: real end-to-end verification for
# CC-CMD-2026-07-13-rule89-scoped-tools TASK 1 (event field) and TASK 2
# (commit_file_patch), via the real /mcp JSON-RPC endpoint with the real
# FIELD_MCP_SECRET. Delete after use (along with scripts/temp-rule89-*.py).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - name: Real MCP tool calls
        env:
          FIELD_MCP_SECRET: ${{ secrets.FIELD_MCP_SECRET }}
        run: |
          set -x
          mkdir -p outbox
          OUT="outbox/temp-rule89-mcp-verify.txt"
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev/mcp"
          AUTH="Authorization: Bearer $FIELD_MCP_SECRET"

          call() {
            curl -sS -X POST "$RELAY" -H "$AUTH" -H "Content-Type: application/json" -d "$1"
          }

          echo "=== 1. tools/list ===" > "$OUT"
          call '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | python3 scripts/temp-rule89-tools-check.py >> "$OUT" 2>&1

          echo "" >> "$OUT"
          echo "=== 2. get_deploy_status (real event field, mixed triggers) ===" >> "$OUT"
          call '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_deploy_status","arguments":{"repo":"field-relay-nba","limit":5}}}' \
            | python3 scripts/temp-rule89-print-text.py >> "$OUT" 2>&1

          echo "" >> "$OUT"
          echo "=== 3. read_file scratch test file (get live sha) ===" >> "$OUT"
          READ1=$(call '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"read_file","arguments":{"path":"docs/TEMP-commit-file-patch-test.md"}}}')
          echo "$READ1" >> "$OUT"
          SHA=$(echo "$READ1" | python3 scripts/temp-rule89-extract-sha.py)
          echo "SHA=$SHA" >> "$OUT"

          echo "" >> "$OUT"
          echo "=== 4. commit_file_patch -- real 2-edit success case ===" >> "$OUT"
          PATCH_BODY=$(python3 scripts/temp-rule89-build-patch-body.py "$SHA")
          call "$PATCH_BODY" >> "$OUT" 2>&1

          echo "" >> "$OUT"
          echo "=== 5. read_file again -- confirm both edits landed ===" >> "$OUT"
          call '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"read_file","arguments":{"path":"docs/TEMP-commit-file-patch-test.md"}}}' \
            | python3 scripts/temp-rule89-print-file.py >> "$OUT" 2>&1

          echo "" >> "$OUT"
          echo "=== 6. commit_file_patch -- rejection case (old_str occurs 0 times) ===" >> "$OUT"
          READ2=$(call '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"read_file","arguments":{"path":"docs/TEMP-commit-file-patch-test.md"}}}')
          SHA2=$(echo "$READ2" | python3 scripts/temp-rule89-extract-sha.py)
          REJECT_BODY=$(python3 scripts/temp-rule89-build-reject-body.py "$SHA2")
          call "$REJECT_BODY" >> "$OUT" 2>&1

          echo "" >> "$OUT"
          cat "$OUT"

      - name: Push result
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Debug-Probe"
          git add outbox/
          git commit -m "temp: rule89 mcp verify capture [skip ci]" || echo "(nothing to commit)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
