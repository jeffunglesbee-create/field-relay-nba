name: BSD Qualifying Probe (TEMP)

on:
  push:
    paths:
      - '.github/workflows/bsd-qualifying-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe BSD directly for UCL qualifying coverage (lid=7, 2026-07-14)
        env:
          BSD_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: |
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          BASE="outbox/bsd-qualifying-probe-${TS}"
          mkdir -p outbox
          echo "Probe time: $(date -u)" | tee "${BASE}.meta"
          echo "Target: https://sports.bzzoiro.com/api/v2/events/?date=2026-07-14&league_id=7" | tee -a "${BASE}.meta"
          curl -sS \
            -H "Authorization: Token ${BSD_TOKEN}" \
            -H "User-Agent: FIELD/1.0" \
            -H "Accept: application/json" \
            "https://sports.bzzoiro.com/api/v2/events/?date=2026-07-14&league_id=7" \
            -o "${BASE}.body" \
            -w "HTTP_CODE=%{http_code}\nSIZE_BYTES=%{size_download}\nCONTENT_TYPE=%{content_type}\nTIME_TOTAL=%{time_total}s\n" \
            | tee -a "${BASE}.meta"
          echo "=== Meta ===" | tee -a "${BASE}.meta"
          echo "=== Body (first 6KB) ===" | tee -a "${BASE}.meta"
          head -c 6000 "${BASE}.body" | tee -a "${BASE}.meta" || true

      - name: Commit probe result
        if: always()
        run: |
          git config user.name "FIELD CI"
          git config user.email "claude@field.dev"
          git add outbox/bsd-qualifying-probe-*.meta outbox/bsd-qualifying-probe-*.body 2>/dev/null || true
          git commit -m "temp: BSD qualifying-coverage probe result [skip ci]" || echo "nothing to commit"
          git push origin main || echo "push failed, will need manual retry"
