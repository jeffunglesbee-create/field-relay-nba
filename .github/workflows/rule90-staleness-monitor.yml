name: Rule 90 Staleness Monitor (non-blocking)

# Split out of deploy.yml's blocking `verify` job 2026-07-31. Rule 90's
# own text (STANDARDS.md, jubilant-bassoon) requires this check to
# "surface the gap as a build failure" -- it never requires that failure
# to block unrelated deploys indefinitely. Conflating "surface" with
# "gate every future deploy on 8 different rules getting an organic real
# case, with no way to force or schedule that without fabricating one"
# was an implementation choice from the 2026-07-11 CC-CMD that added it
# inside post-deploy-live-verify.yml (now deploy.yml), not a requirement
# of the rule text. This workflow keeps the same check, same red-X
# visibility in the Actions tab, same D1 query -- it just no longer holds
# unrelated fixes hostage while rules with no genuine applicable case yet
# sit UNEXERCISED past 14 days, which Rule 90 itself calls "the correct,
# honest signal to surface... not a false alarm to suppress" (i.e. it is
# meant to be visible, not a deploy gate).

on:
  schedule:
    - cron: '0 12 * * *'   # daily, so staleness is caught even with no relay pushes that day
  push:
    paths:
      - '.github/workflows/rule90-staleness-monitor.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Rule 90 staleness check -- no UNEXERCISED rule-registry entry older than 14 days
        run: |
          echo "" | base64 -d > /tmp/rule90_staleness_check.py
          python3 /tmp/rule90_staleness_check.py
