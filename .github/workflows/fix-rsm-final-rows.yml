name: RSM final round archive correction, R5 to R4 and PO (one-shot)

# docs/CC-CMD-2026-11-16-golf-tee-times.md, "2026-11-24 13:00Z": the owner's GO of 2026-11-24 to replace the two
# RSM R5 rows (the playoff archived as a fifth round) with an R4 row and a separate PO row. Dispatch only;
# scripts/fix-rsm-final-rows.mjs refuses unless both R5 rows read exactly as on 2026-11-24.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Correct
        run: |
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p outbox
          node scripts/fix-rsm-final-rows.mjs 2>&1 | tee "outbox/fix-rsm-final-rows-${TS}.log"
          exit "${PIPESTATUS[0]}"

      - name: Commit result
        if: always()
        run: |
          git config user.email "claude@field.dev"
          git config user.name "FIELD CI"
          git add outbox/fix-rsm-final-rows-*.log
          git diff --staged --quiet && { echo "(nothing new)"; exit 0; }
          git commit -m "archive: RSM final round rows corrected, R5 to R4 and PO"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
          # The loop above exits 0 when ALL THREE attempts fail: its last command is `sleep`.
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after 3 attempts"; exit 1; }
