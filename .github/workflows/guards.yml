name: Repo guards

# WHY THIS EXISTS, and why it is not just more steps in deploy.yml.
#
# deploy.yml carries 35 guard steps, and fires on `src/**`, `wrangler.toml`
# and `workers/**` only. Four of those guards read files OUTSIDE those paths:
#
#   check-exposed-secrets.mjs        the whole repository
#   check-doc-citations.mjs          docs/ and outbox/
#   check-handoff-current.mjs        HANDOFF.md and git log
#   check-no-literal-secret-writes   .github/workflows/
#
# So the guard set's trigger did not cover the guard set's inputs, and the
# gap was not theoretical. Commit 26c2507 shipped
# check-no-literal-secret-writes.mjs with the real (exhausted) Odds API key
# pasted twice into its own self-test fixture — in the script whose single
# purpose is to stop credentials being written from literals. It touched only
# scripts/ and .github/workflows/, deploy.yml never ran, and the
# exposed-secrets ratchet that would have failed it never fired. It was found
# by running the checks by hand two commits later.
#
# `paths-ignore` here mirrors deploy.yml's `paths`, so on a src-only push this
# job does not run and deploy.yml's copies do. A mixed push runs both; that is
# ~20 seconds and worth it.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/**'
      - 'wrangler.toml'
      - 'workers/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth matters: check-handoff-current.mjs reads commit dates from
      # git log, and a shallow clone makes "no commits since HANDOFF" and
      # "commits exist but were not fetched" indistinguishable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: no known-exposed credential appears more often than declared
        run: node scripts/check-exposed-secrets.mjs --self-test && node scripts/check-exposed-secrets.mjs

      - name: no workflow installs a credential from a literal
        run: node scripts/check-no-literal-secret-writes.mjs --self-test && node scripts/check-no-literal-secret-writes.mjs

      - name: every anchored citation still resolves
        run: node scripts/check-doc-citations.mjs --self-test && node scripts/check-doc-citations.mjs

      - name: HANDOFF.md is not stale
        run: node scripts/check-handoff-current.mjs --self-test && node scripts/check-handoff-current.mjs

      # AGE IS NOT THE ONLY WAY A HANDOFF GOES WRONG, AND IT WAS NOT THE ONE
      # THAT BIT. On 2026-09-19 the document above passed all day while saying a
      # 200-credit fill was UNRUN; it had run at 03:26Z. The age guard was
      # right — the document was hours old. The claim inside it was false.
      # 107 loops across four repos exited 0 when every push attempt failed,
      # because their last command was `sleep`. The sweep found FIVE shapes by
      # refusing to guess at a sixth; this checks that a landing verification
      # FOLLOWS each loop rather than policing the shape, because enumerating
      # shapes is exactly what proved incomplete five times.
      - name: every push-retry loop verifies the push landed
        run: |
          python3 scripts/check-push-lands.py --self-test
          python3 scripts/mutate-push-lands.py
          python3 scripts/check-push-lands.py

      # Task 1 of CC-CMD-2026-09-18. The CC-CMD says the schema goes in `DB`
      # (field-d1). It is wrong, and the check exists because the document is
      # what a later session will read: wrangler.toml gives DB and WC2026_DB the
      # SAME database_id, and every runtime CREATE TABLE here is on ARCHIVE_DB,
      # where odds_history and odds_backfill_progress already live. `env.DB` had
      # four references when this was written, all Whoop OAuth tokens; Whoop was
      # removed on 2026-09-19 and it now has zero.
      #
      # It also asserts both tables are in /d1/execute's ALLOWED_TABLES. That
      # route 403s anything else, and a 403 reads identically to a D1 failure
      # from outside — which is precisely how Task 0b was blocked.
      - name: the odds budget schema is on ARCHIVE_DB and readable from CI
        run: |
          node scripts/check-odds-budget-schema.mjs --self-test
          node scripts/mutate-odds-budget-schema.mjs
          node scripts/check-odds-budget-schema.mjs

      # THE OTHER HALF OF THE SAME DENOMINATOR. The gate above reads the DDL out
      # of ensureOddsBudgetTables, so it covers tables the WORKER creates. A
      # table created by a SCRIPT was outside it, and on 2026-09-23 that was the
      # one that failed: targeted-odds-fill.mjs died on its first statement with
      # `403 table not allowed: odds_fill_dead_pairs`, on a runner, after the
      # dispatch. Nothing said so beforehand.
      # The guard's veto has to be visible from outside the worker. `used ===
      # ceiling` says the budget is spent; it cannot tell a day that landed on
      # the cap at 23:58 from 2026-09-19, which sat at 3800 from before 19:39
      # until at least 22:32 and refused every fetch in between.
      # A RATCHET, NOT A FIX. The daily counter is one D1 transaction since
      # 2026-09-19; the monthly one is still a plain KV read-modify-write with
      # FOUR writers on the same key, which loses updates from concurrent
      # isolates by construction. That explains the DIRECTION of the 2562
      # excess measured over 09-20/09-21, not its magnitude. This stops a fifth
      # copy arriving quietly — the duplication is the root problem and it has
      # grown before.
      # The month statements EXECUTED, against real node:sqlite, because the
      # correctness argument is about what a transaction does under a ceiling
      # predicate and reading SQL cannot settle that. M3 is the one that costs
      # money: a seed starting at zero hands the month a second full 85,000
      # ceiling before the hard limit binds again.
      - name: the monthly charge is atomic and its ceiling binds
        run: |
          node scripts/check-monthly-atomic.mjs
          node scripts/mutate-monthly-atomic.mjs

      - name: the monthly odds counter has not grown another non-atomic writer
        run: |
          node scripts/check-monthly-counter-writers.mjs --self-test
          node scripts/check-monthly-counter-writers.mjs

      - name: a ceiling veto is readable from /budget/odds
        run: |
          node scripts/check-ceiling-reached.mjs
          node scripts/mutate-ceiling-reached.mjs

      - name: every table a script creates is on the /d1/execute allow-list
        run: |
          node scripts/check-script-created-tables.mjs --self-test
          node scripts/check-script-created-tables.mjs

      # Task 2. THE SPEC WAS SELF-CONTRADICTORY: "all three in one batch" AND
      # "statement 3 runs only if statement 2 returned a row" cannot both hold,
      # because a batch is submitted as a unit. The resolution is the ORDER —
      # bump the site FIRST, reading the PRE-charge total, then charge the day,
      # both carrying the same ceiling predicate. No result needs inspecting and
      # the transaction survives.
      #
      # That makes the ORDER the correctness argument, and the order is invisible
      # from either statement alone. Reversing it is a two-line change with no
      # syntax error and no symptom until a ceiling day.
      #
      # The mutations run the real SQL against node:sqlite rather than only
      # reading it, and the three behavioural ones reproduce BOTH observed gap
      # signs: charge-before-site gives daily 90 / sum 60, an unguarded site
      # write gives 90 / 150 (the positive gap), an unguarded charge gives
      # 150 / 90 (the negative one).
      - name: the odds budget batch keeps its order and its ceilings
        run: |
          node scripts/check-odds-budget-batch.mjs --self-test
          node scripts/mutate-odds-budget-batch.mjs
          node scripts/check-odds-budget-batch.mjs

      # WHOOP COST MORE THAN ITS DEAD CODE, and none of the 40-odd guards here
      # was looking for it, because every one of them asks whether the code is
      # CORRECT and none asked whether it BELONGS.
      #
      #   - WHOOP_CLIENT_SECRET, a live OAuth client secret, sat in [vars] in
      #     wrangler.toml: tracked, in a PUBLIC repo, deployed as a plaintext
      #     env var rather than a Cloudflare secret, from the commit that added
      #     the feature until 2026-09-19.
      #   - It was the ONLY consumer of the `DB` binding, so DB looked like a
      #     live database, and CC-CMD-2026-09-18 told a session to put the odds
      #     budget in it on that basis.
      #   - 3 routes, 22 lines, zero references in jubilant-bassoon, named in no
      #     contract.
      #
      # A DECLARED LIST, NOT A CLASSIFIER. It cannot tell a sports vendor from a
      # fitness one and does not try — a human adds a host when it is ruled out
      # of scope, with the date and the reason. A guessing version would fire on
      # every third-party sports API the relay legitimately calls.
      - name: no out-of-scope vendor is back in the relay
        run: |
          node scripts/check-no-foreign-domain.mjs --self-test
          node scripts/check-no-foreign-domain.mjs

      # A route must not claim a host from a function it does not call. The
      # generator's BASES is a flat name->URL map with no notion of scope, and
      # `const base = 'https://api.prod.whoop.com/...'` inside the Whoop block
      # made every route with its own `base` resolve to it — four sports routes
      # stamped X-FIELD-Source: api.prod.whoop.com on live responses.
      #
      # It runs the REAL generator against a fixture rather than matching source
      # text, because a source check passes on a shadowing test that can never
      # fire. S1 is the mutation: disable shadowing and the fixture route
      # reclaims the foreign host.
      #
      # It REPORTS a second, unfixed mechanism without gating on it. See the
      # KNOWN GAP line in its output.
      - name: a route claims no host from a function it does not call
        run: node scripts/mutate-provenance-shadowing.mjs

      - name: HANDOFF does not claim a workflow has not run, that has
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/check-handoff-claims.mjs --self-test
          node scripts/mutate-handoff-claims.mjs
          node scripts/check-handoff-claims.mjs

      - name: One team-name matcher, and it can fail
        run: |
          node scripts/check-odds-matcher.mjs
          node scripts/check-odds-matcher-wiring.mjs
          node scripts/mutate-odds-matcher.mjs

      - name: The backfill cannot pay for a payload and pair none of it
        run: node scripts/watch-odds-pairing-rate.mjs --self-test

      - name: No claim is wider than its declared scope
        run: |
          node scripts/check-scope-claims.mjs --self-test
          node scripts/check-scope-claims.mjs
          node scripts/mutate-scope-claims.mjs

        # Both copies are deliberate: the matcher module is under src/ (which
        # only deploy.yml sees) while its two call sites are under
        # .github/scripts/ and scripts/ (which only this job sees). One copy
        # would leave half the change ungated — the same trigger-vs-input gap
        # this file's header describes.
