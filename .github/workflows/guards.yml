name: Repo guards

# WHY THIS EXISTS, and why it is not just more steps in deploy.yml.
#
# deploy.yml carries 35 guard steps, and fires on `src/**`, `wrangler.toml`
# and `workers/**` only. Four of those guards read files OUTSIDE those paths:
#
#   check-exposed-secrets.mjs        the whole repository
#   check-doc-citations.mjs          docs/ and outbox/
#   check-handoff-current.mjs        HANDOFF.md and git log
#   check-no-literal-secret-writes   .github/workflows/
#
# So the guard set's trigger did not cover the guard set's inputs, and the
# gap was not theoretical. Commit 26c2507 shipped
# check-no-literal-secret-writes.mjs with the real (exhausted) Odds API key
# pasted twice into its own self-test fixture — in the script whose single
# purpose is to stop credentials being written from literals. It touched only
# scripts/ and .github/workflows/, deploy.yml never ran, and the
# exposed-secrets ratchet that would have failed it never fired. It was found
# by running the checks by hand two commits later.
#
# `paths-ignore` here mirrors deploy.yml's `paths`, so on a src-only push this
# job does not run, and ONLY the guards that deploy.yml also carries run. A
# guard that reads src/ and lives here alone does not stop a deploy. Until
# 2026-10-19 that was true of every odds guard; twelve now have deploy.yml
# copies (docs/CC-CMD-2026-10-18-odds-gate-reads-wrapper-bodies.md). Six other
# src-reading guards are still here alone, measured by census on 2026-10-19 and
# filed as docs/CC-CMD-2026-10-19-guards-only-src-readers.md. A mixed push runs
# both; that is ~20 seconds and worth it.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'src/**'
      - 'wrangler.toml'
      - 'workers/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth matters: check-handoff-current.mjs reads commit dates from
      # git log, and a shallow clone makes "no commits since HANDOFF" and
      # "commits exist but were not fetched" indistinguishable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: no known-exposed credential appears more often than declared
        run: node scripts/check-exposed-secrets.mjs --self-test && node scripts/check-exposed-secrets.mjs

      # docs/CC-CMD-2026-08-25-rotate-relay-secret.md: every gate reads the
      # binding and fails closed, and no literal fallback comes back.
      - name: the relay's gates read the secret from env and fail closed
        run: node scripts/check-relay-secret-gates.mjs --self-test && node scripts/check-relay-secret-gates.mjs

      - name: no workflow installs a credential from a literal
        run: node scripts/check-no-literal-secret-writes.mjs --self-test && node scripts/check-no-literal-secret-writes.mjs

      - name: every anchored citation still resolves
        run: node scripts/check-doc-citations.mjs --self-test && node scripts/check-doc-citations.mjs

      # AGE IS NOT THE ONLY WAY A HANDOFF GOES WRONG, AND IT WAS NOT THE ONE
      # THAT BIT. On 2026-09-19 the document above passed all day while saying a
      # 200-credit fill was UNRUN; it had run at 03:26Z. The age guard was
      # right — the document was hours old. The claim inside it was false.
      # 107 loops across four repos exited 0 when every push attempt failed,
      # because their last command was `sleep`. The sweep found FIVE shapes by
      # refusing to guess at a sixth; this checks that a landing verification
      # FOLLOWS each loop rather than policing the shape, because enumerating
      # shapes is exactly what proved incomplete five times.
      - name: every push-retry loop verifies the push landed
        run: |
          python3 scripts/check-push-lands.py --self-test
          python3 scripts/mutate-push-lands.py
          python3 scripts/check-push-lands.py

      # Task 1 of CC-CMD-2026-09-18. The CC-CMD says the schema goes in `DB`
      # (field-d1). It is wrong, and the check exists because the document is
      # what a later session will read: wrangler.toml gives DB and WC2026_DB the
      # SAME database_id, and every runtime CREATE TABLE here is on ARCHIVE_DB,
      # where odds_history and odds_backfill_progress already live. `env.DB` had
      # four references when this was written, all Whoop OAuth tokens; Whoop was
      # removed on 2026-09-19 and it now has zero.
      #
      # It also asserts both tables are in /d1/execute's ALLOWED_TABLES. That
      # The spend this one prevents is the largest single-site charge the budget
      # has ever taken: by_site getWCPregameLambdas read 2536 on 2026-10-07
      # against 4 the day before, and the day's 3800 ceiling was gone by
      # 01:16:29Z. Source-only, so it costs nothing and reaches nothing.
      - name: the WC lambda call stays gated, and the sport list stays one list
        run: |
          node scripts/check-wc-lambdas-gated.mjs --self-test
          node scripts/check-wc-lambdas-gated.mjs

      # The guard fell open 245 times on 2026-10-07 for 1263 credits of real
      # spend the counter never saw, and both catches discarded the error, so
      # nothing said what threw. Source-only.
      - name: a degrade-open names its error and counts it by reason
        run: |
          node scripts/check-degrade-open-reason.mjs --self-test
          node scripts/check-degrade-open-reason.mjs

      # And the other half of the SAME incident: what threw, those 245 times,
      # was chargedFromBatch — the monthly batch is two statements and the
      # helper demanded three, so every monthly charge degraded open and the
      # 85,000 hard limit could not veto. The gate above proved the error was
      # being named; this one proves the error is not there. Source-only.
      - name: a batch and the helper reading it agree on their statement count
        run: |
          node scripts/check-batch-order.mjs --self-test
          node scripts/check-batch-order.mjs

      # _fetchLiveOdds called /v4/sports/{sport}/odds-live, which the vendor
      # 404s — measured, run 38186065943, with /odds returning 401 on the same
      # sport keys as the control. Every call was a 404, so it never produced an
      # odds row, and the line above its fetch charged 2 credits for each
      # attempt: 1037 calls / 2074 credits on 2026-10-10. The guard has to
      # return BEFORE the charge, which is the half a reading would miss.
      # Source-only.
      - name: the odds-live 404 path returns before the charge
        run: |
          node scripts/check-odds-live-disabled.mjs --self-test
          node scripts/check-odds-live-disabled.mjs

      # The half of the spend question `used` cannot answer: how much of what the
      # counter charged the provider never asked for. Four of reconcile's five
      # outcomes wrote nothing until 2026-10-08, so a refunded estimate and a
      # kept one were the same from outside.
      - name: reconcile counts every call once, with no read
        run: |
          node scripts/check-reconcile-tally.mjs --self-test
          node scripts/check-reconcile-tally.mjs

      # route 403s anything else, and a 403 reads identically to a D1 failure
      # from outside — which is precisely how Task 0b was blocked.
      - name: the odds budget schema is on ARCHIVE_DB and readable from CI
        run: |
          node scripts/check-odds-budget-schema.mjs --self-test
          node scripts/mutate-odds-budget-schema.mjs
          node scripts/check-odds-budget-schema.mjs

      # THE OTHER HALF OF THE SAME DENOMINATOR. The gate above reads the DDL out
      # of ensureOddsBudgetTables, so it covers tables the WORKER creates. A
      # table created by a SCRIPT was outside it, and on 2026-09-23 that was the
      # one that failed: targeted-odds-fill.mjs died on its first statement with
      # `403 table not allowed: odds_fill_dead_pairs`, on a runner, after the
      # dispatch. Nothing said so beforehand.
      # The guard's veto has to be visible from outside the worker. `used ===
      # ceiling` says the budget is spent; it cannot tell a day that landed on
      # the cap at 23:58 from 2026-09-19, which sat at 3800 from before 19:39
      # until at least 22:32 and refused every fetch in between.
      # A RATCHET, NOT A FIX. The daily counter is one D1 transaction since
      # 2026-09-19; the monthly one is still a plain KV read-modify-write with
      # FOUR writers on the same key, which loses updates from concurrent
      # isolates by construction. That explains the DIRECTION of the 2562
      # excess measured over 09-20/09-21, not its magnitude. This stops a fifth
      # copy arriving quietly — the duplication is the root problem and it has
      # grown before.
      # The month statements EXECUTED, against real node:sqlite, because the
      # correctness argument is about what a transaction does under a ceiling
      # predicate and reading SQL cannot settle that. M3 is the one that costs
      # money: a seed starting at zero hands the month a second full 85,000
      # ceiling before the hard limit binds again.
      - name: the monthly charge is atomic and its ceiling binds
        run: |
          node scripts/check-monthly-atomic.mjs
          node scripts/mutate-monthly-atomic.mjs

      - name: the monthly odds counter has not grown another non-atomic writer
        run: |
          node scripts/check-monthly-counter-writers.mjs --self-test
          node scripts/check-monthly-counter-writers.mjs

      - name: a ceiling veto is readable from /budget/odds
        run: |
          node scripts/check-ceiling-reached.mjs
          node scripts/mutate-ceiling-reached.mjs

      - name: the odds writers, run for real, match their own game and write only pre-kickoff lines
        run: node scripts/check-odds-join-shared.mjs

      - name: every table a script creates is on the /d1/execute allow-list
        run: |
          node scripts/check-script-created-tables.mjs --self-test
          node scripts/check-script-created-tables.mjs

      # Task 2. THE SPEC WAS SELF-CONTRADICTORY: "all three in one batch" AND
      # "statement 3 runs only if statement 2 returned a row" cannot both hold,
      # because a batch is submitted as a unit. The resolution is the ORDER —
      # bump the site FIRST, reading the PRE-charge total, then charge the day,
      # both carrying the same ceiling predicate. No result needs inspecting and
      # the transaction survives.
      #
      # That makes the ORDER the correctness argument, and the order is invisible
      # from either statement alone. Reversing it is a two-line change with no
      # syntax error and no symptom until a ceiling day.
      #
      # The mutations run the real SQL against node:sqlite rather than only
      # reading it, and the three behavioural ones reproduce BOTH observed gap
      # signs: charge-before-site gives daily 90 / sum 60, an unguarded site
      # write gives 90 / 150 (the positive gap), an unguarded charge gives
      # 150 / 90 (the negative one).
      # 2026-10-28: the mechanism described above (bump the site first, both
      # carrying the day's predicate) was replaced by Task 3's gate, which holds the
      # day, the month and the site in one statement that the three charges obey;
      # the order that remains is the gate before the charges. What this step
      # established still holds on the new statements: the mutations run the real
      # SQL on node:sqlite and reproduce the same gap signs (E2 daily 90 / sum 150,
      # E3 daily 150 / sum 90) and the 2026-10-18 split reverted (E9, month short).
      - name: the odds budget batch keeps its order and its ceilings
        run: |
          node scripts/check-odds-budget-batch.mjs --self-test
          node scripts/mutate-odds-budget-batch.mjs
          node scripts/check-odds-budget-batch.mjs

      # Task 3 of docs/CC-CMD-2026-09-16-odds-spend-attribution.md. The batch above
      # is read for its SHAPE; this one RUNS chargeOdds itself, 2,000 random
      # sequences against a four-line reference model, because a third predicate
      # on the statements one at a time looked right and agreed with the model on
      # 973 of 2,000 sequences. The mutation harness turns each gate, order and
      # cap mutation red or fails by name.
      - name: a per-site cap refuses its own site and charges nothing it refused
        run: |
          node scripts/check-odds-site-caps.mjs
          node scripts/mutate-odds-site-caps.mjs

      # The three routes that spent under a cron's label are executed, not read
      # (2026-10-28): the real worker, a sqlite D1, a vendor stub. The static gates
      # prove the guard maps each selector; only a run proves a route passes it.
      - name: the unauthenticated odds routes spend under their own labels
        run: |
          node scripts/check-odds-label-split.mjs
          node scripts/mutate-odds-label-split.mjs

      # /identity/mismatches is the diagnostic the Saturday probe reads. It joined on resolved pair keys
      # alone and reported 0 of 80 on a slate the relay's own join solves 73 of and the backfill's
      # matcher 80 of (2026-10-29, docs/CC-CMD-2026-10-19-cfb-saturday-coverage-and-join-probe.md,
      # Part B). Run against the real 80-row slate, with the mutants.
      - name: the identity diagnostic joins a slate the way the writers do and counts its rows
        run: |
          node scripts/check-identity-route-join.mjs
          node scripts/mutate-identity-route-join.mjs

      # Every reader that prints an "opening" line took the blob as it came, and the CI backfill writes one
      # blob into both columns, so a line captured during the game was reported as the open (2026-10-29,
      # docs/CC-CMD-2026-10-19-cfb-saturday-coverage-and-join-probe.md, Task A2). Run on six real blobs.
      - name: the sentences that say opened skip a line captured after kickoff
        run: |
          node scripts/check-opening-odds-late.mjs
          node scripts/mutate-opening-odds-late.mjs

      # seed-coverage.yml went red 2026-10-26 to 10-29 on 'PGA Tour: 1 fixture on ESPN, 0 rows': the check counted
      # sport=<label> rows, which for golf was the category-error row the archive no longer writes. Golf is archived
      # as sport=golf, league=<label>. The self-test and six mutations hold that rule.
      - name: the seed-coverage archive rule counts golf the way the archive writes it, and can fail
        run: |
          node scripts/check-seed-coverage.mjs --self-test
          node scripts/mutate-seed-coverage.mjs

      # The Saturday probe that reads that diagnostic could not fail on the property it existed for: CFB
      # read NO_ROWS in all seven recorded artifacts, every run exited 0, and every scheduled run probed
      # the Sunday. The classifier and the script are run against a local relay; the two workflows that
      # call the script are read, and the date expression they compute is executed.
      - name: the Saturday identity-join probe refuses what it cannot measure
        run: |
          node scripts/check-odds-join-probe.mjs
          node scripts/mutate-odds-join-probe.mjs
          node scripts/check-saturday-probe-workflow.mjs
          node scripts/mutate-saturday-probe-workflow.mjs

      # Review of Task 3: POST /debug/odds-budget-latency still prepared a statement
      # the change had removed and answered 500, and no gate noticed. Every
      # ODDS_BUDGET_SQL reference must name a statement that exists and bind as many
      # values as it has placeholders.
      - name: every odds budget statement is referenced by a key that exists and bound by its placeholder count
        run: |
          node scripts/check-odds-sql-binds.mjs --self-test
          node scripts/mutate-odds-sql-binds.mjs
          node scripts/check-odds-sql-binds.mjs

      # WHOOP COST MORE THAN ITS DEAD CODE, and none of the 40-odd guards here
      # was looking for it, because every one of them asks whether the code is
      # CORRECT and none asked whether it BELONGS.
      #
      #   - WHOOP_CLIENT_SECRET, a live OAuth client secret, sat in [vars] in
      #     wrangler.toml: tracked, in a PUBLIC repo, deployed as a plaintext
      #     env var rather than a Cloudflare secret, from the commit that added
      #     the feature until 2026-09-19.
      #   - It was the ONLY consumer of the `DB` binding, so DB looked like a
      #     live database, and CC-CMD-2026-09-18 told a session to put the odds
      #     budget in it on that basis.
      #   - 3 routes, 22 lines, zero references in jubilant-bassoon, named in no
      #     contract.
      #
      # A DECLARED LIST, NOT A CLASSIFIER. It cannot tell a sports vendor from a
      # fitness one and does not try — a human adds a host when it is ruled out
      # of scope, with the date and the reason. A guessing version would fire on
      # every third-party sports API the relay legitimately calls.
      - name: no out-of-scope vendor is back in the relay
        run: |
          node scripts/check-no-foreign-domain.mjs --self-test
          node scripts/check-no-foreign-domain.mjs

      # A route must not claim a host from a function it does not call. The
      # generator's BASES is a flat name->URL map with no notion of scope, and
      # `const base = 'https://api.prod.whoop.com/...'` inside the Whoop block
      # made every route with its own `base` resolve to it — four sports routes
      # stamped X-FIELD-Source: api.prod.whoop.com on live responses.
      #
      # It runs the REAL generator against a fixture rather than matching source
      # text, because a source check passes on a shadowing test that can never
      # fire. S1 is the mutation: disable shadowing and the fixture route
      # reclaims the foreign host.
      #
      # It REPORTS a second, unfixed mechanism without gating on it. See the
      # KNOWN GAP line in its output.
      - name: a route claims no host from a function it does not call
        run: node scripts/mutate-provenance-shadowing.mjs

      - name: HANDOFF does not claim a workflow has not run, that has
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/check-handoff-claims.mjs --self-test
          node scripts/mutate-handoff-claims.mjs
          node scripts/check-handoff-claims.mjs

      - name: One team-name matcher, and it can fail
        run: |
          node scripts/check-odds-matcher.mjs
          node scripts/check-odds-matcher-wiring.mjs
          node scripts/check-odds-history-units.mjs
          node scripts/mutate-odds-matcher.mjs

      - name: The backfill cannot pay for a payload and pair none of it
        run: node scripts/watch-odds-pairing-rate.mjs --self-test

      - name: No claim is wider than its declared scope
        run: |
          node scripts/check-scope-claims.mjs --self-test
          node scripts/check-scope-claims.mjs
          node scripts/mutate-scope-claims.mjs

        # Both copies are deliberate: the matcher module is under src/ (which
        # only deploy.yml sees) while its two call sites are under
        # .github/scripts/ and scripts/ (which only this job sees). One copy
        # would leave half the change ungated — the same trigger-vs-input gap
        # this file's header describes.
      # The NHL win probability scorer. The three assertions worth gating are
      # the ones that pass whether or not they are aimed at anything: a refusal
      # that silently became 0.5, a label that silently became 'Market
      # estimate', and an absent goalie that silently became an average one.
      # Thirteen mutations prove each is load-bearing.
      # The on-ice reconstruction. Four states, and the two that matter are the
      # ones an empty array would swallow: no shift data at all, and an instant
      # the shift data does not cover. Neither is "nobody on the ice".
      - name: The on-ice reconstruction still refuses what contradicts situationCode
        if: always()
        run: |
          node scripts/check-nhl-onice.mjs
          node scripts/nhl-shiftcharts-probe.mjs --self-test

      - name: No opening line is written onto a finished game
        if: always()
        run: |
          node scripts/check-opening-odds-not-at-finalisation.mjs --self-test
          node scripts/check-opening-odds-not-at-finalisation.mjs

      - name: No new bare empty catch
        if: always()
        run: |
          # The AST control adjudicates the fast scanner. It found two defects
          # in it that reading did not, so an absent tree-sitter FAILS the gate
          # rather than skipping it.
          python3 -m pip install --quiet tree-sitter tree-sitter-javascript
          node scripts/check-empty-catches.mjs --self-test
          node scripts/check-empty-catches.mjs src scripts \
            --baseline=112 \
            --require=src/ambient-do.js:347 \
            --control
          node scripts/mutate-empty-catches.mjs

      - name: The hockey WP scorer still refuses what it cannot read
        if: always()
        run: |
          node scripts/check-hockey-wp.mjs
          node scripts/mutate-hockey-wp.mjs
          node scripts/hockey-wp-train.mjs --self-test
          node scripts/hockey-wp-market.mjs --self-test
          node scripts/hockey-wp-probe.mjs --self-test

      # /bsd/contract declared incidents[].sequence[].pos per-team from ONE away
      # goal, and for the away side the two candidate frames predict identical
      # numbers. This re-measures every declared frame against the R2 captures,
      # split by side, own goals excluded, and treats a side with too few
      # records as INSUFFICIENT (exit 3) rather than as agreement. Unlike most
      # steps here it reaches the relay: the measurement is the captures, and
      # a copy of them would be the substitution this repo's rules prohibit.
      # docs/CC-CMD-2026-10-16-bsd-list-and-contract.md.
      - name: every BSD frame the contract declares matches the captures
        if: always()
        run: |
          node scripts/check-bsd-frame-contract.mjs --self-test
          node scripts/mutate-bsd-frame-contract.mjs
          node scripts/check-bsd-frame-contract.mjs

      # The BSD WebSocket recorder/analyzer behind bsd-ws-capture.yml. The recorder
      # keeps every frame whatever its type, and the analyzer's verdict decides
      # whether the tracking tier is off-ball; a check that cannot fail on a
      # mutated copy would let either rot unseen. Rule 90.
      # docs/CC-CMD-2026-10-16-bsd-ws-frame-shape.md (field-laboratory).
      - name: the BSD WS recorder fails when it is broken on purpose
        if: always()
        run: |
          node scripts/bsd-ws-capture.mjs --self-test
          node scripts/mutate-bsd-ws-capture.mjs

      # (a copy of deploy.yml's step, so a scripts-only or frames-only change is caught here too)
      # docs/CC-CMD-2026-10-28-bsd-ws-fanout-field-names.md. AmbientDO's _bsdOnFrame read
      # frame.minute and frame.period that BSD's event frames do not have (the clock is
      # frame.time) and dropped side/time/commentary from every livedata frame. This
      # replays the RECORDED frames (outbox/bsd-ws-frames-*.jsonl, one match) through
      # the real function and asserts the payload carries what the frame carries. The
      # mutation half breaks the real source and the check itself, baseline first.
      - name: the BSD WebSocket fan-out forwards every recorded frame under its own field names
        if: always()
        run: |
          node scripts/check-bsd-ws-fanout.mjs --self-test
          node scripts/mutate-bsd-ws-fanout.mjs
          node scripts/check-bsd-ws-fanout.mjs
          node scripts/bsd-contract-verify.mjs --self-test
          node scripts/bsd-contract-verify.mjs --source-notes

      # The live half of the same CC-CMD (bsd-fanout-live-verify.yml needs a live match).
      # Its pure part is gated here so it cannot rot between matches.
      - name: the BSD fan-out live verifier fails when it is broken on purpose
        if: always()
        run: |
          node scripts/bsd-fanout-live-verify.mjs --self-test
          node scripts/mutate-bsd-fanout-live-verify.mjs

      # docs/CC-CMD-2026-10-28-bsd-pitch-renderer-fields.md, Task 2. The join that says
      # which transform puts a shotmap `pos` on the pitch the ball is drawn on. Its
      # pairing and its verdict are checked against synthetic data, and the harness
      # mutates the data (a reflection, the contract's home-raw placement, one pair
      # nudged, a side removed) and requires each to be caught. Rule 90.
      - name: the BSD shared-pitch fit fails when it is broken on purpose
        if: always()
        run: |
          node scripts/bsd-shared-pitch-fit.mjs --self-test
          node scripts/bsd-shared-pitch-fit.mjs --mutate

      # docs/CC-CMD-2026-10-29-bsd-live-shot-source.md, Task 0. The reader of BSD's RateLimit headers and the
      # arithmetic on them, and a mutation harness that strips, reverses and renames them. Rule 90.
      - name: the BSD request-budget reader fails when it is broken on purpose
        if: always()
        run: |
          node scripts/bsd-request-budget.mjs --self-test
          node scripts/bsd-request-budget.mjs --mutate

      # Rule 99, the absence-collapse ratchet. deploy.yml carries the same step
      # for src-only pushes; this one covers scripts/ and workers/ changes that
      # reach here. Reaches github.com to clone jubilant-bassoon, whose
      # scripts/check-absence-collapse.mjs it runs rather than copies.
      - name: No absence-collapse site appears beyond the baseline
        if: always()
        run: bash scripts/absence-collapse-ratchet.sh

      # CC-CMD-2026-10-14-push-cron-gambit-path. A copy of deploy.yml's step, so
      # a scripts-only change to the check is caught here too.
      - name: The push cron's live-game half stays absent, and says so
        if: always()
        run: node scripts/check-push-cron-live-absence.mjs --self-test && node scripts/check-push-cron-live-absence.mjs

      # CC-CMD-2026-10-16-cfl-archive-date-keying, TASK 4. Every archived row's
      # date is the ET day of its own start_time. This one reads live ARCHIVE_DB
      # through /d1/execute, so unlike the source-only gates above it can go red
      # on a push that touched nothing: a writer stamping the wrong day is a
      # defect whenever it is found. Each run also moves one passing row by a
      # day in memory and fails unless that is caught.
      - name: Every archived game is dated on the ET day of its own kickoff
        if: always()
        env:
          RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
        run: node scripts/check-archive-date-keying.mjs --self-test && node scripts/check-archive-date-keying.mjs

      # LAST, AND THAT IS THE POINT. This checked HANDOFF.md's staleness from
      # step 6, and the gates here are sequential steps in ONE job, so its red
      # SKIPPED every step after it: the credential scan's siblings, the odds
      # budget schema, the monthly atomic charge, the /d1/execute allow-list,
      # the team-name matcher. Measured 2026-10-08: guards.yml last succeeded on
      # run 397, 2026-09-23, and every run from 398 onward failed here and
      # skipped fourteen gates. Run 407 shows a gate added that day skipped on
      # its very first run. The job reported one red reading "HANDOFF stale", so
      # nothing said the suite had stopped checking anything else.
      #
      # It still fails the job — a stale handoff is a real defect and
      # continue-on-error would hide it. It fails LAST, so a stale document
      # cannot blind the spend and credential gates.
      # docs/CC-CMD-2026-10-18-relay-governance-guards.md. A CC-CMD's status
      # line opens with a vocabulary word, appears once, and is not contradicted
      # by a closing section (tripwires at 0); new CC-CMDs carry one (ratchet,
      # 331). It fails on the CFL CC-CMD as it read before 2026-10-18. Placed
      # before the HANDOFF step, with if: always(), for the same reason that
      # step fails last: a document check must not blind the gates around it.
      - name: CC-CMD status lines are greppable and consistent
        if: always()
        run: node scripts/cc-cmd-status-check.mjs --self-test && node scripts/cc-cmd-status-check.mjs

      # Same CC-CMD, TASK 2: a close-out names a session doc (ratchet, 6) and
      # every doc it names exists (tripwire, 0). Two facts, two budgets.
      - name: HANDOFF close-outs name a session doc that exists
        if: always()
        run: node scripts/check-closeout-session-doc.mjs --self-test && node scripts/check-closeout-session-doc.mjs

      - name: HANDOFF.md is not stale
        if: always()
        run: node scripts/check-handoff-current.mjs --self-test && node scripts/check-handoff-current.mjs
