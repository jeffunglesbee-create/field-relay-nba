name: Register Rule 99 (deploy-unblock, one-shot)

# deploy.yml's verify job scans jubilant-bassoon STANDARDS.md for `## Rule N`
# (N >= 89) and fails if THIS repo's D1 codex has no matching
# category="rule-registry" entry. Adding Rule 99 (DISTINGUISHABILITY-A) in
# jubilant-bassoon 3da97fb9 turned that check red, as STANDARDS.md Rule 90
# (RULE-COMPLIANCE-FOLLOWUP-A) requires: registration is not optional and is not
# deferrable to a later session.
#
# Same one-shot pattern as register-rule-98.yml -- the sandbox cannot reach
# workers.dev, so the write goes out from a runner through this repo's own
# /d1/execute route.
#
# REGISTERED AS EXERCISED, NOT UNEXERCISED, and that is deliberate. Rule 90's
# normal flow is register UNEXERCISED, then flip when a real case appears. Rule
# 99's real case PREDATES the rule: it was written from field-relay-nba
# src/index.js:6503, where a Cloudflare cache hit strips x-requests-remaining
# and `|| 0` made that indistinguishable from zero credits, starving MLS,
# Bundesliga, CFB and NFL of odds while the account sat at 44,235 of 100,000
# used. Fixed in the same session (dc7df57). "UNEXERCISED" would be false on the
# day it was written, and would make rule90-staleness-monitor.yml red in 14 days
# over a rule that has already done its work.

on:
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Insert rule-99 into codex rule-registry
        run: |
          curl -sS -X POST "https://field-relay-nba.jeffunglesbee.workers.dev/d1/execute" \
            -H "Content-Type: application/json" \
            -H "X-FIELD-Relay: field-relay-cron-2026" \
            -d '{"sql":"INSERT INTO codex (key, category, title, content, status, updated_at) VALUES (?, ?, ?, ?, ?, datetime(\"now\"))","params":["rule-99","rule-registry","EXERCISED -- Rule 99 (DISTINGUISHABILITY-A): at every boundary the decoder must represent at least as many states as the source can produce that warrant different action; absence is a SIBLING of the value, never a member of it. Exercised 2026-09-11 on field-relay-nba src/index.js:6503.","Rule 99 lives in jubilant-bassoon STANDARDS.md:4906 (commit 3da97fb9). Registered EXERCISED rather than UNEXERCISED because the case predates the rule: fetchSportOddsLive runs with cacheEverything true, a Cloudflare edge cache hit returns the body without x-requests-remaining, and parseInt(h || 0) || 0 mapped that onto 0. snapshotCronOdds then hit its quota floor and returned, starving every sport after it -- MLS 0/17 rows, Bundesliga 0/2, CFB 0/4, NFL 0/1 across two dates, while the Odds API account sat at 44,235 of 100,000 credits used. Three collapse sites fixed in dc7df57 (index.js:6503 live, index.js:6603 historical, wp-resolver.js:268 latent) plus both quota-gated loops; guarded by scripts/check-quota-gate-ordering.mjs in deploy.yml and censused by scripts/check-absence-collapse.mjs in jubilant-bassoon deploy-gate.yml.","open"]}' \
            -w "\nHTTP %{http_code}\n"

      - name: Confirm the entry now exists
        run: |
          curl -sS -X POST "https://field-relay-nba.jeffunglesbee.workers.dev/d1/execute" \
            -H "Content-Type: application/json" \
            -H "X-FIELD-Relay: field-relay-cron-2026" \
            -d '{"sql":"SELECT key, category, title FROM codex WHERE category = '"'"'rule-registry'"'"' AND key = '"'"'rule-99'"'"'"}' \
            -w "\nHTTP %{http_code}\n" | tee /tmp/confirm.json
          grep -q '"key":"rule-99"' /tmp/confirm.json || { echo "rule-99 NOT present after insert"; exit 1; }
          echo "rule-99 registered."
