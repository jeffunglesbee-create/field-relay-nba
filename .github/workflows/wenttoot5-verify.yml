name: wenttoot5-verify
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wenttoot5-verify.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Independently re-verify ESPN period data for the 2 new games + re-confirm the 3 already-fixed
        run: echo "" | base64 -d > /tmp/verify5.py && python3 /tmp/verify5.py
