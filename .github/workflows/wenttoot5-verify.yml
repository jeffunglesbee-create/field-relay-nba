name: wenttoot5-verify
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wenttoot5-verify.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Live-verify /analytics/newspaper against deployed relay for all 5 games
        run: echo "" | base64 -d > /tmp/verify_live5.py && python3 /tmp/verify_live5.py
