name: field-laboratory MCP Live Verification

# CC-CMD-2026-08-09-create-field-laboratory-repo, Tasks 4 and 5.
#
# Mechanism copied from field-playground-verify.yml, which is the proven
# original for this exact check (run 29962867352, 2026-07-22). Same MCP
# endpoint, same secret header, same JSON-RPC shape.
#
# Two checks are ADDED beyond that original, because this CC-CMD asks for
# things the 2026-07-22 verification did not cover:
#
#   STEP 4 — an INVALID repo value must not silently route to a real repo.
#     The 2026-07-22 work found exactly that bug (a binary ternary defaulting
#     any unknown value to field-relay-nba). Task 4 says re-verify the class
#     has not recurred. Note the routing helpers still end in
#     `REPO_NAMES[repoKey] || REPO_NAMES['jubilant-bassoon']`, so the schema
#     enum is what must reject it -- this step measures which, rather than
#     assuming the enum is enforced.
#
#   STEP 5 — the governance decision must be ENFORCED, not merely documented.
#     field-laboratory deliberately did NOT receive field-playground's
#     write-allowlist exemption (Task 3). A root-level write must therefore be
#     REJECTED. Without this step the decision is a sentence in a doc; with it,
#     it is a measured behaviour.
#
# Trigger: workflow_dispatch OR push of outbox/.trigger-field-laboratory-verify

on:
  workflow_dispatch:
  push:
    paths: ['outbox/.trigger-field-laboratory-verify']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: MCP live verification against field-laboratory
        continue-on-error: true
        env:
          FIELD_MCP_SECRET: ${{ secrets.FIELD_MCP_SECRET }}
          WORKER_BASE: https://field-relay-nba.jeffunglesbee.workers.dev
        run: |
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p outbox
          OUT="outbox/field-laboratory-verify-${TS}.txt"
          echo "TS=$TS" >> "$GITHUB_ENV"
          echo "=== field-laboratory MCP Live Verification [$TS] ===" > "$OUT"
          echo "Worker: $WORKER_BASE" >> "$OUT"
          echo "" >> "$OUT"

          python3 << 'PYEOF' >> "$OUT" 2>&1
          import os, json, urllib.request, urllib.error

          BASE   = os.environ['WORKER_BASE']
          SECRET = os.environ['FIELD_MCP_SECRET']
          UA     = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36'
          results = []

          def mcp_call(method, params):
              body = json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              req = urllib.request.Request(f'{BASE}/mcp', data=body, method='POST', headers={
                  'Content-Type': 'application/json',
                  'X-FIELD-MCP-Secret': SECRET,
                  'User-Agent': UA,
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode('utf-8', 'replace')
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')

          def record(name, ok, detail):
              results.append((name, ok, detail))
              print(f"{'PASS' if ok else 'FAIL'} {name}: {detail}")

          # ── STEP 1: read_file README.md from field-laboratory ──────────────
          # auto_init created this at repo creation; reading it proves the new
          # repo is reachable through the tool, not just through the raw API.
          print("--- STEP 1: read_file README.md repo=field-laboratory ---")
          st, body = mcp_call('tools/call', {'name':'read_file','arguments':{'path':'README.md','repo':'field-laboratory'}})
          print(f"HTTP {st}\n{body[:500]}\n")
          record('step1_read_file', st == 200 and 'field-laboratory' in body,
                 f'status={st}, response references field-laboratory={"field-laboratory" in body}')

          # ── STEP 2: commit_file into docs/ (inside the standard allowlist) ──
          print("--- STEP 2: commit_file docs/mcp-access-confirmed.md ---")
          st, body = mcp_call('tools/call', {'name':'commit_file','arguments':{
              'path':'docs/mcp-access-confirmed.md',
              'repo':'field-laboratory',
              'content':'# field-laboratory\n\nFIELD Handoff MCP write access confirmed by\nCC-CMD-2026-08-09-create-field-laboratory-repo Task 5.\n',
              # commit_message, NOT message. The first run of this probe sent
              # `message` and got "Required: path, content, commit_message" back
              # for steps 2 and 5 -- argument validation, before any routing or
              # allowlist logic ran. Step 5's FAIL therefore did NOT show the
              # write succeeding; it showed the call never reached the check.
              # Schema read from src/index.js: required ['path','content','commit_message'].
              'commit_message':'chore: confirm FIELD Handoff MCP access to field-laboratory',
          }})
          print(f"HTTP {st}\n{body[:600]}\n")
          record('step2_commit_file', st == 200 and 'field-laboratory' in body and 'field-relay-nba' not in body,
                 f'status={st}, references field-laboratory and NOT field-relay-nba')

          # ── STEP 3: get_archive_url, then actually fetch it ────────────────
          # Fetching is the point. A URL that 404s would still "return a URL".
          print("--- STEP 3: get_archive_url + real fetch ---")
          st, body = mcp_call('tools/call', {'name':'get_archive_url','arguments':{'repo':'field-laboratory'}})
          print(f"HTTP {st}\n{body[:600]}\n")
          url = None
          try:
              txt = json.loads(body)['result']['content'][0]['text']
              inner = json.loads(txt)
              url = inner.get('url') or inner.get('archive_url') or inner.get('archiveUrl')
          except Exception as e:
              print(f"(could not parse archive url: {e})")
          fetched_ok, fetched_bytes = False, 0
          if url:
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': UA})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      data = r.read()
                      fetched_bytes = len(data)
                      # A git tarball begins with the gzip magic bytes 1f 8b.
                      fetched_ok = r.status == 200 and data[:2] == b'\x1f\x8b'
              except Exception as e:
                  print(f"(fetch failed: {e})")
          record('step3_archive_fetch', fetched_ok,
                 f'url_present={bool(url)}, bytes={fetched_bytes}, gzip_magic={fetched_ok}')

          # ── STEP 4: an INVALID repo value must NOT silently route ──────────
          print("--- STEP 4: invalid repo value must not silently route ---")
          st, body = mcp_call('tools/call', {'name':'read_file','arguments':{'path':'README.md','repo':'field-not-a-real-repo'}})
          print(f"HTTP {st}\n{body[:500]}\n")
          # Two acceptable outcomes: a rejection, OR routing to the documented
          # jubilant-bassoon default. What is NOT acceptable is silently
          # serving field-laboratory or field-relay-nba content.
          leaked = ('field-laboratory' in body) or ('field-relay-nba' in body)
          record('step4_invalid_repo_no_leak', not leaked,
                 f'status={st}, leaked_other_repo={leaked}')

          # ── STEP 5: the governance decision must be ENFORCED ───────────────
          # field-laboratory did NOT get field-playground's exemption, so a
          # root-level write must be rejected with the allowlist error.
          print("--- STEP 5: root-level write must be REJECTED (no exemption) ---")
          st, body = mcp_call('tools/call', {'name':'commit_file','arguments':{
              'path':'GOVERNANCE-PROBE.md',
              'repo':'field-laboratory',
              'content':'this write must be rejected',
              'commit_message':'chore: governance probe (expected to fail)',
          }})
          print(f"HTTP {st}\n{body[:500]}\n")
          record('step5_allowlist_enforced', 'WRITE_ALLOWLIST' in body,
                 f'status={st}, rejected_with_allowlist_error={"WRITE_ALLOWLIST" in body}')

          # ── STEP 6: control — field-playground still HAS its exemption ─────
          # Proves step 5 measured a per-repo decision, not a blanket change.
          print("--- STEP 6: control, field-playground exemption intact ---")
          st, body = mcp_call('tools/call', {'name':'read_file','arguments':{'path':'README.md','repo':'field-playground'}})
          print(f"HTTP {st}\n{body[:300]}\n")
          record('step6_playground_control', st == 200 and 'field-playground' in body,
                 f'status={st}')

          print("\n=== SUMMARY ===")
          for name, ok, detail in results:
              print(f"{'PASS' if ok else 'FAIL'}  {name}  -- {detail}")
          failed = [n for n, ok, _ in results if not ok]
          print(f"\nRESULT: {len(results)-len(failed)}/{len(results)} passed")
          if failed:
              print("FAILED: " + ", ".join(failed))
          PYEOF

          cat "$OUT"

      - name: Commit the result
        # always(): a FAIL is the finding, and the probe's own exit status must
        # not decide whether the evidence survives.
        if: always()
        run: |
          git config user.email "field-laboratory-verify@field"
          git config user.name "FIELD CI"
          git add outbox/field-laboratory-verify-*.txt || echo "(nothing to stage)"
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: field-laboratory MCP verification result [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main -q && git rebase origin/main -q && git push origin main && exit 0
            echo "push attempt $i failed, retrying"
            sleep $((i * 3))
          done
          echo "::error::result could not be pushed after 5 attempts"
          exit 1
