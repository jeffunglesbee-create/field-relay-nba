name: NFL per-play EPA route matches the client

# Done conditions 1 and 2 of CC-CMD-2026-08-27-relay-per-play-epa.
#
# scripts/nfl-epa-transcription-check.mjs (blocking, in deploy.yml) asserts the
# relay MODULE matches the client's code offline. This asserts the DEPLOYED
# ROUTE does, on a real game's bytes — which the offline check cannot see, and
# which the sandbox cannot run because it 403s *.workers.dev and gets HTTP 000
# to ESPN.
#
# SCHEDULE ADDED 2026-08-27, reversing this file's original "NO SCHEDULE", on
# the day the reason for it stopped being true.
#
# The original argument was that this answers "did the move preserve the
# numbers" once per change to either side, so a cron would burn runs on days
# nobody edited it -- the waste pattern audited in jubilant-bassoon
# outbox/cc-session-2026-08-16-scheduled-workflow-audit.md.
#
# What changed: jubilant-bassoon 7f6fab4 DELETED its own EP model and now renders
# NFL EPA from this route. The route is no longer a thing we moved and verified;
# it is a live dependency of a shipped feature. An upstream ESPN shape change
# needs neither a relay push nor a client push to break it, and nothing else
# would notice -- the transcription check is offline and the deploy trigger only
# fires on our own deploys. One run a day, ~1 minute, against a 90%-consumed
# budget: worth it for a feature that would otherwise fail silently.
#
# The enumerated relay-vs-client table it commits is the artifact (Rule 89), and
# each run now records its checks BY NAME so the artifact says which assertions
# ran, not just that the run was green.
#
# NOT OBSERVABLE is fatal on a deploy and neutral on the heartbeat. A deploy must
# PROVE the route still works, so a deploy that cannot be checked has not been
# checked; a daily heartbeat cannot summon an NFL game, and a red every
# off-season day trains people to stop reading the red. Same words either way --
# only the exit code differs, because only the question differs.

# TRIGGERED BY THE DEPLOY, NOT BY THE PUSH.
#
# The first version fired on `push` to src/nfl-epa.js and raced deploy.yml,
# which starts from the same push. Run 33122300358 is the evidence: the .ep
# unwrap fix landed at 22:23:22, deploy was still in_progress, and the probe
# read the OLD route at 22:23:37 and reported 149 disagreements of 149. The
# probe was right and the verdict was meaningless — it tested bytes the fix had
# not reached yet.
#
# That is the same confound that cost field-laboratory two wrong readings today
# (verify tests the deployed site; deploy runs after verify). A probe against a
# DEPLOYED route must wait for the deploy, so this waits for it.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'   # daily, an hour after the undocumented-API health check
  workflow_run:
    workflows: ["Deploy RELAY Worker"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: nfl-epa-route-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A failed deploy left the old route live; probing it would report on bytes
    # nobody shipped. workflow_dispatch has no upstream conclusion, so it passes.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # NOT continue-on-error. A route that disagrees with the client is the
      # two-model problem this whole change exists to prevent.
      - name: Probe the deployed route against the client
        env:
          # Only the cron is a heartbeat. workflow_run (a deploy) and a manual
          # dispatch both have to prove the route works.
          EPA_PROBE_HEARTBEAT: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: node scripts/nfl-epa-route-probe.mjs

      - name: Surface the verdict
        if: always()
        run: |
          F=$(ls -t outbox/nfl-epa-route-probe-*.json 2>/dev/null | head -1)
          [ -n "$F" ] || { echo "::warning::no artifact — the probe did not reach the route"; exit 0; }
          node -e '
            const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            console.log(`::notice::${d.verdict} — ${d.route_plays} route plays, ${d.client_plays} client plays, ${d.disagreements} disagreement(s)`);
            console.log(`game: ${d.game.name} (${d.game.id}, ${d.game.state})`);
          ' "$F"

      - name: Commit the artifact
        if: always()
        run: |
          git config user.name  "FIELD CI"
          git config user.email "claude@field.dev"
          git add outbox/nfl-epa-route-probe-*.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "probe: nfl per-play EPA route vs client [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
