# One-shot: set CLOUDFLARE_API_TOKEN in field-tonight through the Deploy Courier.
# docs/CC-CMD-2026-11-27-field-tonight-secret-bootstrap.md, TASK 2b. Owner approval 2026-11-27 ("option 1": the Courier route).
#
# WHY A ONE-SHOT, WHEN deploy.yml ALREADY HAS THE BOOTSTRAP STEP. The step in deploy.yml is the permanent mechanism (it re-syncs on every healthy
# relay deploy, so a rotated token propagates). On 2026-11-27 the relay's deploy job failed at its own gate, step 132 "a staged claim names a
# verifier that exists and runs", on a pre-existing orphan in docs/CC-CMD-2026-10-27-bsd-event-id-on-game-rows.md (the same failure on the commit
# BEFORE this work), so every step after 132, the bootstrap included, was skipped. This does the same one call without deploying the relay, so
# it bypasses nothing the gate protects. It is not a second mechanism for rotation: the deploy.yml step stays.
#
# Narrow on purpose: the target repo and secret name are fixed here, no inputs. The value comes from this repo's own secret through an env var,
# never a literal; the Courier's answer never contains it, and only the answer is written to outbox/.
name: set-field-tonight-secret
on:
  push:
    paths: ['outbox/.trigger-set-field-tonight-secret']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write   # GitHub OIDC for Courier v4 auth
concurrency:
  group: set-field-tonight-secret
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Get GitHub OIDC token
        id: oidc
        run: |
          TOKEN=$(curl -sH "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=field-deploy" | jq -r .value)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "OIDC token acquired (audience=field-deploy)"
      - name: Sync CLOUDFLARE_API_TOKEN to field-tonight
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          RESULT=$(curl -s -m 60 -w '\nHTTP %{http_code}' -X POST https://field-deploy.jeffunglesbee.workers.dev/secret \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"field-tonight\",\"name\":\"CLOUDFLARE_API_TOKEN\",\"value\":\"$CF_TOKEN\"}")
          mkdir -p outbox
          { echo "field-tonight CLOUDFLARE_API_TOKEN sync, $(date -u +%Y-%m-%dT%H:%MZ), run $GITHUB_RUN_ID"; echo "$RESULT"; } > outbox/field-tonight-secret-sync-latest.txt
          cat outbox/field-tonight-secret-sync-latest.txt
          echo "$RESULT" | grep -q '"ok":true' || { echo "Sync FAILED (see the answer above; a 502 'Public key' means the Courier's GITHUB_PAT does not reach field-tonight)"; exit 1; }
      - name: Commit the answer (the Courier's reply only, never the value)
        if: always()
        run: |
          git config user.email "claude@field.dev"; git config user.name "FIELD CI"
          git rm -q --ignore-unmatch outbox/.trigger-set-field-tonight-secret
          git add outbox/field-tonight-secret-sync-latest.txt || true
          git diff --cached --quiet && exit 0
          git commit -m "data: the Courier's answer to the field-tonight secret sync"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin HEAD:main && break; sleep $((i*5)); done
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after retries"; exit 1; }
