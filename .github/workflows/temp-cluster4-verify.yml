name: TEMP Cluster4 Verify

# TEMP-CLUSTER4-VERIFY-2026-07-13: forced-failure + success-path verification
# for relay-empty-catches-cluster4. POSTs malformed JSON to /user/event while
# tailing the worker to confirm the new [USER-DO] catch fires correctly.
# Delete after use — see docs/CC-CMD-2026-07-13-relay-empty-catches-cluster4.md

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install --no-save wrangler

      - name: Trigger forced-failure + success-path calls, capture tail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -x
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          OUT="outbox/temp-cluster4-tail-${TS}.json"
          mkdir -p outbox

          (
            sleep 6
            echo "=== forced-failure: malformed JSON body to /user/event ==="
            curl -sS -X POST "https://field-relay-nba.jeffunglesbee.workers.dev/user/event?userId=CATCHTEST12345678" \
              -H "Content-Type: application/json" \
              --data-raw '{not-valid-json' \
              -o "outbox/temp-cluster4-forced-result-${TS}.json" -w "HTTP %{http_code}\n"
            cat "outbox/temp-cluster4-forced-result-${TS}.json"
          ) &

          timeout -k 5s 40s npx wrangler tail field-relay-nba --format json --search "USER-DO" > "$OUT" 2>tail.err || true

          echo "=== tail.err ==="
          cat tail.err || true
          echo "=== File: $OUT (line count) ==="
          wc -l "$OUT" || true

          echo "OUT=$OUT" >> $GITHUB_ENV

      - name: Push result
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Debug-Probe"
          git add outbox/
          git commit -m "temp: cluster4 verify capture [skip ci]" || echo "(nothing to commit)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
