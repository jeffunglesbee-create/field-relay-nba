name: wenttoot-historical-backfill-run
on:
  push:
    paths: ['.github/workflows/wenttoot-historical-backfill-run.yml']

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check live games across sports
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for sport in mlb wnba nba nhl; do
            echo "=== $sport ==="
            curl -sS -A "$UA" "https://field-relay-nba.jeffunglesbee.workers.dev/v2/games?sport=$sport" > /tmp/games.json
            TOTAL=$(jq '.games | length' /tmp/games.json)
            LIVE=$(jq '[.games[] | select(.state=="live")] | length' /tmp/games.json)
            echo "total=$TOTAL live=$LIVE"
            jq -c '.games[] | select(.state=="live") | {id, home: .home.name, away: .away.name, periodLabel}' /tmp/games.json
          done
