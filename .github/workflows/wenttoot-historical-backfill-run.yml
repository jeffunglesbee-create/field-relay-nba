name: wenttoot-historical-backfill-run
on:
  push:
    paths: ['.github/workflows/wenttoot-historical-backfill-run.yml']

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check /v2/games for WNBA 2026-05-20 (row has real espn_event_id 401856920, still unresolved)
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -A "$UA" "https://field-relay-nba.jeffunglesbee.workers.dev/v2/games?sport=wnba&date=2026-05-20" | python3 -m json.tool

      - name: Check /v2/games for MLB 2026-06-20 (row has NULL espn_event_id)
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -A "$UA" "https://field-relay-nba.jeffunglesbee.workers.dev/v2/games?sport=mlb&date=2026-06-20" | python3 -m json.tool
