name: wenttoot-historical-backfill-run
on:
  push:
    paths: ['.github/workflows/wenttoot-historical-backfill-run.yml']

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Directly exercise the fixed urlopen+User-Agent codex-write path (forced, not conditional)
        run: |
          python3 << 'PYEOF'
          import json, sys, urllib.request, urllib.error
          from datetime import datetime, timezone

          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          now = datetime.now(timezone.utc)
          content = json.dumps({
              'checked_at': now.strftime('%Y-%m-%dT%H:%M:%SZ'),
              'note': 'temp diagnostic -- proving the User-Agent fix resolves the real 403 -- CC-CMD-2026-07-12-completion-trigger-close TASK 3',
          })
          sql = '''INSERT INTO codex (key, category, title, content, status)
                   VALUES (?, ?, ?, ?, 'open')
                   ON CONFLICT(key) DO UPDATE SET content=excluded.content, updated_at=datetime('now')'''
          payload = json.dumps({
              'sql': sql,
              'params': ['diag-verify-pending-checks-ua-fix',
                         'verification',
                         'DIAG: verify-pending-checks.yml User-Agent fix proof (safe to delete)',
                         content],
          }).encode()
          req = urllib.request.Request(
              'https://field-relay-nba.jeffunglesbee.workers.dev/d1/execute',
              data=payload, method='POST',
              headers={
                  'Content-Type': 'application/json',
                  'X-FIELD-Relay': 'field-relay-cron-2026',
                  'User-Agent': UA,
              },
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  body = resp.read().decode()
                  print(f'SUCCESS: codex write status={resp.status} body={body}')
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f'FAILED: HTTP {e.code} body={body}', file=sys.stderr)
              raise
          PYEOF
