name: wenttoot-historical-backfill-run
on:
  push:
    paths: ['.github/workflows/wenttoot-historical-backfill-run.yml']

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnostic -- immediate neighbor route /archive/backfill-enrich (GET, no auth) still routes?
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -A "$UA" "https://field-relay-nba.jeffunglesbee.workers.dev/archive/backfill-enrich" -w "\nHTTP:%{http_code}\n"

      - name: Diagnostic -- /archive/score-missing (GET, no auth, another close neighbor) still routes?
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -A "$UA" "https://field-relay-nba.jeffunglesbee.workers.dev/archive/score-missing" -w "\nHTTP:%{http_code}\n"

      - name: Diagnostic -- /health baseline
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -A "$UA" "https://field-relay-nba.jeffunglesbee.workers.dev/health" -w "\nHTTP:%{http_code}\n"

      - name: Diagnostic -- /deploy/verify (confirm which commit is actually live right now)
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -A "$UA" "https://field-relay-nba.jeffunglesbee.workers.dev/deploy/verify" -w "\nHTTP:%{http_code}\n"
