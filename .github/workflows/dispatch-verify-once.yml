name: Verify post-deploy-verify dispatch (one-shot)
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/dispatch-verify-once.yml

permissions:
  contents: write

jobs:
  poll-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Poll until post-deploy-verify.yml is indexed, then dispatch and self-cleanup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAX=6
          DELAY=300
          for i in $(seq 1 $MAX); do
            echo "--- Attempt $i / $MAX ---"
            NAME=$(gh api repos/jeffunglesbee-create/field-relay-nba/actions/workflows/post-deploy-verify.yml \
              --jq '.name')
            echo "Workflow name field: $NAME"

            if [ "$NAME" = "Post-deploy live verification" ]; then
              echo "YAML indexed. Attempting dispatch..."
              STATUS=$(gh api -X POST \
                repos/jeffunglesbee-create/field-relay-nba/actions/workflows/post-deploy-verify.yml/dispatches \
                -f ref=main \
                -w "%{http_code}" -o /dev/null 2>&1 || true)
              echo "Dispatch HTTP status: $STATUS"

              if [ "$STATUS" = "204" ]; then
                echo "RESULT: SUCCESS — dispatch returned 204. Rename escaped frozen registry."

                # Self-cleanup: delete this workflow file
                git config user.email "claude@field.dev"
                git config user.name "FIELD CI"
                git pull --rebase origin main
                git rm .github/workflows/dispatch-verify-once.yml

                # Update HANDOFF
                python3 - <<'PYEOF'
import re
handoff = open('HANDOFF.md').read()
old = '### Result: 90/100 — sub-95, reporting verbatim per CC-CMD'
new = '### Result: 100/100 — CONFIRMED\n\nTask 3 dispatch confirmed working (204) after breaking R100 rename identity (commit a5db076 forced GitHub YAML reindex). dispatch-verify-once.yml self-deleted.'
handoff = handoff.replace(old, new, 1)
open('HANDOFF.md', 'w').write(handoff)
PYEOF
                git add HANDOFF.md
                git commit -m "ci: post-deploy-verify dispatch confirmed; remove one-shot verify workflow [skip ci]"
                git push origin main
                exit 0
              else
                echo "RESULT: FAIL — dispatch returned $STATUS after indexing. New frozen entry on ID 317109373. Escalate to GitHub support."
                exit 1
              fi
            else
              if [ "$i" -lt "$MAX" ]; then
                echo "Not yet indexed. Waiting ${DELAY}s..."
                sleep $DELAY
              fi
            fi
          done
          echo "RESULT: TIMEOUT — workflow not indexed after $((MAX * DELAY / 60)) minutes."
          exit 1
