name: Worker secret names (read-only)

# Does a Worker hold a secret binding? Names and types from the Cloudflare API,
# never values. Built for docs/CC-CMD-2026-08-25-rotate-relay-secret.md: step 1
# makes the relay's gates fail closed on an unset binding, so the binding's
# existence on BOTH Workers is a precondition, not an assumption. See
# scripts/worker-secret-names.sh for the states and the control.
#
# DISPATCH ONLY. It answers a question; it changes nothing.

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Secret binding to look for'
        required: true
        default: 'RELAY_SHARED_SECRET'
        type: string

permissions:
  contents: write

jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: the check can fail
        run: bash scripts/worker-secret-names.sh --self-test

      # pipefail: without it the step's exit code is tee's.
      - name: Look on both Workers
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_NAME: ${{ inputs.secret_name }}
        run: |
          set -o pipefail
          STAMP=$(date -u +%Y-%m-%dT%H%M)
          { echo "=== worker secret names  utc=$(date -u +%FT%TZ)  secret=$SECRET_NAME ==="
            bash scripts/worker-secret-names.sh "$SECRET_NAME" field-relay-nba field-claude-proxy
          } 2>&1 | tee "outbox/worker-secret-names-${STAMP}.log" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the log
        if: always()
        run: |
          PROBE_AUTHOR_NAME="worker-secret-names" \
          PROBE_AUTHOR_EMAIL="actions@github.com" \
          bash scripts/probe-commit-retry.sh "chore: worker secret names"
