name: pat-scope-check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pat-scope-check.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check RELAY_GH_PAT's actual granted OAuth scopes
        env:
          RELAY_GH_PAT: ${{ secrets.RELAY_GH_PAT }}
        run: |
          echo "" | base64 -d > /tmp/pat_scope_check.py
          python3 /tmp/pat_scope_check.py
