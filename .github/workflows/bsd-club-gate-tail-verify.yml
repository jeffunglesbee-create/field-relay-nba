name: BSD Club Gate Tail Verify
# CC-CMD-2026-08-02-gate-bsd-club-league-capture TASK 3 real live
# verification. Tails live worker logs across a real window spanning
# both a */5-only tick and a */5+*/15-coincidence tick, capturing real
# [BSD-CLUB-GATE] log lines to confirm the gate fires on */5 (both
# forms) and correctly reports fired=false on the */15 invocation at
# coincidence minutes (:00/:15/:30/:45).

on:
  workflow_dispatch:

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Tail worker logs across a real cron window
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== wrangler tail capture start: $(date -u) ==="
          npx wrangler tail field-relay-nba --format pretty > tail_output.log 2>&1 &
          TAIL_PID=$!
          echo "tail PID: $TAIL_PID"

          echo "=== Waiting ~12 min for real cron ticks (BSD-CLUB-GATE) ==="
          sleep 720

          kill $TAIL_PID 2>/dev/null || true
          sleep 2
          echo "=== wrangler tail capture end: $(date -u) ==="

          echo "=== BSD-CLUB-GATE lines captured ==="
          grep "BSD-CLUB-GATE" tail_output.log || echo "(none captured)"

      - name: Save real captured evidence
        run: |
          mkdir -p outbox
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          grep "BSD-CLUB-GATE" tail_output.log > "outbox/bsd-club-gate-tail-${ts}.log" || echo "(no matching lines)" > "outbox/bsd-club-gate-tail-${ts}.log"
          git config user.email "probe@field"
          git config user.name "BSD Club Gate Tail Verify"
          git add outbox/bsd-club-gate-tail-*.log
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "bsd-club-gate tail verify result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
