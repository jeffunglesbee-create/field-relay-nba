name: Relay secret probe (read-only, free)

# The live half of docs/CC-CMD-2026-08-25-rotate-relay-secret.md: the deployed
# relay and proxy accept RELAY_SHARED_SECRET from this repo's Actions secret,
# refuse a wrong value and a missing header, and (after the rotation) refuse
# the OLD value. See scripts/probe-relay-secret-gates.sh. No values are printed.
#
# DISPATCH ONLY. The rotation workflow calls the same script with OLD_SECRET.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: the gates can fail (static, with mutations)
        run: |
          node scripts/check-relay-secret-gates.mjs
          node scripts/check-relay-secret-gates.mjs --self-test

      # pipefail: without it the step's exit code is tee's.
      - name: Probe the deployed Workers
        shell: bash
        env:
          RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
        run: |
          set -o pipefail
          STAMP=$(date -u +%Y-%m-%dT%H%M)
          { echo "=== relay secret probe  utc=$(date -u +%FT%TZ) ==="
            bash scripts/probe-relay-secret-gates.sh
          } 2>&1 | tee "outbox/relay-secret-probe-${STAMP}.log" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the log
        if: always()
        run: |
          PROBE_AUTHOR_NAME="relay-secret-probe" \
          PROBE_AUTHOR_EMAIL="actions@github.com" \
          bash scripts/probe-commit-retry.sh "chore: relay secret probe"
