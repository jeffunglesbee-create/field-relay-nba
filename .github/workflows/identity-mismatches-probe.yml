name: Identity mismatches probe (spend-capped)

# docs/CC-CMD-2026-09-11-epl-identity-resolve.md, Task 0 / Done condition 1: a verbatim reading of GET /identity/mismatches
# for ONE sport on up to THREE dates. The route is gated (FIELD_MCP_SECRET) and every call is a billed vendor fetch, so this
# is dispatch-only and the cap is in scripts/probe-identity-mismatches.mjs, not in this file: at most three dates, no repeat
# of a date, one sport, one attempt per date, and the first failure ends the run. Three calls are 9 credits at the relay's
# ledger estimate (3 per sport per call; the provider's real bill is unmeasured). The owner approved 9 credits on 2026-11-22.
#
# scripts/probe-odds-join.mjs and odds-identity-join-saturday.yml cannot do this: their sport list is fixed (no EPL), they probe
# four sports at once (12 credits) and refuse a day that is not a Saturday.
on:
  workflow_dispatch:
    inputs:
      dates:
        description: 'Up to 3 dates, YYYY-MM-DD, comma-separated, none twice (3 credits per date at the ledger estimate)'
        required: true
      sport:
        description: 'One sport, as the archive labels it'
        required: false
        default: 'EPL'

permissions:
  contents: write

concurrency:
  group: identity-mismatches-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # `ref: main`, so a dispatch that queued behind another one reads the payloads the first one committed: the script
      # counts them as calls already made. Every step below runs on attempt 1 only: "Re-run jobs" repeats the same inputs on
      # the same commit, which would not see the first attempt's payloads, and a re-run would spend the approval again.
      - uses: actions/checkout@v4
        with:
          ref: main

      # The inputs travel through `env`, never spliced into the script text.
      - name: Read the route, at most three calls, no retry
        if: github.run_attempt == 1
        env:
          PROBE_DATES: ${{ inputs.dates }}
          PROBE_SPORT: ${{ inputs.sport }}
          FIELD_MCP_SECRET: ${{ secrets.FIELD_MCP_SECRET }}
        run: node scripts/probe-identity-mismatches.mjs

      # A paid reading must not exist only on a runner that is about to be thrown away: it is also printed in the log above.
      - name: Keep the payloads
        if: always() && github.run_attempt == 1
        uses: actions/upload-artifact@v4
        with:
          name: identity-mismatches-payloads
          path: outbox/identity-mismatches-*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit the payloads
        if: always() && github.run_attempt == 1
        run: |
          git config user.name "FIELD CI"
          git config user.email "claude@field.dev"
          git add outbox/identity-mismatches-*.json || { echo "no payload"; exit 0; }
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "outbox: identity mismatches payloads"
          LOG=/tmp/push.log; : > "$LOG"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main >>"$LOG" 2>&1 \
               && git push origin main >>"$LOG" 2>&1; then
              echo "Pushed on attempt $i."; exit 0
            fi
            sleep $((i * 5))
          done
          echo "::group::push log"; cat "$LOG"; echo "::endgroup::"
          if grep -qiE 'denied|403|permission|forbidden' "$LOG"; then
            echo "Push failed on PERMISSIONS."
          fi
          # The push did not land, and this step does not turn that green: the payloads are in the artifact and the log.
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::the payloads are NOT on main; they are in the run's artifact and in the log above. Do not re-run: it would spend the approval again."; exit 1; }
