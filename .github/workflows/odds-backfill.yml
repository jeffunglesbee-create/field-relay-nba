name: Odds Historical Backfill
on:
  schedule:
    # 10:00 UTC daily (6 AM ET). Picks the oldest unprocessed date and walks
    # forward until the shared 2,700 credit/day ceiling is hit.
    - cron: '0 10 * * *'
  # Kept input-less so manual triggers stay one-click. The script is
  # fully self-managing — it reads progress from D1 and discovers what
  # to do without any external arg.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run odds backfill
        env:
          # No literal fallback (removed 2026-08-25). It was a live credential in
          # a tracked file, and it made an unset secret indistinguishable from a
          # rejected one: both give a 401 from the Odds API, and only one is
          # fixable by setting a variable. An unset secret now sends an empty
          # key and the 401 names the real cause.
          ODDS_API_KEY:          ${{ secrets.ODDS_API_KEY }}
          RELAY_BASE:            ${{ secrets.RELAY_BASE || 'https://field-relay-nba.jeffunglesbee.workers.dev' }}
        run: node .github/scripts/odds-backfill.js
