name: verify-deploy-status
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-deploy-status.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Live-verify get_deploy_status against field-relay-nba
        env:
          FIELD_MCP_SECRET: ${{ secrets.FIELD_MCP_SECRET }}
        run: |
          echo "" | base64 -d > /tmp/verify_deploy_status.py
          python3 /tmp/verify_deploy_status.py
