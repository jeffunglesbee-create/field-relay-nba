name: Diagnose field-laboratory root 404

# CC-CMD-2026-08-10-laboratory-secret-bootstrap — the done condition is NOT met
# and this establishes why before anything is claimed.
#
# Measured so far: deploy run 31350075473 concluded SUCCESS, /version.txt
# returns 200 with commit 81e35bd, STATUS.md self-reports "live" at 81e35bd --
# and yet "/" returns 404 with body "error code: 1042" (17 bytes).
#
# Two things must be reconciled rather than guessed at:
#   1. field-laboratory's own deploy.yml is documented to fetch the live URL and
#      grep it for "FIELD Laboratory". If "/" 404s, how did that step pass?
#      Its job log is the authority.
#   2. Which paths actually serve. /version.txt works and / does not, so this
#      is not a dead Worker -- it is a routing or asset-manifest question, and
#      the response HEADERS distinguish an edge error from a missing asset.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose
        continue-on-error: true
        env:
          PAT: ${{ secrets.RELAY_GH_PAT }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, datetime
          PAT = os.environ["PAT"]
          API = "https://api.github.com/repos/jeffunglesbee-create/field-laboratory"
          SITE = "https://field-laboratory.jeffunglesbee.workers.dev"
          TS = datetime.datetime.utcnow().strftime("%Y%m%dT%H%M%SZ")
          out = {"ts": TS}

          def gh(url, raw=False):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {PAT}",
                  "Accept": "application/vnd.github.raw" if raw else "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "field-relay-nba-cc"})
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")

          # 1. What did field-laboratory's OWN live check actually assert?
          st, body = gh(f"{API}/actions/runs/31350075473/jobs")
          out["jobs_status"] = st
          if st == 200:
              jobs = json.loads(body).get("jobs", [])
              out["jobs"] = [{"name": j["name"], "conclusion": j["conclusion"],
                              "steps": [{"n": s["name"], "c": s["conclusion"]} for s in j.get("steps", [])]}
                             for j in jobs]
              for j in jobs:
                  s2, log = gh(f"{API}/actions/jobs/{j['id']}/logs")
                  if s2 == 200:
                      out[f"log_tail_{j['name']}"] = log[-3000:]
                  else:
                      out[f"log_tail_{j['name']}"] = f"(status {s2})"

          # 2. Which paths serve, with headers -- an edge error and a missing
          #    asset look identical if you only record the status code.
          def probe(path):
              try:
                  req = urllib.request.Request(SITE + path, headers={"User-Agent": "field-relay-nba-cc"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return {"status": r.status, "bytes": len(r.read()),
                              "server": r.headers.get("server"),
                              "cf_ray": r.headers.get("cf-ray"),
                              "content_type": r.headers.get("content-type")}
              except urllib.error.HTTPError as e:
                  b = e.read().decode("utf-8", "replace")
                  return {"status": e.code, "body": b[:200],
                          "server": e.headers.get("server"),
                          "cf_ray": e.headers.get("cf-ray"),
                          "content_type": e.headers.get("content-type")}
              except Exception as e:
                  return {"error": str(e)}

          out["paths"] = {p: probe(p) for p in ["/", "/index.html", "/version.txt", "/STATUS.md", "/nope-404-check"]}

          # 3. What does the build actually emit, and what does wrangler serve from?
          st, w = gh(f"{API}/contents/wrangler.toml", raw=True)
          out["wrangler_toml"] = w if st == 200 else f"(status {st})"

          os.makedirs("outbox", exist_ok=True)
          with open(f"outbox/diagnose-laboratory-404-{TS}.json", "w") as f:
              json.dump(out, f, indent=2)
          print(json.dumps({k: v for k, v in out.items() if not k.startswith("log_tail_")}, indent=2))
          PY
      - name: Commit
        if: always()
        run: |
          git config user.email "diag-lab@field"; git config user.name "FIELD CI"
          git add outbox/diagnose-laboratory-404-*.json || echo "(none)"
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: field-laboratory root-404 diagnostic [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main -q && git rebase origin/main -q && git push origin main && exit 0
            sleep $((i * 3))
          done
          exit 1
