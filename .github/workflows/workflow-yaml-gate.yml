name: Workflow YAML Gate

# 107 workflow files in this repo and, until 2026-09-06, nothing parsed any of
# them. A workflow shipped that GitHub silently refused to register; the only
# symptom was a dispatch error naming the trigger, from a file where nothing
# parsed at all.
#
# Fires on any change under .github/workflows/ — the moment a workflow changes
# is the only moment this can catch anything.

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Every workflow parses and is runnable
        run: node scripts/workflow-yaml-check.mjs

      - name: The push-lands check can still fail
        run: node scripts/check-push-lands.mjs --self-test

      - name: Every pushing workflow lands its push or goes red
        run: node scripts/check-push-lands.mjs

      # docs/CC-CMD-2026-11-03-workflow-jobs-have-no-time-limit.md, TASK 1. Run
      # 41650246688 held a runner for 941 s on one Apps Script request: neither the
      # request nor the job had a limit. This fails when drive-upload-outbox.yml
      # loses either. It judges that one workflow; the other 199 are TASK 2.
      # guards.yml proves, on every push, that this step can fail.
      - name: The Drive upload workflow keeps its request and job time limits
        if: always()
        run: node scripts/check-workflow-timeouts.mjs
