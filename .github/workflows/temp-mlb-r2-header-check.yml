name: TEMP MLB R2 Header Check

# TEMP-MLB-R2-HEADER-CHECK-2026-07-13: verify X-Source response header for
# the 6 merged /mlb-stats/{file} routes (CC-CMD-2026-07-13-mlb-stats-r2-merge).
# Delete after use.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check X-Source header for all 6 files
        run: |
          set -x
          mkdir -p outbox
          OUT="outbox/temp-mlb-r2-headers.txt"
          for f in team_abs.json expected_stats.json sprint_speed.json pitch_tempo.json pitch_arsenals.json umpire_abs.json; do
            echo "=== $f ===" >> "$OUT"
            curl -sS -D - -o /dev/null "https://field-relay-nba.jeffunglesbee.workers.dev/mlb-stats/$f" \
              | grep -iE "^(HTTP|x-source|x-relay-cache|content-length):" >> "$OUT"
            echo "" >> "$OUT"
          done
          cat "$OUT"
      - name: Push result
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Debug-Probe"
          git add outbox/
          git commit -m "temp: mlb-r2-header-check capture [skip ci]" || echo "(nothing to commit)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
