name: TEMP QC Force-Failure Test

on:
  push:
    paths: ['.github/workflows/temp-qc-force-test.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Delete KV key to force past fresh-cache short-circuit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -w "\nHTTP:%{http_code}\n" -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/83edf19398da4ed184a42746cb85c9d7/values/field%3Aquality_calibration"

      - name: Tail worker logs while triggering the request
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest tail field-relay-nba --format json > tail.log 2> tail.err &
          TAIL_PID=$!
          sleep 10
          python3 -c "
          import urllib.request, urllib.error
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          req = urllib.request.Request('https://field-relay-nba.jeffunglesbee.workers.dev/journalism/run', method='POST', headers={'User-Agent': UA})
          try:
              with urllib.request.urlopen(req) as r:
                  print('HTTP', r.status)
                  print(r.read().decode())
          except urllib.error.HTTPError as e:
              print('HTTP', e.code)
              print(e.read().decode())
          "
          sleep 8
          kill $TAIL_PID 2>/dev/null || true
          sleep 1
          echo "=== tail.log ==="
          cat tail.log || true
          echo "=== tail.err (last 30 lines) ==="
          tail -30 tail.err || true
