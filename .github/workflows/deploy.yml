name: Deploy RELAY Worker
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'wrangler.toml'
      - 'workers/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Required for GitHub OIDC token generation (Courier v4 auth)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── KV Bootstrap: create field-push-subs if missing, patch wrangler.toml ──
      - name: Bootstrap KV namespace (field-push-subs)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CF="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          KV_ID=$(curl -s -H "$AUTH" "$CF/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="field-push-subs") | .id' 2>/dev/null)
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            RESP=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{"title":"field-push-subs"}' "$CF/storage/kv/namespaces")
            KV_ID=$(echo "$RESP" | jq -r '.result.id' 2>/dev/null)
            echo "Created KV namespace: $RESP"
          fi
          [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ] && { echo "❌ KV namespace ID not found"; exit 1; }
          echo "✅ KV ID: $KV_ID"
          sed -i "s/PUSH_SUBS_PLACEHOLDER_REPLACE_WITH_REAL_ID/$KV_ID/" wrangler.toml

      # ── KV Bootstrap: create field-journalism if missing (O(1) Newspaper L2) ──
      - name: Bootstrap KV namespace (field-journalism)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CF="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          KV_ID=$(curl -s -H "$AUTH" "$CF/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="field-journalism") | .id' 2>/dev/null)
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            RESP=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{"title":"field-journalism"}' "$CF/storage/kv/namespaces")
            KV_ID=$(echo "$RESP" | jq -r '.result.id' 2>/dev/null)
            echo "Created KV namespace: $RESP"
          fi
          [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ] && { echo "❌ field-journalism KV ID not found"; exit 1; }
          echo "✅ field-journalism KV ID: $KV_ID"
          sed -i "s/JOURNALISM_PLACEHOLDER_REPLACE_WITH_REAL_ID/$KV_ID/" wrangler.toml

      # ── KV Bootstrap: create field-mcp-oauth if missing (Tier 1 Phase 2) ───
      - name: Bootstrap KV namespace (field-mcp-oauth)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CF="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          KV_ID=$(curl -s -H "$AUTH" "$CF/storage/kv/namespaces?per_page=100" | jq -r '.result[] | select(.title=="field-mcp-oauth") | .id' 2>/dev/null)
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            RESP=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" -d '{"title":"field-mcp-oauth"}' "$CF/storage/kv/namespaces")
            KV_ID=$(echo "$RESP" | jq -r '.result.id' 2>/dev/null)
            echo "Created KV namespace: $RESP"
          fi
          [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ] && { echo "❌ field-mcp-oauth KV ID not found"; exit 1; }
          echo "✅ field-mcp-oauth KV ID: $KV_ID"
          sed -i "s/MCP_OAUTH_PLACEHOLDER_REPLACE_WITH_REAL_ID/$KV_ID/" wrangler.toml

      # CC-CMD-2026-07-13-duplicate-prefix-detector: two real route-shadowing
      # bugs (/mlb-stats/{file}, /odds/history/) were found by accident this
      # session. Warn-not-block — some overlaps are legitimate (mutually
      # exclusive env.X/!env.X branches, GET vs POST on the same path).
      - name: Check for shadowed route prefixes (warn-only)
        continue-on-error: true
        run: node scripts/check-route-shadowing.mjs src/index.js

      # Static, pre-deploy, and deliberately BLOCKING (no continue-on-error).
      # The "Soccer league label contract check" further down is a live check
      # against /v2/games -- it verified V2_LEAGUES <-> SOCCER_LEAGUE_LABELS and
      # passed happily for months while the UEFA competitions were never
      # archived at all, because nothing checked the third table (LEAGUES) that
      # actually drives archive writes. This closes that gap before deploy
      # rather than after. See CC-CMD-2026-08-20-uefa-club-competitions.
      - name: Soccer three-table contract — LEAGUES vs SOCCER_LEAGUE_LABELS vs V2_LEAGUES
        run: node scripts/check-leagues-label-contract.mjs

      # ADR-002 PROHIBITED #3 at the generation step. Blocking: a raw composite
      # drama number must not enter prompt text, because the model transcribes it
      # into user-facing prose. Storage and pull-serving stay permitted (Rule E);
      # this constrains prompts only. See CC-CMD-2026-08-20-brief-data-quality
      # ask 1.
      - name: No raw drama number in generated prose
        run: node scripts/check-no-drama-number-in-prompts.mjs

      # ask 2: brief_type must be gated on finality and single-sourced. A fifth
      # write site pasting the 'game_recap' literal back in, or the enqueue
      # dropping isFinal, both silently restore the pre-fix behaviour.
      - name: game_recap gated on finality
        run: node scripts/check-game-recap-classification.mjs

      # ask 3: briefs.sport must carry the declared label verbatim. A lowercased
      # column value is unreachable by every sport-filtered read while still
      # looking correct in the row's id. Second occurrence of this bug class.
      - name: briefs.sport carries declared labels
        run: node scripts/check-brief-sport-label.mjs

      # CC-CMD-2026-08-21-closing-odds-capture: the odds backfill wrote
      # closing_odds for games that had not kicked off yet, which made
      # AmbientDO._captureClosingOdds's `WHERE closing_odds IS NULL` false
      # forever. The only visible symptom was in another repo — the laboratory's
      # OddsStory.Moved branch, shipped since June, had never been reachable.
      - name: closing_odds is not pre-filled for unplayed games
        run: node scripts/check-closing-odds-not-prefilled.mjs

      # The odds join keys on resolveTeamKey(home)|resolveTeamKey(away). A
      # missing alias is a miss (NULL odds); a COLLISION attaches one club's
      # line to another club's game and looks plausible on the card. Real Betis
      # and Real Sociedad played each other on 2026-08-21 — a "strip leading
      # Real" rule would have had a live chance to swap them that day.
      - name: team identity — no two clubs share a key
        run: node scripts/check-team-identity-collisions.mjs

      # Layer 2f: a brief must never quote a number that exists only as an
      # example in the style rules. Two live EPL briefs did on 2026-08-22.
      - name: prompt-example numbers cannot leak into prose
        run: node scripts/check-prompt-example-leak.mjs

      # The sport-key table is indexed by two shapes of each name, spaced and
      # collapsed, because D1 display names and ESPN slugs disagree about
      # whitespace. The lookup stripped whitespace before indexing, so every
      # multi-word entry was unreachable and a game whose sport read "Major
      # League Baseball" resolved to no ESPN slug -- returning '' with no
      # error, indistinguishable from "ESPN had no leaders yet".
      - name: sport-key normalization reaches both key shapes
        run: node scripts/sport-key-check.mjs

      # ask 5: recaps ground in ESPN scoring plays. Two failure modes are
      # silent rather than loud. (a) The selection rule degrading to "return
      # everything" blows the declared budget, and the assembler SKIPS an
      # over-budget block -- so an unusable wall of 112 plays presents as a
      # brief with no events at all. (b) A block that prints running scores
      # invites the generator to report the score as of the 8th-from-last
      # play as final, which is how a live EPL brief invented "a 2-1 result".
      - name: scoring-play selection stays in budget and states its truncation
        run: node scripts/match-events-check.mjs

      # The other half of ask 5, and the half that was actually broken.
      # `match_events` shipped registered, budgeted and tested (644d7f6) and
      # reached ZERO recaps: assembleContext is called from four places --
      # two backfills, the journalism-cron SLATE brief, and an import -- and
      # none of them is the live per-game recap path. Four hours later check 4
      # of verify-staged-items.mjs said so on its first live run, "0/3 recap(s)
      # name anyone who scored", with ESPN carrying 3-4 scoring plays for each
      # of the three games. That check is the right long-term detector but can
      # only speak once a slate has finalised; this one speaks at deploy time,
      # when the wiring is being changed. --self-test cuts each link and
      # requires the corresponding check to go red -- it caught one of the five
      # matching the function DECLARATION instead of the call site.
      - name: the live recap path assembles context
        run: node scripts/check-recap-assembles-context.mjs --self-test && node scripts/check-recap-assembles-context.mjs

      # The Courier writes a named Actions secret into a named repo, OIDC in,
      # sealed-box out, so the value passes through the runner and lands in no
      # file. RELAY_SHARED_SECRET's sync step exits 1 until that secret exists
      # here, and the tempting one-line fix for a red step is to paste the value
      # where the variable goes -- putting the credential back into a committed
      # workflow, days after field-laboratory's check:secrets failed for exactly
      # that. Deleting the step is the other way to make it green, and that
      # blinds check:sport-vocabulary there permanently. Both are caught.
      - name: Courier secret syncs carry variables, not values
        run: node scripts/check-courier-sync-uses-secrets.mjs --self-test && node scripts/check-courier-sync-uses-secrets.mjs

      # The stale-data sentinel asked two questions -- does the key exist, is it
      # recent -- and never whether the file contained anything. On 2026-06-22
      # FBref started 403ing GH runner IPs; the workflow parsed 0 squads, wrote
      # {"teams": {}} to R2, uploaded fine and exited 0. /health/sources read
      # `soccer_fbref_wc | ok | stale: False` for two weeks while every soccer
      # prompt assembled empty context. `entries` was already being computed and
      # read by nothing. The empty-but-fresh case is the negative control here.
      - name: a fresh but empty source is stale
        run: node scripts/sentinel-content-check.mjs

      # SCORING_ERAS' own header says to add an entry BEFORE deploying any
      # scoreProse change that moves scores. Nothing enforced it, and the one
      # time it was skipped (6aed3bb, 2026-07-16) the mlb_game mean fell
      # 203.2 -> 135.4 and two calibration rechecks burned themselves out asking
      # whether the quality trend was real. Rescoring under one rubric later put
      # the true difference at 0.9 points -- the entire 68-point collapse was the
      # instrument. This makes the rule mechanical: change SCALE without
      # recording an era and the deploy stops.
      - name: a SCALE change is recorded as a scoring era
        run: node scripts/check-scoring-era-recorded.mjs

      # Five of SCALE's ten entries were read by nothing. `grep -n "SCALE\."
      # src/journalism-quality.js` returns one hit -- the W in `base`, which
      # covers dims 1-5 only. Dims 6-10 are summed RAW with their ceilings as
      # literals inside their own computations, and the two had drifted apart in
      # both directions (arc 55 vs 45, ctx 32 vs 25, temporal 25 vs 20, voice 20
      # vs 30, matchup 24 vs 30). Era 4 reweighted exactly those five, so five of
      # its six changes were inert; only `density 16->10` landed, density being a
      # dim 1-5. This reads each ceiling out of the expression that produces it,
      # so a declared weight and its implementation cannot disagree again.
      - name: declared weights equal implementation ceilings
        run: node scripts/check-scale-matches-implementation.mjs --self-test && node scripts/check-scale-matches-implementation.mjs

      # Dim 11 candidate, STAGED: consumed by rescore-quality-6b.mjs, not yet by
      # scoreProse. It scores prose-vs-fact AGREEMENT, so a correctly hedged
      # brief on a live game gets full marks -- which is why the LIVE_LANG
      # prose-only split cannot measure it and the 2x2 exists. All four corners
      # are asserted as input/output pairs, plus both abstain cases, plus a
      # control that the same prose scores differently against different facts.
      - name: finality agreement scores the 2x2, not the prose
        run: node scripts/finality-agreement-check.mjs

      # Dim 10 after era 6. It used to count how many matchupNote words came
      # back out of the prose -- an echo test the prompt itself supplied the
      # answer to, on a column populated for 0.54% of finalized non-golf games.
      # Margin agreement reads a relation between two numbers instead. The
      # threshold cases are the load-bearing ones: neither margin nor ratio
      # works alone across these sports, and the first version called MLB 5-3
      # lopsided because 3/5 is exactly 0.6.
      - name: margin agreement is sport-free and cannot be satisfied by copying
        run: node scripts/margin-agreement-check.mjs

      # The generalizable half of era 6, and the gap that era flagged in its own
      # commit message. The rename SCALE.matchup -> SCALE.margin left two
      # constants filtering on a string that no longer named anything, so both
      # filters matched NOTHING and the reachable ceilings rose 245->277 and
      # 270->294 in silence. Weight-preserving, so the era fingerprint could not
      # see it; no diff on those lines, so review could not either. This asserts
      # every name in those lists resolves to a live SCALE key, and that each
      # cap equals what the dimension actually produces with the fact missing.
      - name: slate caps resolve against SCALE and are derived, not declared twice
        run: node scripts/check-slate-caps-are-derived.mjs --self-test && node scripts/check-slate-caps-are-derived.mjs

      # A caller says something and the callee stopped listening. On 2026-07-16
      # commit 6aed3bb deleted `const THRESHOLD = opts.scoreThreshold || 240`
      # -- correctly, the composite it gated scored this repo's own labeled
      # anti-exemplar 214 and its real exemplar 136 -- and left TEN call sites
      # passing scoreThreshold into a chain that no longer read it. Measured:
      # a floor of 999 accepted a score of 126 with zero retries. It survived 39
      # days, and the queue item that found it proposed changing 110 to 196.
      - name: every key passed in an options literal is read by its callee
        run: node scripts/check-opts-keys-are-read.mjs --self-test && node scripts/check-opts-keys-are-read.mjs

      # briefs_counted: 0 beside cleared_196: 66, published twice, both with
      # all_passed: true. `n: x.n ?? x.count ?? null` guessed at two field names
      # /quality/report has never served, `Number(null) || 0` made the miss
      # arithmetic, and a sum over 48 erased unknowns is indistinguishable from a
      # real zero. The replay half feeds both published artifacts through the
      # invariants and requires them to go red, so "this would have caught it"
      # stays a demonstrated fact rather than a claim about code nobody ran.
      - name: no aggregate launders an unknown into a number
        run: node scripts/check-aggregate-launders-unknowns.mjs --self-test && node scripts/check-aggregate-launders-unknowns.mjs

      # THE REGISTRY THE SIX GUARDS ABOVE WERE EACH WRITTEN INSTEAD OF. Every one
      # of them was authored after an incident and covers exactly one edge, and
      # the pattern under all of them is the same: something names something
      # else, the something else moves, nothing connects the two.
      #
      # SCALE.matchup -> SCALE.margin is the case study. One weight-preserving
      # rename, invisible to the era fingerprint, no diff on the lines it broke,
      # and it took out UNREACHABLE_DIMS (ceilings moved 245->277 and 270->294),
      # DIM_TO_SCALE (a 244-point rubric reported as 294) and three candidate
      # tables — found on three separate days by three separate investigations.
      #
      # Run against the real pre-fix source, committed as a fixture, the graph
      # reports all three at once. Adding a dependency is now adding an edge.
      - name: every name in the graph resolves to a name that exists
        run: node scripts/check-name-graph.mjs --self-test && node scripts/check-name-graph.mjs

      # A rule that teaches by printing the broken sentence is its own attack
      # surface. The measured leak — an EPL brief reading "Spurs' 3 shots this
      # match trail Brentford's 37 goals this season" — is VERBATIM the
      # counter-example inside ONE WINDOW PER COMPARISON, the rule shipped to
      # stop cross-window comparisons. Real clubs plus a real-looking figure made
      # the copy read as plausible EPL prose instead of obvious garbage.
      - name: no forbidden example is copyable prose
        run: node scripts/check-negative-examples-are-not-instantiable.mjs --self-test && node scripts/check-negative-examples-are-not-instantiable.mjs

      # THE ANSWER TO "WHY DOES EVERY BRIEF KEEP GETTING CONTAMINATED". Sport
      # content here is universal BY DEFAULT and scoped BY EXCEPTION, so every
      # addition reaches every sport until somebody remembers to gate it — and
      # forgetting is silent. One check over every source, so a new context
      # source is covered the day it is added rather than after its incident.
      - name: no sport's prompt names another sport's league
        run: node scripts/check-no-foreign-league-in-prompt.mjs --self-test && node scripts/check-no-foreign-league-in-prompt.mjs

      # Association football prices THREE outcomes and extractOddsForGame matched
      # two, so the draw was never asked for and every soccer card downstream
      # rendered "three-way market; no draw price served". The rule identifies the
      # draw by POSITION, not by the string "Draw" — a renamed selection would
      # otherwise drop the price again, which is the defect class that emptied
      # UNREACHABLE_DIMS the same day.
      - name: soccer h2h yields a draw, and no other market gains one
        run: node scripts/three-way-odds-check.mjs

      # The archive catch-up walks an ESPN scoreboard per LEAGUES row and derives
      # two sides with `teams.find(homeAway === 'home') || teams[0]`. That
      # fallback exists for neutral-site fixtures where ESPN omits `homeAway`,
      # and cannot tell a neutral site from a leaderboard: on the one golf row in
      # that table it returned the first two PLAYERS, whose `.team` is undefined,
      # and archived `sport='PGA Tour' home=null away=null home_score=away_score=-6`
      # -- the BMW Championship's round-one leaders presented as a tie between
      # sides that do not exist, duplicating a correct `sport='golf'` row for the
      # same ESPN event. PGA Tour is a LEAGUE within golf.
      #
      # The check is a three-link chain because the realistic failure is a
      # half-applied fix: flag on the table, gate in the loop, and nothing
      # carrying the value between them reads `undefined` and passes everything.
      # Each link is mutated independently in the self-test.
      - name: no individual-competitor event reaches the archive catch-up
        run: node scripts/check-individual-sports-not-archived.mjs --self-test && node scripts/check-individual-sports-not-archived.mjs

      # A ratchet, not a ban, and the difference is why it can be green today.
      # Two credentials have been hard-coded here. The Odds API key is removed
      # and its count is 0 -- it may never come back. The shared secret is
      # load-bearing: 114 occurrences across 70 files, including the auth
      # comparison that gates POST /d1/execute, and removing the literals before
      # ROTATING the value buys nothing (it is in git history either way) while
      # risking an auth check that compares a header against `undefined`.
      #
      # A check demanding 0 for both would be red from the moment it shipped,
      # and a red check nobody can make green is a check that gets deleted.
      - name: no known-exposed credential appears more often than declared
        run: node scripts/check-exposed-secrets.mjs --self-test && node scripts/check-exposed-secrets.mjs

      # Line numbers rot. Six citations were published into CC-CMDs on the
      # morning of 2026-08-25 and five were wrong by the afternoon -- because
      # the same session then edited the file it had cited, and an insertion
      # above a line moves every line below it. A stale citation is worse than
      # none: it points confidently at unrelated code and the reader trusts it
      # because it is specific.
      #
      # The fix is a better IDENTITY, not a better number. A document that
      # quotes a distinctive fragment beside its citation can be checked, and
      # the fragment finds the current line by itself. That convention also
      # cannot be satisfied from memory -- which is the real defect, since every
      # wrong figure published that day came from recall rather than a probe.
      - name: doc citations are anchored, not just numbered
        run: node scripts/check-doc-citations.mjs --self-test && node scripts/check-doc-citations.mjs

      # CLAUDE.md's session protocol opens with "Read HANDOFF.md first". On
      # 2026-08-25 that document had zero mentions of the date after ten
      # substantive commits -- a deleted workflow, three new deploy gates, a
      # credential removal -- so a session following the protocol exactly would
      # have seen none of it. Nothing noticed, because a document going stale
      # produces no error.
      #
      # Measured in DAYS, not commits. A count bar low enough to catch a day of
      # unwritten work fires partway through a busy session, and a check that
      # goes red on normal work gets deleted. One day of grace: a session's own
      # same-day commits never trip it; work still unrecorded tomorrow does.
      - name: HANDOFF still describes this repository
        run: node scripts/check-handoff-current.mjs --self-test && node scripts/check-handoff-current.mjs

      # `.github/workflows/update-odds-key.yml`, deleted 2026-08-25, was named
      # "Set ODDS_API_KEY to 20K plan key" and piped the EXHAUSTED free-tier key
      # into `wrangler secret put`. One dispatch would have replaced the working
      # production key with a dead one and printed a green checkmark.
      #
      # The tempting rule -- a step's name must match what it does -- was
      # measured before being written: over 828 steps in three repos it produced
      # 73 hits, essentially all section labels and subject nouns. That
      # signal-to-noise gets a check deleted, so this checks the MECHANISM
      # instead. A command installing a secret must take its value from a
      # variable or a secrets.* expression, never a quoted literal. No judgement
      # in it: a literal cannot be rotated, cannot be audited, and is in git
      # history the moment it is written.
      - name: no workflow installs a credential from a literal
        run: node scripts/check-no-literal-secret-writes.mjs --self-test && node scripts/check-no-literal-secret-writes.mjs

      # Ported from field-laboratory 2026-08-23, both halves of one idea: a
      # claim that nothing checks, and a check that has never been shown to
      # fail, are the same defect wearing different clothes.
      #
      # 55 files in this repo contain the word STAGED. Four things checked
      # anything, and not one of them had ever been demonstrated to fail --
      # they ran daily, printed PASS or PENDING, and nothing established that a
      # real regression would make them say otherwise.
      #
      # The scanner found a live orphan on its first run:
      # cc-session-2026-07-20-game-thread-relay.md had read "STAGED -- fires at
      # next :30 mark post-deploy" for 34 days, during which that cron fired
      # roughly 816 times unobserved. It is check 5 now.
      - name: every staged verdict can fail, and can pass
        run: node scripts/staged-verdicts-check.mjs

      - name: a staged claim names a verifier that exists and runs
        run: node scripts/staged-verifier-check.mjs --self-test && node scripts/staged-verifier-check.mjs

      # Four guards written earlier today ran nowhere. A guard nobody runs
      # catches nothing -- it only records that someone once knew the rule.
      # Each of these covers a defect that reached a live brief.

      # Layer 2h: the seven words CLAUDE.md bans outright. A live brief said
      # "stunned" because hasCliche was imported at index.js:70 and never
      # called, and the relay's own BANNED_PHRASES carried none of the seven.
      - name: banned journalism phrases are rejected
        run: node scripts/banned-phrase-check.mjs

      # Layer 2g: "their best stretch in 12 games" next to "over the last 20"
      # is a comparison across two windows the source data never compared.
      - name: cross-window comparisons are detected
        run: node scripts/cross-window-check.mjs

      # Sport scoping: an NBA analytics citation rule reaching an EPL prompt
      # is how a soccer brief ends up citing a champion's field-goal rate.
      - name: prose style rules stay in their sport
        run: node scripts/prose-style-scope-check.mjs

      # Voice exemplars leak their own figures into prose (layer 2f). Scoping
      # them by sport must not defeat that detector -- this checks both.
      - name: voice register exemplars stay in their sport
        run: node scripts/voice-register-scope-check.mjs

      - name: Deploy to Cloudflare Workers
        id: wrangler_deploy
        continue-on-error: true  # wrangler exits 1 on secret-PUT errors even when code deploys
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          secrets: |
            KALI_AFL_TOKEN
            SPORTRADAR_UFL_KEY
            REALTIMESPORTS_KEY
            VAPID_PUBLIC_KEY
            VAPID_PRIVATE_KEY
            FIELD_MCP_SECRET
            FIELD_MCP_CONNECTOR_TOKEN
            GITHUB_PAT
            BSD_API_TOKEN
            DATAIMPULSE_USER
            DATAIMPULSE_PASS
        env:
          KALI_AFL_TOKEN: ${{ secrets.KALI_AFL_TOKEN }}
          SPORTRADAR_UFL_KEY: ${{ secrets.SPORTRADAR_UFL_KEY }}
          REALTIMESPORTS_KEY: ${{ secrets.REALTIMESPORTS_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FIELD_MCP_SECRET: ${{ secrets.FIELD_MCP_SECRET }}
          FIELD_MCP_CONNECTOR_TOKEN: ${{ secrets.FIELD_MCP_CONNECTOR_TOKEN }}
          GITHUB_PAT: ${{ secrets.RELAY_GH_PAT }}
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
          DATAIMPULSE_USER: ${{ secrets.DATAIMPULSE_USER }}
          DATAIMPULSE_PASS: ${{ secrets.DATAIMPULSE_PASS }}

      # Hard gate: even with continue-on-error above, the code MUST be live.
      # This catches genuine deploy failures (bad bundle, auth revoked) vs
      # wrangler post-deploy secret-PUT errors (code live but wrangler exits 1).
      #
      # SILENT BUILD FAILURE GUARD (added 2026-06-26):
      # wrangler exits 1 for BOTH esbuild errors AND secret-PUT failures.
      # continue-on-error swallows both. Old bundle responds fine → health
      # check passes → silent failure goes undetected (seen 3× in 2 days).
      # Fix: if wrangler_deploy failed, fetch deployed bundle from CF API and
      # grep for a known route. If absent → build failed, not secret-PUT.
      - name: Deploy gate — confirm relay is live + catch silent build failures
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev"
          ACCOUNT="b57e9af57ab46c52ca9215804e689c29"
          WRANGLER_OUTCOME="${{ steps.wrangler_deploy.outcome }}"

          # Step 1: health check (existing — catches total outages)
          for attempt in 1 2 3 4 5; do
            BODY=$(curl -s --max-time 10 "$RELAY/health" 2>/dev/null)
            echo "Attempt $attempt — $BODY"
            echo "$BODY" | grep -q "RELAY OK" && break
            [ $attempt -lt 5 ] && { echo "⏳ Retrying in 8s..."; sleep 8; }
            [ $attempt -eq 5 ] && { echo "❌ Relay not responding — genuine failure"; exit 1; }
          done
          echo "✅ Relay is live"

          # Step 2: bundle content check (NEW — only runs when wrangler reported failure)
          # Distinguishes esbuild errors (old bundle stays) from acceptable secret-PUT
          # errors (new bundle IS deployed, only secret update failed).
          if [ "$WRANGLER_OUTCOME" = "failure" ]; then
            echo "⚠️  wrangler_deploy outcome=failure — verifying bundle content..."
            BUNDLE=$(curl -sf --max-time 30               -H "Authorization: Bearer $CF_TOKEN"               "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT/workers/scripts/field-relay-nba"               2>/dev/null | head -c 3000000 || echo '')
            # Sentinel: permanent route present in every bundle from 2026-06-26 onward.
            # If absent, esbuild rejected new code and old bundle is still deployed.
            if echo "$BUNDLE" | grep -qF '/bsd/r2/read'; then
              echo "✅ Bundle verified — wrangler failure was secret-PUT only, new code is live"
            else
              echo "❌ SILENT BUILD FAILURE: sentinel '/bsd/r2/read' missing from deployed bundle"
              echo "   esbuild likely rejected new code (const reassignment, syntax error, etc.)"
              echo "   Old bundle is still active. Fix build error and re-push."
              exit 1
            fi
          fi

      - name: Post-deploy — refresh WC bracket projections
        continue-on-error: true
        run: |
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -X POST "$RELAY/wc/bracket/refresh" \
            -H "User-Agent: FIELD-CI/1.0")
          echo "Bracket refresh: HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ BracketDO recomputed with latest code" \
            || echo "⚠️ Bracket refresh returned $STATUS — projections may be stale until next game final"

      - name: Deploy Courier Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers/field-deploy

      - name: Deploy Claude Proxy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers/field-claude-proxy

      # ── Sync CF AI Gateway secrets onto field-claude-proxy (idempotent) ──
      # CF_AI_GATEWAY_BASE — gateway URL (not secret per se, but treated same)
      # CF_AIG_TOKEN       — Authenticated Gateway token (cfut_... — IS secret)
      #
      # These are set via the CF API directly (api.cloudflare.com from CI runner
      # has unrestricted access). Worker secrets persist across deploys, so this
      # step is idempotent — re-running keeps the same values. To rotate the
      # token: update the GitHub Actions secret CF_AIG_TOKEN, push any change,
      # this step re-syncs on next deploy.
      #
      # Sequencing: this runs AFTER wrangler-action so the worker exists before
      # we try to set its secrets. Failure here does not block STRUCTURAL 6 — if
      # secrets are missing or stale, the proxy gracefully falls back to direct
      # routing (CF_AI_GATEWAY_BASE unset) or unauthenticated gateway (CF_AIG_TOKEN
      # unset, gateway auth ON → 401 → fallback in caller).
      - name: Sync AI Gateway secrets to field-claude-proxy
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
        run: |
          if [ -z "$CF_AIG_TOKEN" ]; then
            echo "⏭️  CF_AIG_TOKEN secret not set, skipping AI Gateway sync"
            exit 0
          fi
          ACCT="b57e9af57ab46c52ca9215804e689c29"
          WORKER="field-claude-proxy"
          BASE_URL="https://gateway.ai.cloudflare.com/v1/${ACCT}/field-journalism"
          API="https://api.cloudflare.com/client/v4/accounts/${ACCT}/workers/scripts/${WORKER}/secrets"

          set_secret() {
            local NAME="$1"; local VAL="$2"
            STATUS=$(curl -s -o /tmp/cfsec.json -w "%{http_code}" -X PUT "$API" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"name\":\"$NAME\",\"text\":\"$VAL\",\"type\":\"secret_text\"}")
            if [ "$STATUS" = "200" ]; then
              echo "✅ $NAME synced (HTTP $STATUS)"
            else
              echo "❌ $NAME failed (HTTP $STATUS):"
              cat /tmp/cfsec.json | head -c 300
              echo ""
            fi
          }

          set_secret "CF_AI_GATEWAY_BASE" "$BASE_URL"
          set_secret "CF_AIG_TOKEN" "$CF_AIG_TOKEN"

      - name: Wait for propagation
        run: sleep 15

      # ══════════════════════════════════════════════════════════════
      # STRUCTURAL CHECKS — test OUR relay code only, no upstream APIs
      # These are the only checks that can fail the workflow.
      # They verify worker logic (routing, whitelisting, headers) without
      # depending on NBA CDN, FPL, or FD being reachable during CI.
      # ══════════════════════════════════════════════════════════════

      - name: STRUCTURAL 8 — /archive/debrief-backfill endpoint shape probe
        # Probes the Gap 10 debrief reconstruction endpoint from the CI runner
        # (no sandbox egress limitation). Asserts HTTP 200 + ok:true + correct
        # response shape. Uses 2026-05-20 (NBA Conference Finals era, pre-Phase-3a
        # drama_peak write path) — expects either gameCount>0 with drama_peak_tracked
        # booleans, or gameCount:0 (no data for date — endpoint still structurally OK).
        # drama_peak_tracked:false is the honest "Not tracked" signal for historical games.
        continue-on-error: false
        run: |
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev"
          STATUS=$(curl -s -o /tmp/dbf.json -w "%{http_code}" --max-time 30 \
            "$RELAY/archive/debrief-backfill?date=2026-05-20")
          echo "Status: $STATUS"
          cat /tmp/dbf.json | head -c 500
          [ "$STATUS" = "200" ] || { echo "❌ Expected HTTP 200, got $STATUS"; exit 1; }
          python3 << 'PYEOF'
          import json, sys
          d = json.load(open('/tmp/dbf.json'))
          if not d.get('ok'):
              print(f"❌ Response ok=false: {d.get('error','unknown')}")
              sys.exit(1)
          gc = d.get('gameCount', 0)
          results = d.get('results', [])
          if gc == 0:
              print(f"✅ STRUCTURAL 8 OK — endpoint live, no games on 2026-05-20 (acceptable for this date)")
              sys.exit(0)
          errors = []
          for r in results:
              if r.get('skipped'):
                  continue
              if 'drama_peak_tracked' not in r:
                  errors.append(f"game {r.get('game_id')}: drama_peak_tracked field missing")
              elif not isinstance(r['drama_peak_tracked'], bool):
                  errors.append(f"game {r.get('game_id')}: drama_peak_tracked must be bool, got {type(r['drama_peak_tracked']).__name__}")
          if errors:
              print(f"❌ STRUCTURAL 8 shape assertion failed:")
              for e in errors: print(f"  - {e}")
              sys.exit(1)
          tracked = sum(1 for r in results if not r.get('skipped') and r.get('drama_peak_tracked'))
          untracked = sum(1 for r in results if not r.get('skipped') and not r.get('drama_peak_tracked'))
          print(f"✅ STRUCTURAL 8 OK — {gc} game(s), drama_peak_tracked={tracked} untracked={untracked}")
          PYEOF

      - name: STRUCTURAL 1 — Health (with retry)
        run: |
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev"
          for attempt in 1 2 3; do
            BODY=$(curl -s --max-time 10 "$RELAY/health")
            echo "Attempt $attempt — Health: $BODY"
            echo "$BODY" | grep -q "RELAY OK" && echo "$BODY" | grep -q "nba" && \
              echo "$BODY" | grep -q "nhl" && echo "$BODY" | grep -q "fpl" && \
              echo "$BODY" | grep -q "fd" && echo "$BODY" | grep -q "squiggle" && \
              { echo "✅ Health OK"; exit 0; }
            [ $attempt -lt 3 ] && { echo "⏳ Retrying in 5s..."; sleep 5; }
          done
          echo "❌ Health check failed after 3 attempts"
          exit 1

      - name: STRUCTURAL 2 — NBA whitelist enforcement
        run: |
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RELAY/nba/liveData/INVALID.json")
          echo "NBA whitelist block: $STATUS"
          [ "$STATUS" = "403" ] || { echo "❌ Expected 403, got $STATUS"; exit 1; }
          echo "✅ NBA whitelist OK"

      - name: STRUCTURAL 2b — NHL whitelist enforcement
        run: |
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RELAY/nhl/v1/player/8471214/game-log/20242025/2")
          echo "NHL whitelist block: $STATUS"
          [ "$STATUS" = "403" ] || { echo "❌ Expected 403, got $STATUS"; exit 1; }
          echo "✅ NHL whitelist OK"

      - name: STRUCTURAL 3 — FPL whitelist enforcement
        run: |
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RELAY/fpl/entry/12345/history")
          echo "FPL whitelist block: $STATUS"
          [ "$STATUS" = "403" ] || { echo "❌ Expected 403, got $STATUS"; exit 1; }
          echo "✅ FPL whitelist OK"

      - name: STRUCTURAL 4 — FD whitelist enforcement
        run: |
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RELAY/fd/persons/12345")
          echo "FD whitelist block: $STATUS"
          [ "$STATUS" = "403" ] || { echo "❌ Expected 403, got $STATUS"; exit 1; }
          echo "✅ FD whitelist OK"

      - name: STRUCTURAL 5 — CORS headers on health endpoint
        run: |
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev"
          CORS=$(curl -sI "$RELAY/health" | grep -i "access-control-allow-origin" | tr -d '\r')
          echo "CORS header: $CORS"
          echo "$CORS" | grep -q "\*" || { echo "❌ CORS header missing or wrong"; exit 1; }
          echo "✅ CORS OK"

      # ══════════════════════════════════════════════════════════════
      # STRUCTURAL 6 — WOW 6 Journalism Quality Gate end-to-end probe
      # ══════════════════════════════════════════════════════════════
      # Added 2026-05-31 PM after discovering the May 30 deploy shipped a
      # broken X-FIELD-Relay value (field-relay-jq-2026 → 403 from proxy)
      # that silently broke EVERY browser-triggered live brief for ~24 hours.
      # The bug slipped through because no deploy-time check actually
      # exercised the journalism/generate path end-to-end.
      #
      # This check POSTs a minimal prompt and asserts the full response
      # shape: HTTP 200 + text present + score numeric + layers_fired array.
      # Cost per deploy: ~1 Anthropic API call (~$0.001). Worth it for
      # patent-critical path integrity.
      #
      # Failure modes this catches:
      #   - X-FIELD-Relay value not in proxy whitelist → HTTP_403 in diagnostic
      #   - CORS preflight breaks → 405 method not allowed
      #   - Quality chain throws → empty text
      #   - scoreProse + runQualityChain regression → missing score field
      #   - Layer routing breaks → empty layers_fired
      - name: STRUCTURAL 6 — WOW 6 /journalism/generate e2e
        run: |
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev"
          BODY='{"prompt":"Write one sentence about a baseball game.","sport":"baseball","briefType":"mlb-brief","max_tokens":100}'
          STATUS=$(curl -s -o /tmp/wow6_body.json -w "%{http_code}" --max-time 20 \
            -X POST "$RELAY/journalism/generate" \
            -H "Content-Type: application/json" \
            -H "Origin: https://jubilant-bassoon.jeffunglesbee.workers.dev" \
            -d "$BODY")
          echo "Status: $STATUS"
          echo "Body (first 500): $(head -c 500 /tmp/wow6_body.json)"
          [ "$STATUS" = "200" ] || { echo "❌ Expected HTTP 200, got $STATUS"; exit 1; }
          python3 << 'PYEOF'
          import json, sys
          d = json.load(open('/tmp/wow6_body.json'))
          errors = []
          if d.get('status') != 'ok':
              errors.append(f"status field expected 'ok', got: {d.get('status')}")
          text = d.get('text', '') or ''
          if len(text) < 20:
              errors.append(f"text field missing or too short (len={len(text)})")
          score = d.get('score')
          if not isinstance(score, (int, float)):
              errors.append(f"score field missing or non-numeric: {score}")
          elif score < 50:
              errors.append(f"score suspiciously low: {score}")
          layers = d.get('layers_fired')
          if not isinstance(layers, list):
              errors.append(f"layers_fired must be array, got: {type(layers).__name__}")
          ms = d.get('ms')
          if not isinstance(ms, (int, float)) or ms <= 0:
              errors.append(f"ms field missing or invalid: {ms}")
          if errors:
              print('❌ WOW 6 e2e shape assertions failed:')
              for e in errors: print(f'  - {e}')
              if d.get('proxy_diagnostic'):
                  print(f'  proxy_diagnostic: {d["proxy_diagnostic"]}')
              sys.exit(1)
          print(f'✅ WOW 6 e2e OK — text={len(text)} chars, score={score}, layers={layers}, ms={ms}')
          PYEOF

      # ══════════════════════════════════════════════════════════════
      # STRUCTURAL 7 — V2 adapter streams field presence/shape probe
      # ══════════════════════════════════════════════════════════════
      # Added 2026-07-16 (CC-CMD-2026-07-16-deploy-streams-probe, explicit
      # user authorization for this CI/CD change) after
      # CC-CMD-2026-07-16-broadcast-chip-durable-fix (277fdc7) threaded
      # ESPN's real broadcasts/geoBroadcasts into a `streams` field on
      # every V2 adapter's output. No permanent CI check existed for it --
      # a future regression (a refactor dropping the `streams:` line from
      # one adapter, an ESPN field-name change silently breaking
      # buildStreamsFromESPN) would only be caught by someone manually
      # re-running that dispatch's checks.
      #
      # Checks MLB first (near-daily in-season cadence -- the only real
      # gaps are the ~3-4 day All-Star break and the Nov-Feb offseason),
      # falls back to WNBA if MLB has zero games today (same-day fallback,
      # Rule 76 cap respected: 2 levels). Uses the same ET-anchored "today"
      # as getFieldDateKey() (4am ET rolling cutoff) rather than
      # /v2/games' own raw-UTC-midnight default, so this doesn't false-skip
      # near a UTC day boundary while a real evening ET slate is still in
      # progress.
      #
      # Skip (exit 0) is reserved for the ONLY genuine case: zero games at
      # all across both sports (a real off-day). Games existing with NONE
      # of them carrying any streams data is treated as a FAILURE, not a
      # skip -- real ESPN broadcast data (national OR local/regional) is
      # present for essentially every real scheduled game, confirmed via 2
      # real sample games in different markets while building this probe.
      # Collapsing that into "skip" would make this check blind to the
      # exact bug shape it exists to catch (verified locally before
      # committing: a synthetic real-games-no-streams payload correctly
      # fails; a synthetic zero-games payload correctly skips; a synthetic
      # malformed-entry payload correctly fails; real current data
      # correctly passes).
      - name: STRUCTURAL 7 — V2 adapter streams field presence/shape
        run: |
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev"
          ET_HOUR=$(TZ="America/New_York" date +%H)
          if [ "$ET_HOUR" -lt 4 ]; then
            DATE=$(TZ="America/New_York" date -d "yesterday" +%Y-%m-%d)
          else
            DATE=$(TZ="America/New_York" date +%Y-%m-%d)
          fi
          echo "Checking date (ET-anchored): $DATE"
          # CC-CMD-2026-08-08-espn-site-api-403-p0 (detection half): capture the
          # HTTP status, not just the body. Previously both were discarded, and
          # /v2/games answers an ESPN 403 with VALID JSON
          # ({"error":"ESPN upstream 403"}) under HTTP 502 -- so load() parsed it
          # fine, .get('games') was None, and an all-sports upstream outage was
          # reported as "genuine off-day" and exited 0. This gate was the only
          # ESPN-touching check in the whole deploy, which is why a real
          # every-sport outage stayed invisible in green CI.
          MLB_CODE=$(curl -s --max-time 15 -w "%{http_code}" "$RELAY/v2/games?sport=mlb&date=$DATE" -o /tmp/streams_mlb.json)
          WNBA_CODE=$(curl -s --max-time 15 -w "%{http_code}" "$RELAY/v2/games?sport=wnba&date=$DATE" -o /tmp/streams_wnba.json)
          echo "$MLB_CODE"  > /tmp/streams_mlb.code
          echo "$WNBA_CODE" > /tmp/streams_wnba.code
          echo "HTTP: mlb=$MLB_CODE wnba=$WNBA_CODE"
          python3 << 'PYEOF'
          import json, sys

          def load(path):
              try:
                  with open(path) as f:
                      return json.load(f)
              except Exception:
                  return {}

          def code(path):
              try:
                  with open(path) as f:
                      return f.read().strip()
              except Exception:
                  return '000'

          mlb,  mlb_code  = load('/tmp/streams_mlb.json'),  code('/tmp/streams_mlb.code')
          wnba, wnba_code = load('/tmp/streams_wnba.json'), code('/tmp/streams_wnba.code')

          # An upstream/relay ERROR is not an off-day. Fail loudly and separately
          # from both the real-skip path and the streams-shape path below, so the
          # message says which of the three actually happened.
          upstream_errors = []
          for label, payload, status in (('mlb', mlb, mlb_code), ('wnba', wnba, wnba_code)):
              if status != '200':
                  upstream_errors.append(f'{label}: HTTP {status} body={json.dumps(payload)[:200]}')
              elif isinstance(payload, dict) and payload.get('error'):
                  upstream_errors.append(f'{label}: HTTP 200 but error field -> {payload.get("error")!r}')
          if upstream_errors:
              print('❌ STRUCTURAL 7 — /v2/games did not answer cleanly. This is an UPSTREAM/RELAY FAILURE, not a no-games day:')
              for e in upstream_errors:
                  print(f'  - {e}')
              print('  (ESPN 403s to Cloudflare Worker IPs present exactly like this. See')
              print('   docs/CC-CMD-2026-08-08-espn-site-api-403-p0.md.)')
              sys.exit(1)

          # CC-CMD-2026-08-09-wnba-failover-via-kv: partition by SOURCE before
          # asserting anything about streams.
          #
          # The WNBA secondary reads a slate written by a GitHub runner into KV,
          # because wnba.com blocks this relay's Worker egress. The WNBA CDN
          # carries no broadcast data at all, so a KV-sourced slate legitimately
          # has zero streams on every game. Pooling those in with ESPN-sourced
          # games would hard-fail this check on any WNBA-only day while the
          # failover is active -- turning an outage into a red deploy gate.
          #
          # This EXCLUDES known-degraded sources from the streams requirement and
          # says so out loud. It does NOT relax the requirement for ESPN-sourced
          # games: real ESPN games with zero streams remain a hard failure, which
          # is the bug shape this check was written for.
          DEGRADED_SOURCES = {'wnba-kv'}
          degraded_games, live_games = [], []
          for payload in (mlb, wnba):
              src = payload.get('source')
              bucket = degraded_games if src in DEGRADED_SOURCES else live_games
              bucket.extend(payload.get('games') or [])
          if degraded_games:
              print(f'::warning::STRUCTURAL 7 — {len(degraded_games)} game(s) came from a known-degraded source '
                    f'({", ".join(sorted(DEGRADED_SOURCES))}) which carries no broadcast data. Excluded from the '
                    f'streams assertion. The primary is failing over — check why.')

          games = live_games
          if not games and degraded_games:
              print('⏳ Every game today came from a degraded (streamless-by-design) source, so there is')
              print('   nothing this check can assert. Passing WITHOUT verification — not a green light.')
              sys.exit(0)
          if not games:
              print('⏳ No real MLB/WNBA games found for today -- genuine off-day (All-Star break/offseason/rest day). Skipping, not failing.')
              print(f'   (Both sports answered HTTP 200 with no error field -- mlb={mlb_code} wnba={wnba_code} -- so this is a real empty slate, not an outage.)')
              sys.exit(0)

          candidates = [g for g in games if isinstance(g.get('streams'), list) and len(g['streams']) > 0]
          if not candidates:
              print(f'❌ {len(games)} real game(s) found today but NONE carry any streams data -- this is the exact shape of the original bug (streams field missing/empty), not a genuine no-broadcast day.')
              sys.exit(1)

          g = candidates[0]
          streams = g['streams']
          errors = []
          entry = streams[0]
          if not isinstance(entry, dict):
              errors.append(f'streams[0] is not an object: {entry!r}')
          elif not entry.get('label'):
              errors.append(f'streams[0].label missing or empty: {entry!r}')
          if errors:
              print('❌ STRUCTURAL 7 streams shape assertion failed:')
              for e in errors:
                  print(f'  - {e}')
              print(f'  game: {g.get("id")}, streams: {streams!r}')
              sys.exit(1)
          print(f'✅ STRUCTURAL 7 OK -- game {g.get("id")} carries streams[0].label={entry.get("label")!r} ({len(candidates)}/{len(games)} real games had broadcast data)')
          PYEOF

      # ══════════════════════════════════════════════════════════════
      # UPSTREAM PROBES — informational only, never fail the workflow
      # These test that upstream APIs are reachable through the relay.
      # Failures are expected during CI cold starts, rate limiting, or
      # API downtime. They do NOT indicate a relay code problem.
      # ══════════════════════════════════════════════════════════════
      # EXTERNAL SERVICE PROBES — informational, not blocking.
      # These test upstream APIs (NBA CDN, FPL, Football-Data) that
      # can fail for reasons outside FIELD's control. continue-on-error
      # ensures downstream steps (Courier, OIDC, Summary) still run.
      # STRUCTURAL checks above (steps 13-19) remain blocking.

      - name: PROBE A — NBA CDN scoreboard
        continue-on-error: true  # External service — informational, not blocking
        run: |
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev"
          STATUS=$(curl -s -o /tmp/nba_sb.json --max-time 15 -w "%{http_code}" \
            "$RELAY/nba/liveData/scoreboard/todaysScoreboard_00.json")
          echo "NBA scoreboard: $STATUS"
          if [ "$STATUS" = "200" ]; then
            python3 -c "
          import json
          d = json.load(open('/tmp/nba_sb.json'))
          games = d.get('scoreboard', {}).get('games', [])
          print(f'✅ NBA CDN OK — games today: {len(games)}')
          " 2>/dev/null || echo "⚠️ NBA CDN: 200 but unexpected JSON structure"
          else
            echo "⚠️ NBA CDN returned $STATUS — informational (upstream cold/unavailable)"
          fi

      - name: PROBE A2 — NHL scoreboard
        continue-on-error: true
        run: |
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev"
          STATUS=$(curl -s -o /tmp/nhl_sb.json --max-time 15 -w "%{http_code}" \
            "$RELAY/nhl/v1/scoreboard/now")
          echo "NHL scoreboard: $STATUS"
          if [ "$STATUS" = "200" ]; then
            python3 -c "
          import json
          d = json.load(open('/tmp/nhl_sb.json'))
          games = d.get('games', [])
          print(f'✅ NHL API OK — games: {len(games)}')
          if games:
              g = games[0]
              away = g.get('awayTeam',{}).get('abbrev','?')
              home = g.get('homeTeam',{}).get('abbrev','?')
              state = g.get('gameState','?')
              print(f'  Sample: {away} @ {home} [{state}]')
          " 2>/dev/null || echo "⚠️ NHL: 200 but unexpected JSON structure"
          else
            echo "⚠️ NHL returned $STATUS — informational"
          fi

      - name: PROBE B — FPL bootstrap
        continue-on-error: true
        run: |
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev"
          STATUS=$(curl -s -o /tmp/fpl_bs.json --max-time 15 -w "%{http_code}" \
            "$RELAY/fpl/bootstrap-static")
          echo "FPL bootstrap: $STATUS"
          if [ "$STATUS" = "200" ]; then
            python3 -c "
          import json
          d = json.load(open('/tmp/fpl_bs.json'))
          teams = d.get('teams', [])
          events = d.get('events', [])
          cur = next((e for e in events if e.get('is_current')), None)
          print(f'✅ FPL bootstrap OK — {len(teams)} teams, GW: {cur[\"id\"] if cur else \"between GWs\"}')
          " 2>/dev/null || echo "⚠️ FPL bootstrap: 200 but unexpected JSON"
          else
            echo "⚠️ FPL bootstrap returned $STATUS — informational"
          fi

      - name: PROBE C — FPL fixtures
        continue-on-error: true
        run: |
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev"
          # Use current GW from bootstrap (written by PROBE B) instead of hardcoded value
          GW=$(python3 -c "
          import json
          d = json.load(open('/tmp/fpl_bs.json'))
          events = d.get('events', [])
          cur = next((e for e in events if e.get('is_current')), None)
          print(cur['id'] if cur else max(e['id'] for e in events))
          " 2>/dev/null || echo "38")
          STATUS=$(curl -s -o /tmp/fpl_fx.json --max-time 15 -w "%{http_code}" \
            "$RELAY/fpl/fixtures?event=$GW")
          echo "FPL fixtures (GW$GW): $STATUS"
          if [ "$STATUS" = "200" ]; then
            python3 -c "
          import json
          d = json.load(open('/tmp/fpl_fx.json'))
          started = [f for f in d if f.get('started')]
          print(f'✅ FPL fixtures OK — {len(d)} fixtures, {len(started)} started')
          " 2>/dev/null || echo "⚠️ FPL fixtures: 200 but unexpected JSON"
          else
            echo "⚠️ FPL fixtures returned $STATUS — informational"
          fi

      - name: PROBE D — FD batch matches
        continue-on-error: true
        run: |
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev"
          TODAY=$(date +%Y-%m-%d)
          STATUS=$(curl -s -o /tmp/fd_m.json --max-time 15 -w "%{http_code}" \
            "$RELAY/fd/matches?competitions=PL,PD,SA,BL1,FL1&dateFrom=$TODAY&dateTo=$TODAY")
          echo "FD batch matches: $STATUS"
          if [ "$STATUS" = "200" ]; then
            python3 -c "
          import json
          d = json.load(open('/tmp/fd_m.json'))
          matches = d.get('matches', [])
          live = [m for m in matches if m.get('status') in ('IN_PLAY','PAUSED','LIVE')]
          print(f'✅ FD batch OK — {len(matches)} matches, {len(live)} live')
          " 2>/dev/null || echo "⚠️ FD batch: 200 but unexpected JSON"
          else
            echo "⚠️ FD batch returned $STATUS — informational"
          fi

      - name: PROBE E — FD standings
        continue-on-error: true
        run: |
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev"
          STATUS=$(curl -s -o /tmp/fd_st.json --max-time 15 -w "%{http_code}" \
            "$RELAY/fd/competitions/PL/standings?season=2025")
          echo "FD standings: $STATUS"
          if [ "$STATUS" = "200" ]; then
            python3 -c "
          import json
          d = json.load(open('/tmp/fd_st.json'))
          table = d.get('standings', [{}])[0].get('table', [])
          print(f'✅ FD standings OK — {len(table)} teams')
          if table: print(f'  Top: {table[0][\"team\"][\"shortName\"]} {table[0][\"points\"]}pts')
          " 2>/dev/null || echo "⚠️ FD standings: 200 but unexpected JSON"
          else
            echo "⚠️ FD standings returned $STATUS — informational"
          fi

      - name: PROBE F — BSD R2 pitch map (post-match shotmap pipeline)
        continue-on-error: false  # STRUCTURAL: R2 binding + /bsd/r2/read route + data integrity
        run: |
          RELAY="https://field-relay-nba.jeffunglesbee.workers.dev"
          # Fixture: 8346 (Türkiye 2-2 USA, June 26 2026) — permanent R2 capture.
          # Tests: FIELD_DATA R2 binding, /bsd/r2/read route handler, stats.json schema.
          # This is the only FIELD feature requiring visual DOM verification; this probe
          # is the automated equivalent (data layer). Client render is manual-only.
          SHOTS=$(curl -sf --max-time 10 \
            "$RELAY/bsd/r2/read?key=bsd/wc26/8346/stats.json" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('shotmap',[])))" \
            2>/dev/null || echo '0')
          echo "BSD R2 shotmap: $SHOTS shots for fixture 8346"
          if [ "$SHOTS" -gt 0 ] 2>/dev/null; then
            echo "✅ BSD R2 pitch map pipeline healthy"
          else
            echo "❌ BSD R2 pitch map FAILED: 0 shots returned"
            echo "   Check: FIELD_DATA binding, /bsd/r2/read route, bsd/wc26/8346/stats.json key"
            exit 1
          fi

      - name: Summary
        run: |
          echo ""
          echo "══════════════════════════════════════════"
          echo "  RELAY Deploy Complete"
          echo "  field-relay-nba.jeffunglesbee.workers.dev"
          echo ""
          echo "  Structural checks (hard): 8"
          echo "    Health + NBA/NHL/FPL/FD whitelist + CORS + WOW 6 e2e + BSD R2 pitch map"
          echo "  Upstream probes (informational): 6"
          echo "    NBA CDN · NHL API · FPL bootstrap/fixtures · FD matches/standings"
          echo ""
          echo "  Routes: /nba/* /nhl/* /fpl/* /fd/* /bsd/*"
          echo "══════════════════════════════════════════"

      - name: COURIER — Health check
        run: |
          COURIER="https://field-deploy.jeffunglesbee.workers.dev"
          for attempt in 1 2 3; do
            BODY=$(curl -s --max-time 10 "$COURIER/health")
            echo "Attempt $attempt — $BODY"
            echo "$BODY" | grep -q "COURIER OK" && { echo "✅ Courier OK: $BODY"; exit 0; }
            [ $attempt -lt 3 ] && { echo "⏳ Retrying..."; sleep 5; }
          done
          echo "❌ Courier health failed"
          exit 1

      - name: COURIER — Reject invalid PAT
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://field-deploy.jeffunglesbee.workers.dev/secret \
            -H "Authorization: Bearer not-a-real-pat" \
            -H "Content-Type: application/json" \
            -d '{"name":"TEST","value":"test"}')
          echo "Invalid PAT response: $STATUS"
          [ "$STATUS" = "401" ] || { echo "❌ Expected 401, got $STATUS"; exit 1; }
          echo "✅ PAT validation guard OK"

      - name: COURIER — Reject missing auth
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://field-deploy.jeffunglesbee.workers.dev/push \
            -H "Content-Type: application/json" \
            -d '{"file":"test","content":"x","message":"test"}')
          echo "No auth response: $STATUS"
          [ "$STATUS" = "401" ] || { echo "❌ Expected 401, got $STATUS"; exit 1; }
          echo "✅ Auth required guard OK"

      # ══════════════════════════════════════════════════════════════
      # BOOTSTRAP: sync CLOUDFLARE_API_TOKEN to jubilant-bassoon
      # Uses GitHub OIDC — zero credential management.
      # CI generates OIDC token automatically (id-token: write above).
      # Courier v4 verifies it cryptographically against GitHub's JWKS.
      # No FIELD_PAT. No GitHub secrets needed for auth.
      # GITHUB_PAT is a Courier Worker secret (set once via wrangler).
      # ══════════════════════════════════════════════════════════════
      - name: BOOTSTRAP — Get GitHub OIDC token
        id: oidc
        run: |
          TOKEN=$(curl -sH "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=field-deploy" | jq -r .value)
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "✅ OIDC token acquired (expires ~5min, audience=field-deploy)"

      - name: BOOTSTRAP — Sync CLOUDFLARE_API_TOKEN to jubilant-bassoon
        continue-on-error: true
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          RESULT=$(curl -s -X POST https://field-deploy.jeffunglesbee.workers.dev/secret \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"jubilant-bassoon\",\"name\":\"CLOUDFLARE_API_TOKEN\",\"value\":\"$CF_TOKEN\"}")
          echo "Result: $RESULT"
          echo "$RESULT" | grep -q '"ok":true' \
            && echo "✅ CLOUDFLARE_API_TOKEN synced to jubilant-bassoon — deploy-proxy.yml now active" \
            || echo "⚠️  Sync skipped (Courier GITHUB_PAT not set? Run: echo '<PAT>' | wrangler secret put GITHUB_PAT --name field-deploy)"

      - name: BOOTSTRAP — Sync CLOUDFLARE_API_TOKEN to field-playground
        continue-on-error: true
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          RESULT=$(curl -s -X POST https://field-deploy.jeffunglesbee.workers.dev/secret \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"field-playground\",\"name\":\"CLOUDFLARE_API_TOKEN\",\"value\":\"$CF_TOKEN\"}")
          echo "Result: $RESULT"
          echo "$RESULT" | grep -q '"ok":true' \
            && echo "✅ CLOUDFLARE_API_TOKEN synced to field-playground" \
            || { echo "❌ Sync FAILED: $RESULT"; exit 1; }

      # field-laboratory: verified 2026-08-10 to have a complete Fable->JS
      # worker deploy (wrangler.toml + deploy.yml + src/*.fs) and an EMPTY
      # Actions secret list -- so its deploy has been skipping for want of this
      # one value, exactly as CC-CMD-2026-08-10-laboratory-secret-bootstrap says.
      #
      # Fails the step rather than warning, matching field-playground above and
      # deliberately NOT jubilant-bassoon's warn-only shape: a silent failure
      # here recreates precisely the state this fixes -- a deploy that looks
      # configured and is not.
      #
      # Reuses steps.oidc.outputs.token. No second OIDC step, no second job:
      # the job already declares permissions: id-token: write, and the Courier
      # gates on the CALLER's repository claim (field-relay-nba is in
      # ALLOWED_REPOS); the target repo is just a body parameter.
      - name: BOOTSTRAP — Sync CLOUDFLARE_API_TOKEN to field-laboratory
        continue-on-error: true
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          RESULT=$(curl -s -X POST https://field-deploy.jeffunglesbee.workers.dev/secret \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"field-laboratory\",\"name\":\"CLOUDFLARE_API_TOKEN\",\"value\":\"$CF_TOKEN\"}")
          echo "Result: $RESULT"
          echo "$RESULT" | grep -q '"ok":true' \
            && echo "✅ CLOUDFLARE_API_TOKEN synced to field-laboratory" \
            || { echo "❌ Sync FAILED: $RESULT"; exit 1; }

      # field-laboratory's check:sport-vocabulary reads the relay's games tables
      # through POST /d1/execute, which is credentialled. The value was inline in
      # that repo's scripts/sport-vocabulary-check.mjs until 2026-08-23, when its
      # check:secrets matched it against docs/exposed-secrets.sha256 and failed
      # verify. It now reads process.env.RELAY_SHARED_SECRET with no fallback and
      # fails loudly when empty, so the secret has to arrive some other way.
      #
      # This is that way, and it is the pattern already proven three steps above:
      # OIDC in, Courier verifies against GitHub's JWKS, Courier's own GITHUB_PAT
      # writes the sealed secret into the target repo. No credential stored in any
      # workflow, and no literal added to any file -- which is the point, since a
      # literal is what we just removed.
      #
      # ONE MANUAL STEP, ONCE: RELAY_SHARED_SECRET must exist as an Actions secret
      # in THIS repo. There is nothing to read it from otherwise -- the relay's
      # five other workflows carry the value inline rather than as a secret, and
      # copying it in here would recreate the exposure in a new place.
      #
      # Empty is fatal, not skipped. Pushing an empty value would create a secret
      # in field-laboratory that exists and authenticates nothing, and the check
      # there would report a 401 as "the probe failed" -- the silence both repos
      # spent today deleting.
      - name: BOOTSTRAP — Sync RELAY_SHARED_SECRET to field-laboratory
        continue-on-error: true
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RELAY_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
        run: |
          if [ -z "$RELAY_SECRET" ]; then
            echo "❌ RELAY_SHARED_SECRET is not set in this repository."
            echo "   Add it under Settings → Secrets and variables → Actions."
            echo "   Until then field-laboratory's check:sport-vocabulary cannot run,"
            echo "   and it reports that as a failure rather than a skip."
            exit 1
          fi
          RESULT=$(curl -s -X POST https://field-deploy.jeffunglesbee.workers.dev/secret \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"field-laboratory\",\"name\":\"RELAY_SHARED_SECRET\",\"value\":\"$RELAY_SECRET\"}")
          echo "Result: $RESULT"
          echo "$RESULT" | grep -q '"ok":true' \
            && echo "✅ RELAY_SHARED_SECRET synced to field-laboratory" \
            || { echo "❌ Sync FAILED: $RESULT"; exit 1; }


  verify:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # 25 was enough for the confidence gate's `git log -20`. It is not
          # enough for check-handoff-current, which walks back to the commit
          # HANDOFF names: this repo produced 21 commits on 2026-08-25 alone, so
          # 25 is under a day and a one-day-old handoff would fall outside the
          # checkout. That check degrades to a warning when it does, so the
          # depth is what decides whether it can verify anything at all.
          fetch-depth: 200

      - name: /health/sources content readout — entries per source, not just freshness
        run: |
          OUT="outbox/health-sources-${{ github.run_id }}.json"
          mkdir -p outbox
          # force=1 ignores the season window. Without it the three R2 sources
          # that exercise the new body read -- the ONLY sources that do -- are
          # skipped every run until October, and this readout would prove the
          # change works by never running the part that changed.
          curl -sf "https://field-relay-nba.jeffunglesbee.workers.dev/health/sources?force=1" -o "$OUT" || {
            echo "REQUEST FAILED"; exit 1; }
          node -e '
            const d = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            for (const s of d.sources) {
              if (s.skipped) { console.log(`  skip ${s.key} (out of season)`); continue; }
              console.log(`  ${s.stale ? "STALE" : "ok   "} ${s.key} entries=${s.entries ?? "-"} floor=${s.minEntries ?? "-"} empty=${!!s.empty} ${s.reason || ""}`);
            }
            console.log(`\ntotal=${d.total} stale=${d.stale} empty=${d.empty} healthy=${d.healthy} skipped=${d.skipped}`);

            // Asserted, not eyeballed (Rule 89). Two things must hold on any
            // live data. (1) The summary carries `empty` -- if it is undefined
            // the deployed build predates this change and the readout above is
            // describing a sentinel that still only checks freshness.
            if (typeof d.empty !== "number")
              throw new Error("no `empty` count in /health/sources — deployed build is not the one that reads content");
            // (2) No in-season source reports an unreadable count. Real data
            // being stale or genuinely empty is an operations problem and must
            // not block a deploy; a count this code cannot READ is a defect in
            // this code, and does.
            const broken = d.sources.filter(s => s.reason === "entry count unreadable");
            if (broken.length)
              throw new Error("container read failed for: " + broken.map(s => s.key).join(", "));
            // (3) force=1 means nothing may be skipped. A skipped source is one
            // whose entry count was not measured, and the three R2 sources are
            // out of season from March to September -- exactly the window this
            // change shipped in.
            if (d.skipped !== 0)
              throw new Error("force=1 still skipped: " + d.sources.filter(s => s.skipped).map(s => s.key).join(", "));
            // (4) Every source with a declared floor must have produced a real
            // number, or have failed outright with a stated reason. Silence is
            // the failure mode being eliminated.
            const mute = d.sources.filter(s => s.minEntries != null && typeof s.entries !== "number" && s.ok !== false);
            if (mute.length)
              throw new Error("floor declared but no count produced: " + mute.map(s => s.key).join(", "));
          ' "$OUT"

      - name: Live-check endpoints
        run: |
          DATE=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d "yesterday" +%Y-%m-%d)
          OUT="outbox/live-verify-${{ github.run_id }}.md"
          mkdir -p outbox
          {
            echo "# Post-deploy live verification"
            echo "Run: ${{ github.run_id }} · Commit: ${{ github.sha }} · $(date -u)"
            echo
            echo "## /circadian/preview + /circadian/late (today + yesterday)"
            for phase in preview late; do
              for d in "$DATE" "$YESTERDAY"; do
                echo "### $phase / $d"
                curl -sf "https://field-relay-nba.jeffunglesbee.workers.dev/circadian/$phase/$d" || echo "REQUEST FAILED"
                echo
              done
            done
            # /health carries quality-source, relabelled 2026-08-24 when the
            # unread retry floor was deleted: unloaded|analytics-cron|d1-live ->
            # unavailable|absent|fresh|stale. "d1-live" named a live-D1 fallback
            # that no longer exists, and a label outliving its mechanism is the
            # defect that deletion was about. Captured here so the value is an
            # artifact rather than a claim (Rule 89) -- the sandbox 403s
            # *.workers.dev, so CI is the only place this can be read.
            echo "## /health — quality-source must NOT read d1-live"
            curl -sf "https://field-relay-nba.jeffunglesbee.workers.dev/health" \
              | tr ',' '\n' | grep -i "quality-source" || echo "REQUEST FAILED"
            echo
            echo "## Validation checks"
            echo "### bogus phase (expect 400)"
            curl -s -w "\nHTTP:%{http_code}\n" "https://field-relay-nba.jeffunglesbee.workers.dev/circadian/bogus/$DATE"
            echo "### bad date (expect 400)"
            curl -s -w "\nHTTP:%{http_code}\n" "https://field-relay-nba.jeffunglesbee.workers.dev/circadian/preview/not-a-date"
          } > "$OUT"
          cat "$OUT"

      - name: /context/game brief bridge probe -- espn_event_id lookup chain end-to-end
        run: |
          echo "" | base64 -d > /tmp/context_game_brief_probe.py
          python3 /tmp/context_game_brief_probe.py

      - name: bracketDelta end-to-end probe -- espn:760516 gap-7 final verification
        run: |
          echo "" | base64 -d > /tmp/bracket_delta_probe.py
          python3 /tmp/bracket_delta_probe.py

      - name: Check for confidence-gate violations
        run: |
          RECENT_OUTBOX=$(git log -20 --name-only --pretty=format: -- 'outbox/cc-*.md' | grep -v '^$' | sort -u)
          ACKNOWLEDGED=$(grep -v '^#' docs/confidence-gate-acknowledged.txt | grep -v '^\s*$' || true)
          VIOLATION_FOUND=0
          for f in $RECENT_OUTBOX; do
            [ -f "$f" ] || continue
            if echo "$ACKNOWLEDGED" | grep -qxF "$f"; then
              echo "SKIPPED (acknowledged): $f — see docs/confidence-gate-acknowledged.txt for reason"
              continue
            fi
            SCORE=$(sed -n '/^## Confidence Score/,$p' "$f" | grep -oE '[0-9]+/100' | grep -oE '^[0-9]+' | tail -1)
            [ -z "$SCORE" ] && continue
            if [ "$SCORE" -lt 95 ]; then
              SRC_TOUCHED=$(git log -20 --name-only --pretty=format: -- 'src/*.js' | grep -v '^$' | wc -l)
              if [ "$SRC_TOUCHED" -gt 0 ]; then
                echo "CONFIDENCE-GATE VIOLATION: $f reports $SCORE/100 (below 95) alongside real src/ changes in recent history."
                VIOLATION_FOUND=1
              fi
            fi
          done
          if [ "$VIOLATION_FOUND" -eq 1 ]; then
            echo "See output above for details." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "No confidence-gate violations detected in recent outbox history."

      - name: Rule registry check -- no unregistered "## Rule N" (N>=89) in STANDARDS.md or CLAUDE-CODE-PROMPT-RULES.md
        env:
          RELAY_GH_PAT: ${{ secrets.RELAY_GH_PAT }}
        run: |
          echo "" | base64 -d > /tmp/rule_registry_check.py
          python3 /tmp/rule_registry_check.py

      - name: Completion field-list superset check -- every COMPLETION_FIELDS member wired into both /archive/score-by-id and /archive/game
        env:
          RELAY_GH_PAT: ${{ secrets.RELAY_GH_PAT }}
        run: |
          echo "" | base64 -d > /tmp/completion_field_parity_check.py
          python3 /tmp/completion_field_parity_check.py

      - name: Went-to-OT live invariant -- every MLB/WNBA row with finalized_at set also has went_to_ot set
        run: |
          echo "" | base64 -d > /tmp/wenttoot_invariant_check.py
          python3 /tmp/wenttoot_invariant_check.py

      - name: Soccer league label contract check -- every espnLeague-routed sportKey returns its real league name
        env:
          RELAY_GH_PAT: ${{ secrets.RELAY_GH_PAT }}
        run: |
          echo "" | base64 -d > /tmp/soccer_league_label_check.py
          python3 /tmp/soccer_league_label_check.py

      - name: /pl/fixtures route smoke — array shape, required fields present
        run: |
          echo "" | base64 -d > /tmp/pl_fixtures_smoke.py
          python3 /tmp/pl_fixtures_smoke.py

      - name: Phase 13 record-streak-board recompute + newspaper probe
        run: |
          echo "" | base64 -d > /tmp/record_streak_probe.py
          python3 /tmp/record_streak_probe.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # `git add` is atomic across pathspecs and this step runs under
          # `bash -e`, so an unmatched glob returns non-zero and would abort the
          # whole step before the push ever runs. Same defect class really hit
          # in soccer-league-mislabel-scope-probe.yml on 2026-08-06.
          git add outbox/live-verify-*.md || echo "(no live-verify artifact to stage)"
          # The readout is the artifact (Rule 89). Written on the runner and
          # never staged, it dies with the runner -- which is what happened on
          # run 32659418899: the step went green, printed the six entry counts,
          # and committed nothing. An artifact nobody can read afterwards is
          # the same defect as the count that was computed and discarded.
          git add outbox/health-sources-*.json || echo "(no health-sources artifact to stage)"

          if ! git commit -m "chore: post-deploy live verification [skip ci]"; then
            echo "Nothing to commit — no push needed."
            exit 0
          fi

          # CC-CMD-2026-08-06-deploy-verify-commit-push-race: this was a bare
          # `git push`. This repo has many concurrent writers (probe workflows
          # that commit to outbox/, crons, sessions), so any push landing
          # between this job's checkout and its push rejected it, failed this
          # step, failed the `verify` job, and made the whole run report
          # `failure` even though `deploy` and every structural probe had
          # succeeded. Three false alarms in the 2026-08-06 session alone
          # (runs 31112262449, 30781954383).
          #
          # A lost race is expected and must NOT fail the run -- the deploy
          # already succeeded and this commit is only a verification note. A
          # PERMISSION failure is a real defect and must still fail loudly.
          # These are deliberately distinguished instead of being blanket-
          # swallowed with `|| true`, which would trade a noisy false failure
          # for a silent real one.
          PUSH_LOG=/tmp/verify-push.log
          : > "$PUSH_LOG"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main >>"$PUSH_LOG" 2>&1 \
               && git push origin main >>"$PUSH_LOG" 2>&1; then
              echo "Pushed verification note on attempt $i."
              exit 0
            fi
            echo "Attempt $i lost the race or failed; retrying."
            sleep $((i * 5))
          done

          echo "::group::push log"; cat "$PUSH_LOG"; echo "::endgroup::"
          if grep -qiE 'denied|403|permission|forbidden|authentication' "$PUSH_LOG"; then
            echo "::error::Verification-note push failed for a PERMISSION reason, not a race — this is a real defect, not concurrency."
            exit 1
          fi
          echo "::warning::Verification-note push lost every retry to concurrent writes. The deploy itself is unaffected; only the note was not committed."
          exit 0

