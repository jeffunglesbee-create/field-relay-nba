name: BSD Tennis Date Probe

# Can today's tennis be asked for by date rather than only "what is live now"?
# /bsd/tennis/matches/live is match-level, so a Grand Slam disappears from the
# page between sessions — measured 2026-09-06, the US Open was in the feed at
# 03:23Z and gone at 05:55Z without having ended.
#
# Dispatch-only: one design question, not a monitor.

on:
  workflow_dispatch:
    inputs:
      probe_date:
        description: 'YYYY-MM-DD (default today)'
        required: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe the tennis date parameters
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
          PROBE_DATE: ${{ inputs.probe_date }}
        run: node scripts/bsd-tennis-date-probe.mjs
      - name: Commit the reading
        if: always()
        run: |
          git config user.email "claude@field.dev"
          git config user.name  "FIELD CI"
          git add outbox/bsd-tennis-date-probe-*.json || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "probe: can tennis be asked for by date"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          exit 1
