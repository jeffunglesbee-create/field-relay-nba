name: Deploy Health Protocol Worker

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout health-protocol
        uses: actions/checkout@v4
        with:
          repository: jeffunglesbee-create/health-protocol
          token: ${{ secrets.RELAY_GH_PAT }}

      - name: Bootstrap KV namespace (hp-kv)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CF="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          KV_ID=$(curl -s -H "$AUTH" "$CF/storage/kv/namespaces?per_page=100" \
            | jq -r '.result[] | select(.title=="hp-kv") | .id' 2>/dev/null)
          if [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ]; then
            RESP=$(curl -s -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d '{"title":"hp-kv"}' "$CF/storage/kv/namespaces")
            KV_ID=$(echo "$RESP" | jq -r '.result.id' 2>/dev/null)
            echo "Created KV namespace: $RESP"
          fi
          [ -z "$KV_ID" ] || [ "$KV_ID" = "null" ] && { echo "KV ID not found"; exit 1; }
          echo "KV_ID=$KV_ID"
          printf 'name = "health-protocol"\nmain = "src/index.js"\ncompatibility_date = "2026-06-26"\naccount_id = "b57e9af57ab46c52ca9215804e689c29"\n\n[[kv_namespaces]]\nbinding = "HP_KV"\nid = "%s"\n' "$KV_ID" > wrangler.toml
          echo "=== wrangler.toml ===" && cat wrangler.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          secrets: |
            GITHUB_PAT
            STRAVA_CLIENT_ID
            STRAVA_CLIENT_SECRET
        env:
          GITHUB_PAT: ${{ secrets.RELAY_GH_PAT }}
          STRAVA_CLIENT_ID: ${{ secrets.HP_STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.HP_STRAVA_CLIENT_SECRET }}

      - name: Seed Strava tokens in KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HP_STRAVA_REFRESH_TOKEN: ${{ secrets.HP_STRAVA_REFRESH_TOKEN }}
        run: |
          CF="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          KV_ID=$(curl -s -H "$AUTH" "$CF/storage/kv/namespaces?per_page=100" \
            | jq -r '.result[] | select(.title=="hp-kv") | .id')
          KEY=$(python3 -c "import urllib.parse; print(urllib.parse.quote('strava:tokens'))")
          PAYLOAD=$(python3 -c "
          import json
          print(json.dumps({
              'access_token': '1974e6b574eda8fa16af67b1061005d8b067b0d7',
              'refresh_token': '$HP_STRAVA_REFRESH_TOKEN',
              'expires_at': 0
          }))")
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X PUT "$CF/storage/kv/namespaces/$KV_ID/values/$KEY" \
            -H "$AUTH" -H "Content-Type: application/json" \
            --data-raw "$PAYLOAD")
          echo "KV seed: HTTP $STATUS"
          [ "$STATUS" = "200" ] && echo "Strava tokens seeded (expires_at=0 forces refresh)" || echo "WARN: seed returned $STATUS"

      - name: Set CLOUDFLARE_API_TOKEN in health-protocol GitHub secrets
        env:
          RELAY_GH_PAT: ${{ secrets.RELAY_GH_PAT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pip install pynacl --quiet
          python3 - << PYEOF2
          import base64, json, urllib.request, os
          from nacl.public import SealedBox, PublicKey
          from nacl.encoding import Base64Encoder
          PAT   = os.environ["RELAY_GH_PAT"]
          REPO  = "jeffunglesbee-create/health-protocol"
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACCT  = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          headers = {"Authorization": f"token {PAT}", "Accept": "application/vnd.github+json",
                     "Content-Type": "application/json"}
          req = urllib.request.Request(
              f"https://api.github.com/repos/{REPO}/actions/secrets/public-key", headers=headers)
          with urllib.request.urlopen(req) as r:
              pk_data = json.loads(r.read())
          def enc(val):
              pk = PublicKey(pk_data["key"], encoder=Base64Encoder)
              return base64.b64encode(SealedBox(pk).encrypt(val.encode())).decode()
          for name, val in [("CLOUDFLARE_API_TOKEN", TOKEN), ("CLOUDFLARE_ACCOUNT_ID", ACCT)]:
              payload = json.dumps({"encrypted_value": enc(val), "key_id": pk_data["key_id"]}).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}/actions/secrets/{name}",
                  data=payload, headers=headers, method="PUT")
              with urllib.request.urlopen(req) as r:
                  print(f"{name}: HTTP {r.status}")
          PYEOF2

      - name: Commit wrangler.toml with real KV ID
        run: |
          git config user.email "deploy@health-protocol"
          git config user.name "GitHub Actions"
          git add wrangler.toml
          git diff --cached --quiet && echo "no changes" || \
            git commit -m "chore: wrangler.toml with real KV ID [skip ci]"
          git push "https://${{ secrets.RELAY_GH_PAT }}@github.com/jeffunglesbee-create/health-protocol.git" main

      - name: Verify Worker is live
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://health-protocol.jeffunglesbee.workers.dev/)
          echo "Worker root: HTTP $STATUS"
          curl -s https://health-protocol.jeffunglesbee.workers.dev/ || true
          [ "$STATUS" = "200" ] && echo "DEPLOY COMPLETE" || echo "Pending — check CF dashboard"
