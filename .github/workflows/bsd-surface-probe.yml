name: BSD surface probe

# docs/CC-CMD-2026-10-10-bsd-measure-before-building.md — five tasks, one run,
# one artifact, a declared 40-call budget.
#
# PROBE ONLY. No feature ships from this workflow. A 2026-10-10 review found
# 223 BSD endpoints offered and 10 consumed, with four build candidates all
# resting on premises nobody had measured. This measures them so four later
# CC-CMDs can be written against numbers.
#
# CI because the sandbox cannot reach sports.bzzoiro.com (403 at CONNECT) and
# because BSD_API_TOKEN lives here as a secret rather than in the container.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: The probe can still fail
        run: node scripts/bsd-surface-probe.mjs --self-test

      - name: Probe the surface
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: node scripts/bsd-surface-probe.mjs

      - name: Commit the artifact
        if: always()
        run: |
          set -euo pipefail
          git config user.email "claude@field.dev"
          git config user.name  "FIELD CI"
          git add outbox/bsd-surface-probe-*.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: BSD surface probe artifact"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after 3 attempts"; exit 1; }
