name: trigger-workflow-verify
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-workflow-verify.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Live-verify trigger_workflow tool -- real dispatch, real poll, cross-repo
        env:
          FIELD_MCP_SECRET: ${{ secrets.FIELD_MCP_SECRET }}
        run: |
          echo "" | base64 -d > /tmp/trigger_workflow_verify.py
          python3 /tmp/trigger_workflow_verify.py
