name: wenttoot-invariant-proof
on:
  push:
    paths: ['.github/workflows/wenttoot-invariant-proof.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Fix the one pre-existing straggler (WNBA_2026-07-07_liberty_wings) before establishing baseline
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -A "$UA" -X POST "https://field-relay-nba.jeffunglesbee.workers.dev/archive/score-by-id" \
            -H "Content-Type: application/json" \
            -d '{"id":"WNBA_2026-07-07_liberty_wings","home_score":77,"away_score":88}'
          echo

      - name: Invariant check #1 -- expect PASS (clean baseline)
        run: |
          echo "" | base64 -d > /tmp/check.py
          python3 /tmp/check.py

      - name: Null out went_to_ot on a real test row (MLB_2026-07-10_orioles_royals)
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -A "$UA" -X POST "https://field-relay-nba.jeffunglesbee.workers.dev/d1/execute" \
            -H "Content-Type: application/json" -H "X-FIELD-Relay: field-relay-cron-2026" \
            -d '{"sql":"UPDATE regular_season_games SET went_to_ot = NULL WHERE id = ?","params":["MLB_2026-07-10_orioles_royals"]}'
          echo

      - name: Invariant check #2 -- expect FAIL (proves the check has real teeth)
        run: |
          echo "" | base64 -d > /tmp/check.py
          if python3 /tmp/check.py; then
            echo "ERROR: invariant check passed when it should have failed -- check is not actually catching violations"
            exit 1
          else
            echo "Confirmed: invariant check correctly failed on the injected violation."
          fi

      - name: Restore the real value on the test row
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -A "$UA" -X POST "https://field-relay-nba.jeffunglesbee.workers.dev/d1/execute" \
            -H "Content-Type: application/json" -H "X-FIELD-Relay: field-relay-cron-2026" \
            -d '{"sql":"UPDATE regular_season_games SET went_to_ot = 0 WHERE id = ?","params":["MLB_2026-07-10_orioles_royals"]}'
          echo

      - name: Invariant check #3 -- expect PASS again (confirms clean restore)
        run: |
          echo "" | base64 -d > /tmp/check.py
          python3 /tmp/check.py
