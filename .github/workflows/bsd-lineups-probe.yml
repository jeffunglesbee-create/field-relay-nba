name: BSD lineups probe

# docs/CC-CMD-2026-10-10-bsd-predicted-lineups.md — Tasks 3 and 4.
#
# Task 3 is the INNER shape at PRE-MATCH, which the surface probe never
# recorded: it logged top-level keys only, and the 10-03 sub-field list came
# from a FINISHED event. The document's whole premise is that pre-match differs
# from finished, so the finished shape is exactly what must not be assumed.
#
# Task 4 is the unavailable_players reason rate WITH a denominator. Two samples
# in this repo disagree about whether that field exists at all, so a rate
# without a denominator cannot be told from a rate of zero.
#
# CI because sports.bzzoiro.com is 403-at-CONNECT from the container and
# BSD_API_TOKEN lives here as a secret.

on:
  workflow_dispatch:
    inputs:
      date:
        description: "YYYY-MM-DD to discover events on. Empty = today."
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: The probe can still fail
        run: node scripts/bsd-lineups-probe.mjs --self-test

      - name: Probe the pre-match inner shape and the reason rate
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            node scripts/bsd-lineups-probe.mjs "--date=${{ inputs.date }}"
          else
            node scripts/bsd-lineups-probe.mjs
          fi

      - name: Commit the artifact
        if: always()
        run: |
          set -euo pipefail
          git config user.email "claude@field.dev"
          git config user.name  "FIELD CI"
          git add outbox/bsd-lineups-probe-*.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: BSD lineups probe artifact (Tasks 3 and 4)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after 3 attempts"; exit 1; }
