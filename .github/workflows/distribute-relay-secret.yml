name: Distribute RELAY_SHARED_SECRET to the sibling repos

# Writes this repo's RELAY_SHARED_SECRET Actions secret into field-laboratory and
# jubilant-bassoon through the Deploy Courier, the same step deploy.yml runs on
# every relay deploy. Dispatch-only, for when the siblings need it without a
# relay deploy: first after their scripts stopped carrying the literal
# (2026-10-13), and after a rotation. The value is never printed.
# docs/CC-CMD-2026-08-25-rotate-relay-secret.md.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Get GitHub OIDC token
        id: oidc
        run: |
          TOKEN=$(curl -sH "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=field-deploy" | jq -r .value)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Write to both siblings
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RELAY_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
        run: bash scripts/distribute-relay-secret.sh field-laboratory jubilant-bassoon
