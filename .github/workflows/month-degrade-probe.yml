name: Month degrade probe (read-only)

# THE DONE CONDITION for the two-statement monthly batch fix, run where it can
# actually be run.
#
# chargeMonthlyOdds threw on every call — its two-statement batch went to a
# helper demanding three — and the throw was caught by a degrade-open path that
# counted it as `month: odds budget batch returned 2 result(s), expected 3`.
# The fix predicts that reason stops growing.
#
# A SANDBOXED SESSION CANNOT CHECK THIS. workers.dev is unreachable from the
# agent proxy (403), so the one read that settles it has to happen on a runner
# with open egress. That is the same reason the visual probes in this project
# are workflows rather than local browser calls.
#
# ONE SCHEDULED RUN A DAY, because the done condition needs an interval in
# which odds are actually being charged and the session that wrote this could
# not have one. The daily ceiling was already at 3800/3800 by 14:03:59Z on
# 2026-10-11, and all three monthly-charge call sites gate on the daily layer
# first — `if (!(await checkAndIncrementDailyOdds(...))) return false;` — so
# chargeMonthlyOdds is not reached at all once the ceiling holds. Every probe
# run that day returned INCONCLUSIVE, correctly.
#
# 01:47 UTC: after the 00:00 reset, after the */5 cron has fired a dozen times
# on the new day, and off the hour because a schedule on minute 0 queues behind
# everyone else's.
#
# DELETE THIS WORKFLOW once a run returns PASS. It settles a done condition; it
# is not a standing watch. scripts/check-batch-order.mjs in guards.yml is what
# keeps the defect from coming back, and it runs on every push.
#
# READ-ONLY AND FREE: three GETs of /budget/odds, which reads KV and D1 and
# never reaches the vendor. No credits.

on:
  schedule:
    - cron: '47 1 * * *'
  workflow_dispatch:
    inputs:
      wait_seconds:
        description: 'Seconds between the two samples (the push cron is */5, so 420 gives it at least one firing)'
        required: false
        default: '420'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The verdict must be able to come back FAIL and INCONCLUSIVE before a
      # PASS from it means anything. The quiet-interval case is the one that
      # matters: a flat count over an interval where nothing happened is not
      # evidence, and a probe that reported it as a pass would be worse than no
      # probe at all.
      - name: the probe can fail
        run: node scripts/probe-month-degrade-stopped.mjs --self-test

      # pipefail: without it the step's exit code is tee's, which is how run
      # 35012890540 reported success over a script that exited 1.
      - name: Probe
        shell: bash
        env:
          # `inputs` is empty on a scheduled run, so this is the empty string
          # there. Belt and braces: the script already reads
          # `Number(process.env.PROBE_WAIT_SECONDS || 420)`, and '' is falsy, so
          # it lands on 420 either way — measured, not assumed, because
          # Number('') is 0 and the two differ by which operator runs first.
          # Kept in both places so neither file alone has to be right.
          PROBE_WAIT_SECONDS: ${{ inputs.wait_seconds || '420' }}
        run: |
          set -o pipefail
          STAMP=$(date -u +%Y-%m-%dT%H%M)
          node scripts/probe-month-degrade-stopped.mjs 2>&1 \
            | tee "outbox/month-degrade-probe-${STAMP}.log" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # always(): a FAIL is the run carrying the evidence, so its log is the one
      # most worth keeping.
      - name: Commit the log
        if: always()
        run: |
          PROBE_AUTHOR_NAME="month-degrade-probe" \
          PROBE_AUTHOR_EMAIL="actions@github.com" \
          bash scripts/probe-commit-retry.sh "chore: month degrade probe"
