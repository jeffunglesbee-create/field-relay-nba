name: Bootstrap Secret
on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Secret name to set'
        required: true
        type: string
      secret_value:
        description: 'Secret value'
        required: true
        type: string

permissions:
  contents: read
  secrets: write

jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Set secret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRET_VALUE: ${{ inputs.secret_value }}
        run: |
          echo "$SECRET_VALUE" | gh secret set "${{ inputs.secret_name }}" --repo "${{ github.repository }}"
          echo "Secret ${{ inputs.secret_name }} set successfully."
