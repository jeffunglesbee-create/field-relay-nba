name: Archive Game Team Refresh Test

# One-shot: live write-twice + null-guard test for the /archive/game
# home/away upsert-refresh fix. Disposable test series_key.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run team-refresh test
        run: node scripts/archive-game-team-refresh-test.mjs
