# Asserts /bsd/events/by-date pages and caches on the deployed relay
# (docs/CC-CMD-2026-10-18-bsd-by-date-offset-and-cache.md). Dispatch-only; the
# sandbox cannot reach *.workers.dev.
name: bsd-by-date-paging-check
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Self-test, then the deployed route
        run: |
          node scripts/check-bsd-by-date-paging.mjs --self-test
          node scripts/check-bsd-by-date-paging.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the record
        if: always()
        run: |
          git config user.email "claude@field.dev"; git config user.name "FIELD CI"
          git add outbox/bsd-by-date-paging-latest.json || true
          git diff --cached --quiet && exit 0
          git commit -m "probe: by-date paging and cache on the deployed relay"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin main && break; sleep $((i*5)); done
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after retries"; exit 1; }
