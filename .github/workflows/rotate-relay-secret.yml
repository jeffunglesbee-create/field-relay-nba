name: Rotate RELAY_SHARED_SECRET

# docs/CC-CMD-2026-08-25-rotate-relay-secret.md step 3, on a runner. The new
# value is generated here, masked before first use, written to both Workers,
# this repo and both siblings, then proved live: the new value passes both
# gates and the old one is refused by both. Any failure writes the old value
# back everywhere. See scripts/rotate-relay-secret.sh.
#
# DISPATCH ONLY, and only with confirm=ROTATE. Preconditions run first and
# change nothing: both Workers hold the binding, every gate reads it, and the
# current value passes the live probe. If the current state is already broken,
# rotating on top of it would hide which change broke it.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type ROTATE to replace the shared secret everywhere'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: rotate-relay-secret
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Refuse without confirmation
        if: inputs.confirm != 'ROTATE'
        run: |
          echo "::error::confirm must be ROTATE; nothing was changed."
          exit 1

      - name: The rotation's rollback paths can fail (dry run, fake transport)
        run: bash scripts/rotate-relay-secret.sh --self-test

      - name: Precondition — both Workers hold the binding, and every gate reads it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bash scripts/worker-secret-names.sh RELAY_SHARED_SECRET field-relay-nba field-claude-proxy
          node scripts/check-relay-secret-gates.mjs

      - name: Precondition — the current value passes the live probe
        env:
          RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
        run: bash scripts/probe-relay-secret-gates.sh

      - name: Get GitHub OIDC token
        id: oidc
        run: |
          TOKEN=$(curl -sH "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=field-deploy" | jq -r .value)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # pipefail: without it the step's exit code is tee's, and a rolled-back
      # rotation would report success.
      - name: Rotate
        shell: bash
        env:
          OLD: ${{ secrets.RELAY_SHARED_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -o pipefail
          STAMP=$(date -u +%Y-%m-%dT%H%M)
          { echo "=== relay secret rotation  utc=$(date -u +%FT%TZ) ==="
            bash scripts/rotate-relay-secret.sh --rotate
          } 2>&1 | tee "outbox/relay-secret-rotation-${STAMP}.log" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the log
        if: always()
        run: |
          PROBE_AUTHOR_NAME="relay-secret-rotation" \
          PROBE_AUTHOR_EMAIL="actions@github.com" \
          bash scripts/probe-commit-retry.sh "chore: relay secret rotation"
