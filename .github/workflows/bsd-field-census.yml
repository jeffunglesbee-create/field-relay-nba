name: BSD field census

# Task 1 of docs/CC-CMD-2026-10-10-bsd-fields-already-arriving.md, and Task 4
# in the same run because both read the same endpoint and neither should cost
# a second trip.
#
# NO NEW UPSTREAM CALL. /api/v2/events/?date_from=&date_to= is the endpoint and
# the parameter pair the relay's WC enrichment (src/index.js:4412) and the
# claims harness (scripts/bsd-newsletter-claims.mjs:129) already use.
#
# CI because the sandbox cannot reach sports.bzzoiro.com, and because
# BSD_API_TOKEN lives here as a secret rather than in the container.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD to census. Default: today UTC.'
        required: false

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: The census can still fail
        run: node scripts/bsd-field-census.mjs --self-test

      - name: Census the live field set
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: node scripts/bsd-field-census.mjs ${{ inputs.date }}

      - name: Re-run the claims harness for the widened vocabulary
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: node scripts/bsd-newsletter-claims.mjs

      - name: Commit both artifacts
        if: always()
        run: |
          set -euo pipefail
          git config user.email "claude@field.dev"
          git config user.name  "FIELD CI"
          git add outbox/bsd-field-census-*.json outbox/bsd-newsletter-claims-*.json
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: BSD field census and claims re-run"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after 3 attempts"; exit 1; }
