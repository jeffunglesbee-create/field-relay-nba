name: WC26 Rank Fetch (one-shot model data)

on:
  workflow_dispatch:

jobs:
  fetch-ranks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch FIFA rankings for all WC26 teams
        env:
          RELAY_BASE: https://field-relay-nba.jeffunglesbee.workers.dev
        run: node scripts/wc26-rank-fetch.mjs
