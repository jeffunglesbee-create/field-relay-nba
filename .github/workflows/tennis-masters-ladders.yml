name: Tennis Masters Ladders

# Does a 96-draw Masters break the route's `canonical` figure?
#
# The shape probe read BSD directly and does not exclude cancelled rows; the
# route does. So the Masters ladders it reported cannot answer this — the
# question needs the deployed route's own numbers.
#
# Dispatch-only. This decides a contract change; it is not a monitor.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read all ten Masters ladders from the deployed route
        run: node scripts/tennis-masters-ladders.mjs
      - name: Commit the reading
        if: always()
        run: |
          git config user.email "claude@field.dev"
          git config user.name  "FIELD CI"
          git add outbox/tennis-masters-ladders-*.json || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "probe: what the draw route makes of a 96-draw Masters"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          exit 1
