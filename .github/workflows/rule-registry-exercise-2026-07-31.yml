name: Rule Registry Exercise (2026-07-31 UEFA-qual session)

on:
  push:
    paths:
      - '.github/workflows/rule-registry-exercise-2026-07-31.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exercise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read current rule-registry state before writing anything
        run: |
          curl -sS -X POST https://field-relay-nba.jeffunglesbee.workers.dev/d1/execute \
            -H "Content-Type: application/json" \
            -H "X-FIELD-Relay: field-relay-cron-2026" \
            -d '{"sql":"SELECT key, title, updated_at FROM codex WHERE category = '"'"'rule-registry'"'"' ORDER BY key"}' \
            | tee /tmp/before.json

      - name: Mark rules 91, 95, 96, 97 EXERCISED -- real, honest cases from this session only
        run: |
          set -e
          # Rule 91 (Legible across scope): today's cross-repo UEFA-qual work
          # explicitly ran radius 3 (Contract Cross-Check) -- confirmed via
          # direct grep that CONTRACTS.md already documents `series`
          # (game.series.homeAggregate/awayAggregate, CONTRACTS.md:452-524);
          # the relay fix only widened WHEN it populates, not its shape, so
          # no CONTRACTS.md update was needed -- stated explicitly, not
          # silent, satisfying the rule's own violation-signal test.
          curl -sS -X POST https://field-relay-nba.jeffunglesbee.workers.dev/d1/execute \
            -H "Content-Type: application/json" -H "X-FIELD-Relay: field-relay-cron-2026" \
            -d '{"sql":"UPDATE codex SET title = ?, updated_at = datetime(\"now\") WHERE key = ?","params":["EXERCISED -- Rule 91: 2026-07-31, UEFA-qual cross-repo session ran radius-3 Contract Cross-Check explicitly -- confirmed CONTRACTS.md already documents game.series shape, stated no update needed rather than staying silent","rule-91"]}'

          # Rule 95 (RUWT risk register): a proposed BSD-based two-legged
          # aggregate feature was evaluated against Rule A (pull-only) and
          # Rule F (commodity vs proprietary) this session, found to
          # duplicate an already-CLEAR ESPN-based mechanism (g.series --
          # factual match aggregation, arithmetic only), and the duplicate
          # build was stopped rather than shipped. Real risk classification
          # exercise, not fabricated.
          curl -sS -X POST https://field-relay-nba.jeffunglesbee.workers.dev/d1/execute \
            -H "Content-Type: application/json" -H "X-FIELD-Relay: field-relay-cron-2026" \
            -d '{"sql":"UPDATE codex SET title = ?, updated_at = datetime(\"now\") WHERE key = ?","params":["EXERCISED -- Rule 95: 2026-07-31, evaluated a proposed BSD-based two-legged-aggregate feature against Rule A/F, classified CLEAR (duplicate of existing ESPN g.series arithmetic aggregation), stopped the duplicate build rather than ship it","rule-95"]}'

          # Rule 96 (Sandbox access matrix): today re-confirmed live --
          # direct curl to *.workers.dev from the sandbox failed (403,
          # matches documented block), probe_relay_route succeeded for the
          # already-allow-listed /v2/games path. Matrix behavior verified
          # current, not stale.
          curl -sS -X POST https://field-relay-nba.jeffunglesbee.workers.dev/d1/execute \
            -H "Content-Type: application/json" -H "X-FIELD-Relay: field-relay-cron-2026" \
            -d '{"sql":"UPDATE codex SET title = ?, updated_at = datetime(\"now\") WHERE key = ?","params":["EXERCISED -- Rule 96: 2026-07-31, re-confirmed live -- direct curl to *.workers.dev from sandbox failed 403 as documented, probe_relay_route /v2/games (already allow-listed) succeeded, matrix still accurate","rule-96"]}'

          # Rule 97 (CI as invariant): this session encountered exactly the
          # invariant/point-check distinction the rule describes -- the
          # Rule-90 staleness check itself IS a real invariant (compares
          # julianday(now) vs updated_at, a relationship between two live
          # values, not a static fact) and was investigated rather than
          # bypassed or rationalized when it failed (NO-RATIONALIZE-A).
          curl -sS -X POST https://field-relay-nba.jeffunglesbee.workers.dev/d1/execute \
            -H "Content-Type: application/json" -H "X-FIELD-Relay: field-relay-cron-2026" \
            -d '{"sql":"UPDATE codex SET title = ?, updated_at = datetime(\"now\") WHERE key = ?","params":["EXERCISED -- Rule 97: 2026-07-31, this session investigated a real invariant-style CI failure (Rule-90 staleness check, a live julianday(now) vs updated_at comparison) rather than rationalizing or bypassing it, per NO-RATIONALIZE-A","rule-97"]}'

          echo "Deliberately NOT touched: rule-92, rule-93, rule-94 -- no genuine applicable case this session (Watch Engine WC tier selection, OTW momentum, _fieldDataReady sentinel were not touched by any work done today). Per Rule 90's own text, leaving them UNEXERCISED is the honest signal, not a gap to paper over."

      - name: Read back rule-registry state after writing -- confirm exactly 4 rows changed, no others touched
        run: |
          curl -sS -X POST https://field-relay-nba.jeffunglesbee.workers.dev/d1/execute \
            -H "Content-Type: application/json" \
            -H "X-FIELD-Relay: field-relay-cron-2026" \
            -d '{"sql":"SELECT key, title, updated_at FROM codex WHERE category = '"'"'rule-registry'"'"' ORDER BY key"}' \
            | tee /tmp/after.json
          echo "--- diff (before vs after, for the outbox artifact) ---"
          diff /tmp/before.json /tmp/after.json || true

      - name: Commit before/after snapshots to outbox
        if: always()
        run: |
          mkdir -p outbox
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          cp /tmp/before.json "outbox/rule-registry-exercise-before-${TS}.json" || true
          cp /tmp/after.json "outbox/rule-registry-exercise-after-${TS}.json" || true
          git config user.email "probe@field"
          git config user.name "Rule-Registry-Exercise-Probe"
          git add outbox/
          git commit -m "rule-registry exercise snapshot (rules 91/95/96/97) [skip ci]" || echo "(nothing new)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
