name: whoop_tokens probe

# Does the `whoop_tokens` table exist in D1, and does it hold anything?
#
# Whoop left the worker on 2026-09-19 (098b989) and the `DB` binding that reached
# its table left on 2026-09-20 (712227d). What was carried forward was "drop the
# whoop_tokens table?", filed as an owner decision. It is not a decision — it is a
# question nobody asked. No `CREATE TABLE whoop_tokens` exists in any commit, and
# no session has ever queried it. Three of this probe's four outcomes settle the
# item with no owner involvement and no write.
#
# READ-ONLY. Two SELECTs: sqlite_master, and a COUNT(*). The table holds live
# OAuth tokens, so no statement names a token column and the committed log
# carries a count, never a value. scripts/mutate-whoop-tokens.mjs W4 and W5 are
# the mutations that hold that line, and they run before the probe does.
#
# THE CLOUDFLARE D1 REST API, NOT /d1/execute. That route binds env.ARCHIVE_DB
# (field-archive, cc49101c) and has no path to this database. The removed Whoop
# code used env.DB, database_id f26669de — the same store WC2026_DB binds.
#
# Dispatch only. It answers a question once; it is not a watch.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Rule 90: the harness runs BEFORE the probe, so a probe whose classifier
      # cannot be made to fail never gets to produce a verdict — and so the
      # credential guard is proven live rather than assumed.
      - name: The classifier can be made to fail
        run: |
          node scripts/probe-whoop-tokens.mjs --self-test
          node scripts/mutate-whoop-tokens.mjs

      - name: Probe
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/probe-whoop-tokens.mjs

      - name: Commit the artifact
        if: always()
        run: |
          git config user.name  "FIELD CI"
          git config user.email "claude@field.dev"
          git add outbox/whoop-tokens-probe-*.log 2>/dev/null || true
          git diff --staged --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "probe: does whoop_tokens exist, and does it hold anything"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
          # The loop above exits 0 when EVERY attempt fails: its last command is
          # `sleep`, and `set -e` does not fire because a failing `&&` list is a
          # tested command. Verified under the exact Actions shell
          # (bash -e -o pipefail). Without this line a lost artifact reports as a
          # green step. is-ancestor, not HEAD equality: another bot pushing after
          # us is routine here and must not read as our failure.
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after retries"; exit 1; }
