name: Probe Drama Backfill Fields

# CC-CMD-2026-08-03-fix-drama-backfill-situational-fields TASK 1 real
# probe: confirms the real, current ESPN MLB play-object shape (top-level
# vs situation-nested), and runs a real D1 query to identify which rows
# were written by the buggy Node backfill script (drama_arc as a JSON
# array) vs the client's own write paths (drama_arc as a JSON object).

on:
  push:
    paths:
      - '.github/workflows/probe-drama-backfill-fields.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run probe
        run: |
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p outbox
          node scripts/probe-drama-backfill-fields.mjs 2>&1 | tee "outbox/drama-backfill-probe-${TS}.log"
          node scripts/probe-drama-backfill-fields-2.mjs 2>&1 | tee "outbox/drama-backfill-probe2-${TS}.log"
          node scripts/verify-drama-leaderboard.mjs 2>&1 | tee "outbox/drama-leaderboard-verify-${TS}.log"

      - name: Commit probe result
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Drama-Backfill-Fields-Probe"
          git add outbox/drama-backfill-probe-*.log outbox/drama-backfill-probe2-*.log outbox/drama-leaderboard-verify-*.log
          git commit -m "drama-backfill fields probe result [skip ci]" || echo "(nothing new)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
