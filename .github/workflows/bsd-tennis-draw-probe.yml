name: BSD Tennis Draw Probe

# Can a tennis DRAW be reconstructed from what BSD serves?
#
# There is no bracket endpoint — the schema census read 217 declared paths and
# the tennis surface has matches, h2h, point-by-point, players, rankings,
# tournaments and predictions, with no /draw/ and no /bracket/. So a bracket is
# either derivable from matches or it is not available, and that is a question
# to measure before anyone designs one.
#
# Dispatch-only. This answers a design question once; it is not a monitor.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe the tennis draw surface
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: node scripts/bsd-tennis-draw-probe.mjs
      - name: Commit the reading
        if: always()
        run: |
          git config user.email "claude@field.dev"
          git config user.name  "FIELD CI"
          git add outbox/bsd-tennis-draw-probe-*.json || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "probe: can a tennis draw be reconstructed from BSD matches"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          exit 1
