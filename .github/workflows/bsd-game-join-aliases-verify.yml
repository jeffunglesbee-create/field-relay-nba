# The live proof of the nine alias pairs (docs/CC-CMD-2026-10-28-bsd-join-aliases-beyond-the-fixture-dates.md, Task 4):
# join the seven fixture dates through the deployed admin route, read /context/date back, assert against the measurement that
# named the unmatched rows, and commit outbox/bsd-game-join-aliases-live-latest.json. On a runner because the authoring sandbox
# cannot reach *.workers.dev. Triggered by a push to the trigger file, and by dispatch. No schedule: the call writes to the archive.
name: bsd-game-join-aliases-verify
on:
  push:
    paths: ['outbox/.trigger-bsd-game-join-aliases-verify']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: The live assertions, each failed on purpose against a stub
        run: node scripts/check-bsd-game-join-aliases-live.mjs --self-test
      - name: Join the dates and read back from the deployed relay
        env:
          RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
        run: node scripts/check-bsd-game-join-aliases-live.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit the record
        if: always()
        run: |
          git config user.email "claude@field.dev"; git config user.name "FIELD CI"
          git add outbox/bsd-game-join-aliases-live-latest.json || true
          git diff --cached --quiet && exit 0
          git commit -m "data: the BSD alias pairs, live on the deployed relay"
          for i in 1 2 3; do git pull --rebase --autostash origin main && git push origin HEAD:main && break; sleep $((i*5)); done
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after retries"; exit 1; }
