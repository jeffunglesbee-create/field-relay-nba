name: NBA CDN egress probe (read-only)

# Dispatch-only, NO schedule. TASK 0 premise 2 of
# docs/CC-CMD-2026-10-22-nba-cdn-403-in-season.md: does cdn.nba.com refuse the
# relay's egress, or the URL? CI because the sandbox cannot reach cdn.nba.com
# or ESPN at all.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Self-test the verdict
        run: node scripts/nba-cdn-egress-probe.mjs --self-test
      - name: Probe
        run: |
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          echo "TS=$TS" >> "$GITHUB_ENV"
          node scripts/nba-cdn-egress-probe.mjs 2>&1 | tee "outbox/nba-cdn-egress-probe-$TS.log"
          exit ${PIPESTATUS[0]}
      - name: Commit the artifact
        if: always()
        run: |
          git config user.email "claude@field.dev"
          git config user.name "FIELD CI"
          git add outbox/nba-cdn-egress-probe-*.log 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "chore: NBA CDN egress probe [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
          # is-ancestor, not HEAD equality: another bot pushing after us is normal.
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after 3 attempts"; exit 1; }
