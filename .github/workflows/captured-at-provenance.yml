name: captured_at provenance (read-only)

# CC-CMD-2026-09-15-backfill-captured-at-not-snapshot-time Task 0.
#
# 22 archived closing lines carry a captured_at that is not their odds_history
# snapshot_time. Three readings were argued from timestamps and none could be
# separated by another timestamp. This probe compares the PRICES instead: same
# prices means one capture event and a row rewritten since; different prices
# means the blob never came from that row.
#
# READ-ONLY. The probe refuses any SQL that is not a SELECT.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provenance
        env:
          RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
        run: node scripts/probe-captured-at-provenance.mjs

      # The edited candidate query fires unattended at 10:00 UTC. Run it
      # read-only first, and check its three new columns against the rows they
      # describe.
      - name: The backfill's candidate SQL runs, and its flags are true
        if: always()
        env:
          RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
        run: node scripts/verify-odds-backfill-candidate-sql.mjs

      - name: Commit the log
        if: always()
        run: |
          PROBE_AUTHOR_NAME="captured-at-provenance" \
          PROBE_AUTHOR_EMAIL="actions@github.com" \
          bash scripts/probe-commit-retry.sh "chore: captured_at provenance"
