name: datamuse-proxy-verify
on:
  push:
    paths: ['.github/workflows/datamuse-proxy-verify.yml']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Poll /deploy/verify until this commit is live
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for i in $(seq 1 20); do
            OUT=$(curl -sS -A "$UA" "https://field-relay-nba.jeffunglesbee.workers.dev/deploy/verify")
            echo "[$i] $OUT"
            if echo "$OUT" | grep -q '"match":true'; then
              echo "DEPLOYED"
              break
            fi
            sleep 15
          done

      - name: Call /datamuse/words first time (expect MISS, real Datamuse data)
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -A "$UA" -D /tmp/h1.txt -o /tmp/b1.txt "https://field-relay-nba.jeffunglesbee.workers.dev/datamuse/words?sp=basketball&md=f&max=1"
          echo "--- headers ---"; cat /tmp/h1.txt
          echo "--- body ---"; cat /tmp/b1.txt

      - name: Call /datamuse/words second time, same params (expect HIT)
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -A "$UA" -D /tmp/h2.txt -o /tmp/b2.txt "https://field-relay-nba.jeffunglesbee.workers.dev/datamuse/words?sp=basketball&md=f&max=1"
          echo "--- headers ---"; cat /tmp/h2.txt
          echo "--- body ---"; cat /tmp/b2.txt

      - name: Sanity check -- unrelated existing route still works
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          curl -sS -A "$UA" -o /dev/null -w "%{http_code}\n" "https://field-relay-nba.jeffunglesbee.workers.dev/wiki/trending"
