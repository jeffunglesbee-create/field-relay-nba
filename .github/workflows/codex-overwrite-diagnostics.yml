# CC-CMD-2026-09-07-codex-write-nondestructive-and-recovery — TASK 0.
#
# FREE DIAGNOSTICS, AND READ-ONLY BY CONSTRUCTION. Task 0a is a node probe whose
# every statement is a SELECT. Task 0b is `wrangler d1 time-travel INFO`, which
# reports the retention window and changes nothing.
#
# `time-travel restore` IS NOT RUN HERE AND MUST NOT BE ADDED. The CC-CMD is
# explicit about why: Time Travel rewinds the ENTIRE database, and 60 deployed
# routes read or write d1:ARCHIVE_DB, several on */5 and */15 crons. Rewinding
# past 03:11Z to recover 25 prose blobs would destroy hours of live writes across
# all of them. `info` answers the only question worth asking — whether a window
# even exists — and a side-restore (Task 2) exports to a SCRATCH database rather
# than restoring in place.
name: codex overwrite diagnostics

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Tolerant, per _reusable-probe.yml's own recorded lesson: a step that
      # fails before writing output must not look identical to one that ran and
      # found nothing.
      - name: 0a — is a prior value journaled anywhere reachable?
        continue-on-error: true
        env:
          # Variables, never values — check-no-literal-secret-writes.mjs exists
          # because a workflow once installed a credential from a literal.
          RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
        run: node scripts/codex-overwrite-diagnostics.mjs 2>&1 | tee outbox/codex-overwrite-0a.log

      - name: 0b — the REAL Time Travel retention window
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo "# wrangler d1 time-travel info --database field-archive"
            echo "# run at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# INFO ONLY. restore is forbidden by the CC-CMD and by the dispatcher."
            echo
            npx --yes wrangler@3.109.0 d1 time-travel info field-archive 2>&1
          } | tee outbox/codex-overwrite-0b-timetravel.txt

      # TASK 1 verification. Runs after the guard deploys; before that it fails
      # on the missing table, which is a true report of the deployed state rather
      # than a broken test.
      - name: 1 — two-write scratch test, and the no-op control
        continue-on-error: true
        env:
          RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
          FIELD_MCP_SECRET: ${{ secrets.FIELD_MCP_SECRET }}
        run: node scripts/codex-history-scratch-test.mjs 2>&1 | tee outbox/codex-history-scratch-test.log

      - name: Commit findings
        if: always()
        run: |
          git config user.name "FIELD CI"
          git config user.email "claude@field.dev"
          git add outbox/ || echo "nothing under outbox/"
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "chore: codex overwrite Task 0 diagnostics"
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed on attempt $i"; exit 0; fi
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          exit 1
