name: Enqueue Context Gap Verify (temporary, CC-CMD-2026-07-09-enqueue-context-gap)
on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Enqueue a diagnostic job with real game/matchupNote data, then poll for completion
        run: |
          set -x
          BASE="https://field-relay-nba.jeffunglesbee.workers.dev"

          RESP=$(curl -s -X POST "$BASE/journalism/enqueue" \
            -H "Content-Type: application/json" \
            -d '{
              "prompt": "Write a 50-70 word brief about tonight'"'"'s Lakers vs Celtics game. Lakers won 112-108. Lead with the decisive moment or stat. No cliches, one paragraph.",
              "sport": "basketball",
              "briefType": "test-enqueue-context-gap",
              "home": "Lakers",
              "away": "Celtics",
              "homeScore": 112,
              "awayScore": 108,
              "matchupNote": "This was the fifth meeting of the season between these two teams, with the season series tied 2-2 heading in.",
              "_diag": true
            }')
          echo "Enqueue response: $RESP"
          JOB_ID=$(echo "$RESP" | python3 -c "import json,sys; print(json.load(sys.stdin)['jobId'])")
          echo "Job ID: $JOB_ID"

          for i in $(seq 1 20); do
            sleep 3
            RESULT=$(curl -s "$BASE/journalism/result/$JOB_ID")
            STATUS=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status','?'))" 2>/dev/null || echo "parse_error")
            echo "Poll $i: status=$STATUS"
            if [ "$STATUS" = "done" ] || [ "$STATUS" = "failed" ]; then
              echo "=== Final result ==="
              echo "$RESULT" | python3 -m json.tool
              break
            fi
          done
