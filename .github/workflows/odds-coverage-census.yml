# CC-CMD-2026-09-11-odds-key-map-reconcile — Task 0 diagnosis and Task 3 census.
#
# Reads /context/date/{date} from the live relay and reports, per sport label:
# rows, rows with opening odds, rows with closing odds, rows with a draw price.
# No Odds API credit is spent — this reads what the relay already stored.
#
# It prints the DISTINCT SPORT LABELS rather than a fixed sport list, because a
# label the odds lookup cannot resolve produces exactly the symptom the CC-CMD
# describes, and a census keyed on expected names would hide it.
name: odds coverage census

on:
  schedule:
    # Daily. The coverage gap this measures (MLS/Bundesliga/CFB/NFL rows with no
    # odds) was rediscovered from scratch on 2026-08-21 and again on 2026-09-11,
    # each time by hand. A daily census means the next change in it is read from
    # a log rather than re-derived, and spends no Odds API credit to do so.
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      dates:
        description: 'Comma-separated dates to census'
        required: false
        default: '2026-09-06,2026-09-10'

permissions:
  contents: write

concurrency:
  group: odds-coverage-census
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: self-test — the census can tell a two-way payload from a three-way
        run: node scripts/odds-coverage-census.mjs --self-test
      - name: census
        run: |
          DATES="${{ inputs.dates }}"
          if [ -z "$DATES" ]; then
            DATES="$(date -u -d 'yesterday' +%F),$(date -u +%F)"
          fi
          echo "censusing $DATES"
          node scripts/odds-coverage-census.mjs --dates="$DATES" \
            2>&1 | tee outbox/odds-coverage-census.log
      - name: Commit findings
        if: always()
        run: |
          git config user.name "FIELD CI"
          git config user.email "claude@field.dev"
          git add outbox/odds-coverage-census.log || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "chore: odds coverage census [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin main || true
            sleep $((i * 3))
          done
          exit 1
