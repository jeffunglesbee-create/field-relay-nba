name: Golf core API reach probe

# docs/CC-CMD-2026-11-16-golf-tee-times.md: does the Worker reach ESPN's core golf API? Asks through
# the relay's /web-fetch and directly from the runner, and commits the statuses. Dispatch only.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe
        run: |
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p outbox
          node scripts/golf-core-reach-probe.mjs 2>&1 | tee "outbox/golf-core-reach-probe-${TS}.log"
          exit "${PIPESTATUS[0]}"

      - name: Commit result
        if: always()
        run: |
          git config user.email "claude@field.dev"
          git config user.name "FIELD CI"
          git add outbox/golf-core-reach-probe-*
          git diff --staged --quiet && { echo "(nothing new)"; exit 0; }
          git commit -m "chore: golf core API reach probe artifact"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
          # The loop above exits 0 when ALL THREE attempts fail: its last command is `sleep`.
          git fetch -q origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "FAIL: push did not land after 3 attempts"; exit 1; }
