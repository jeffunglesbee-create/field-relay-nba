name: R2 Window Gate Tail Verify
# CC-CMD-2026-08-02-gate-weekly-r2-update-windows TASK 3 real live
# verification. None of the 5 real date/hour windows are active at
# dispatch time (confirmed via `date -u`), so this cannot observe a
# positive same-window firing -- it instead confirms the real,
# deployed [R2-WINDOW-GATE] log line executes without error on real
# cron ticks and reports the correct (negative, since no window
# matches right now) gate values. Disclosed explicitly in the outbox
# as partial live evidence, not a full positive-firing confirmation,
# per Rule 90.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Tail worker logs across a real cron window
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== wrangler tail capture start: $(date -u) ==="
          npx wrangler tail field-relay-nba --format pretty > tail_output.log 2>&1 &
          TAIL_PID=$!
          sleep 360
          kill $TAIL_PID 2>/dev/null || true
          sleep 2
          echo "=== wrangler tail capture end: $(date -u) ==="
          echo "=== R2-WINDOW-GATE lines captured ==="
          grep "R2-WINDOW-GATE" tail_output.log || echo "(none captured)"

      - name: Save real captured evidence
        run: |
          mkdir -p outbox
          ts=$(date -u +%Y%m%dT%H%M%SZ)
          grep "R2-WINDOW-GATE" tail_output.log > "outbox/r2-window-gate-tail-${ts}.log" || echo "(no matching lines)" > "outbox/r2-window-gate-tail-${ts}.log"
          git config user.email "probe@field"
          git config user.name "R2 Window Gate Tail Verify"
          git add outbox/r2-window-gate-tail-*.log
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "r2-window-gate tail verify result [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
