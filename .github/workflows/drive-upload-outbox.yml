# .github/workflows/drive-upload-outbox.yml
#
# FIELD OUTBOX -> Google Drive via Apps Script
#
# FIX (June 17 2026): HEAD~1 only checks the last commit in a push.
# CC pushes 3-7 commits at once. Now uses github.event.before..HEAD
# to scan the ENTIRE push range. Also adds workflow_dispatch for manual backfill.
#
# SECRETS REQUIRED:
#   APPS_SCRIPT_URL    -- deployed Apps Script web app URL
#   APPS_SCRIPT_SECRET -- shared verification token

name: FIELD Outbox to Drive

# SCHEDULED BACKSTOP added 2026-08-22, on a demonstrated failure.
#
# Rule 67 makes an undelivered session doc a violation, and delivery here has
# more than one way to silently not happen:
#   1. `[skip ci]` in the commit message skips ALL workflows, including this one.
#      Every docs commit in this repo carries it by convention, so every session
#      doc committed that way never reached Drive. Confirmed tonight: the
#      quality-scale doc needed a manual dispatch to land.
#   2. This workflow has failed on its own before (run 14, 2026-06-24).
#   3. The push path diffs `github.event.before..HEAD`, which misses a file
#      added in a push that was later rebased over.
#
# The convention fix is separate and lands with this: `[skip ci]` was never
# needed on docs commits, because deploy.yml already filters on src/**,
# wrangler.toml and workers/** — an outbox-only commit cannot trigger a deploy.
# That is recorded in CLAUDE.md. This schedule is the backstop for the other two
# failure modes, not a substitute for the convention fix.
#
# LEDGER, and why the sweep cannot spam duplicates: the Apps Script does not
# dedupe — Drive already holds several same-titled copies from repeated
# dispatches. The scheduled path therefore uploads only basenames absent from
# outbox/.drive-uploaded, and appends on success. That ledger was SEEDED with
# all 523 existing outbox/*.md at creation time, deliberately: most predate this
# workflow and were never uploaded, and mass-uploading them now would be 500+
# unwanted Drive files. The sweep covers docs written from this point on.

on:
  push:
    paths:
      - 'outbox/**/*.md'
      - 'outbox/*.md'
    branches:
      - main
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      file_pattern:
        description: 'Glob for outbox files to upload (default: all .md). Matches BASENAME, not path — find -name semantics.'
        required: false
        default: ''

# Declared explicitly rather than inherited. This workflow was read-only until
# the ledger step was added; that step pushes, so it needs contents: write, and
# relying on whatever the repo default happens to be is the assumption class
# this project keeps getting caught by. _reusable-probe.yml declares the same.
permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    name: Upload CC output to Drive

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find new outbox .md files
        id: files
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Backstop sweep: any outbox .md not yet recorded as delivered.
            # Ledger-based rather than git-diff based, precisely because the
            # failure modes this exists for are ones where the git history looks
            # normal and the upload simply never ran.
            touch outbox/.drive-uploaded
            NEW=$(for f in outbox/*.md; do
                    [ -e "$f" ] || continue
                    grep -qxF "$(basename "$f")" outbox/.drive-uploaded || echo "$f"
                  done | sort)
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PATTERN="${{ github.event.inputs.file_pattern }}"
            if [ -z "$PATTERN" ]; then
              NEW=$(find outbox -name '*.md' -type f 2>/dev/null | sort)
            else
              NEW=$(find outbox -name "$PATTERN" -type f 2>/dev/null | sort)
            fi
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              NEW=$(find outbox -name '*.md' -type f 2>/dev/null | sort)
            else
              NEW=$(git diff --name-only --diff-filter=A "$BEFORE" HEAD -- 'outbox/*.md' 2>/dev/null || echo "")
            fi
          fi

          if [ -z "$NEW" ]; then
            echo "No new outbox files found"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            COUNT=$(echo "$NEW" | wc -l | tr -d ' ')
            echo "Found $COUNT new file(s):"
            echo "$NEW"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "$NEW" > /tmp/new-files.txt
          fi

      - name: Upload to Drive via Apps Script
        if: steps.files.outputs.found == 'true'
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
        run: |
          if [ -z "$APPS_SCRIPT_URL" ] || [ -z "$APPS_SCRIPT_SECRET" ]; then
            echo "APPS_SCRIPT_URL or APPS_SCRIPT_SECRET not set"
            exit 1
          fi

          FOLDER="0ABxH84VndHL7Uk9PVA"
          SUCCESS=0
          FAIL=0

          echo 'import json,sys,urllib.request,urllib.error' > /tmp/upload.py
          echo 'url,sec,ttl,fid,fp=sys.argv[1:6]' >> /tmp/upload.py
          echo 'payload=json.dumps({"secret":sec,"title":ttl,"content":open(fp).read(),"folderId":fid}).encode()' >> /tmp/upload.py
          echo 'req=urllib.request.Request(url,data=payload,headers={"Content-Type":"application/json"},method="POST")' >> /tmp/upload.py
          echo 'try:' >> /tmp/upload.py
          echo '  resp=urllib.request.urlopen(req); print(resp.read().decode())' >> /tmp/upload.py
          echo 'except urllib.error.HTTPError as e:' >> /tmp/upload.py
          echo '  print(json.dumps({"error":str(e),"code":e.code,"body":e.read().decode()[:200]}))' >> /tmp/upload.py
          echo 'except Exception as e:' >> /tmp/upload.py
          echo '  print(json.dumps({"error":str(e)}))' >> /tmp/upload.py

          while IFS= read -r FILE; do
            [ -z "$FILE" ] && continue
            TITLE=$(head -1 "$FILE" | sed 's/^# //')
            [ -z "$TITLE" ] && TITLE=$(basename "$FILE" .md)
            echo "Uploading: $FILE"

            RESULT=$(python3 /tmp/upload.py "$APPS_SCRIPT_URL" "$APPS_SCRIPT_SECRET" "$TITLE" "$FOLDER" "$FILE")

            if echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null | grep -q .; then
              DOC_ID=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
              echo "OK $FILE -> Drive doc $DOC_ID"
              SUCCESS=$((SUCCESS + 1))
              # Only a confirmed Drive doc id gets recorded. A failed upload
              # stays absent from the ledger and is retried by the next sweep,
              # which is the whole point of recording successes rather than
              # attempts.
              basename "$FILE" >> /tmp/uploaded-ok.txt
            else
              echo "FAIL $FILE response: $RESULT"
              FAIL=$((FAIL + 1))
            fi
          done < /tmp/new-files.txt

          echo ""
          echo "Results: $SUCCESS uploaded, $FAIL failed"
          [ "$FAIL" -gt 0 ] && exit 1 || exit 0

      # Runs even when the upload step failed partway, so the docs that DID land
      # are recorded and not re-uploaded as duplicates tomorrow. The ones that
      # failed stay off the ledger and are retried.
      - name: Record delivered docs in the ledger
        if: always() && steps.files.outputs.found == 'true'
        run: |
          [ -s /tmp/uploaded-ok.txt ] || { echo "nothing confirmed delivered"; exit 0; }
          touch outbox/.drive-uploaded
          cat outbox/.drive-uploaded /tmp/uploaded-ok.txt | sort -u > /tmp/ledger.new
          if cmp -s /tmp/ledger.new outbox/.drive-uploaded; then
            echo "ledger already current"; exit 0
          fi
          mv /tmp/ledger.new outbox/.drive-uploaded
          git config user.name "FIELD CI"
          git config user.email "claude@field.dev"
          git add outbox/.drive-uploaded
          git diff --cached --quiet && { echo "no ledger change"; exit 0; }
          git commit -m "chore: record Drive-delivered outbox docs [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "ledger pushed on attempt $i"; exit 0
            fi
            sleep $((i * 3))
          done
          echo "ledger push lost every attempt; next sweep will re-record"; exit 0
