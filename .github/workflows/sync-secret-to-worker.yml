# .github/workflows/sync-secret-to-worker.yml
#
# Syncs a GitHub Actions secret to a Cloudflare Worker secret.
# Secret value never touches git — flows GitHub Secret → CI runner → CF API.
#
# Usage (from sandbox or chat):
#   1. Set the secret as a GitHub Actions secret (PyNaCl or dashboard)
#   2. Dispatch this workflow with the secret name as input
#
# The workflow reads the GH secret and PUTs it to the Worker via CF API.
# Ported from stat-job-watcher's proven version, 2026-07-04.

name: Sync secret to Worker

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Name of the GitHub Actions secret to sync to the Worker'
        required: true
        type: string
      # Added 2026-10-13: the shared-secret rotation needs the same value on
      # field-claude-proxy, which compares the relay's X-FIELD-Relay header to
      # its own binding. A choice, not free text: these are the two Workers this
      # repo deploys.
      worker:
        description: 'Worker to write the secret to'
        required: false
        default: 'field-relay-nba'
        type: choice
        options:
          - field-relay-nba
          - field-claude-proxy

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync ${{ inputs.secret_name }} to ${{ inputs.worker || 'field-relay-nba' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SECRET_VALUE: ${{ secrets[inputs.secret_name] }}
          SECRET_NAME: ${{ inputs.secret_name }}
          TARGET_WORKER: ${{ inputs.worker || 'field-relay-nba' }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "❌ CLOUDFLARE_API_TOKEN not set in repo secrets"
            exit 1
          fi
          if [ -z "$SECRET_VALUE" ]; then
            echo "❌ GitHub secret '$SECRET_NAME' not found or empty"
            echo "Set it first: PyNaCl from sandbox, or GitHub Settings → Secrets → Actions"
            exit 1
          fi

          ACCOUNT="b57e9af57ab46c52ca9215804e689c29"
          WORKER="$TARGET_WORKER"
          case "$WORKER" in field-relay-nba|field-claude-proxy) ;; *) echo "❌ unknown worker '$WORKER'"; exit 1;; esac

          echo "Syncing $SECRET_NAME → $WORKER..."
          RESPONSE=$(curl -s -w "\nHTTP:%{http_code}" -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/workers/scripts/${WORKER}/secrets" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${SECRET_NAME}\",\"text\":\"${SECRET_VALUE}\",\"type\":\"secret_text\"}")

          HTTP=$(echo "$RESPONSE" | grep "HTTP:" | cut -d: -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP:")
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"

          if [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]; then
            echo "✅ $SECRET_NAME synced to $WORKER"
          else
            echo "❌ HTTP $HTTP — sync failed"
            exit 1
          fi
