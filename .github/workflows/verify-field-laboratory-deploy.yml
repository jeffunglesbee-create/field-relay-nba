name: Verify field-laboratory deploy

# CC-CMD-2026-08-10-laboratory-secret-bootstrap, VERIFY steps 2 and 3.
#
# Self-completing in one dispatch (Rule 87): triggers field-laboratory's own
# deploy, waits for it, then checks the live URL. Both halves are unreachable
# from a session sandbox -- that repo is outside this session's GitHub scope,
# and *.workers.dev is blocked by the sandbox proxy -- so both run here.
#
# The content check is the point. The CC-CMD is explicit that a bare 200 is not
# accepted, because an assets Worker pointed at an empty directory also returns
# 200. The body must actually contain the page text.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch, wait, then check the live URL
        continue-on-error: true
        env:
          PAT: ${{ secrets.RELAY_GH_PAT }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error, datetime

          PAT = os.environ["PAT"]
          API = "https://api.github.com/repos/jeffunglesbee-create/field-laboratory"
          SITE = "https://field-laboratory.jeffunglesbee.workers.dev"
          TS  = datetime.datetime.utcnow().strftime("%Y%m%dT%H%M%SZ")
          out = {"ts": TS}

          def gh(method, url, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, method=method, headers={
                  "Authorization": f"Bearer {PAT}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "field-relay-nba-cc",
                  **({"Content-Type": "application/json"} if data else {})})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()

          # Baseline BEFORE dispatching, so "a new run appeared" is measured
          # against a known starting point rather than guessed from timestamps.
          st, body = gh("GET", f"{API}/actions/workflows/deploy.yml/runs?per_page=1")
          before_id = None
          if st == 200:
              runs = json.loads(body).get("workflow_runs", [])
              before_id = runs[0]["id"] if runs else None
          out["run_before"] = {"status": st, "id": before_id}

          st, body = gh("POST", f"{API}/actions/workflows/deploy.yml/dispatches", {"ref": "main"})
          out["dispatch"] = {"status": st, "body": body[:300]}

          # Poll for a NEW run id, then for it to finish. Bounded, and every
          # exit path is recorded -- a timeout must not read like a pass.
          run = None
          if st == 204:
              for _ in range(60):
                  time.sleep(10)
                  s2, b2 = gh("GET", f"{API}/actions/workflows/deploy.yml/runs?per_page=1")
                  if s2 != 200:
                      continue
                  runs = json.loads(b2).get("workflow_runs", [])
                  if not runs:
                      continue
                  r0 = runs[0]
                  if r0["id"] != before_id:
                      run = {"id": r0["id"], "status": r0["status"], "conclusion": r0["conclusion"]}
                      if r0["status"] == "completed":
                          break
          out["deploy_run"] = run

          def fetch(url):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "field-relay-nba-cc"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", "replace")
              except Exception as e:
                  return None, f"ERROR {e}"

          # POLL, don't sleep-and-hope. The first run of this probe slept 10s
          # and got 404 with body "error code: 1042" -- a Cloudflare edge error
          # during propagation, not a broken site: a later diagnostic found /
          # serving 200 with 2424 bytes of text/html. A fixed sleep turned a
          # transient into a reported failure, which is exactly the noise that
          # gets a check distrusted. Retries until the edge settles, and records
          # how many attempts it took so a slow deploy is visible rather than
          # hidden.
          attempts = 0
          for attempts in range(1, 31):
              st, body = fetch(SITE + "/")
              if st == 200 and "FIELD Laboratory" in body:
                  break
              time.sleep(10)
          out["site_attempts"] = attempts
          out["site"] = {
              "status": st,
              "bytes": len(body),
              # A bare 200 proves nothing: an assets Worker over an empty dir
              # also returns 200. The page text is the real assertion.
              "contains_FIELD_Laboratory": "FIELD Laboratory" in body,
              "head": body[:200],
          }

          st, body = fetch(SITE + "/version.txt")
          out["version_txt"] = {"status": st, "body": body.strip()[:120]}

          st, body = gh("GET", f"{API}/contents/STATUS.md")
          if st == 200:
              import base64
              txt = base64.b64decode(json.loads(body).get("content", "")).decode("utf-8", "replace")
              out["status_md"] = {"status": st, "head": txt[:400]}
          else:
              out["status_md"] = {"status": st}

          out["done_condition_met"] = bool(out["site"]["contains_FIELD_Laboratory"])

          os.makedirs("outbox", exist_ok=True)
          with open(f"outbox/verify-field-laboratory-deploy-{TS}.json", "w") as f:
              json.dump(out, f, indent=2)
          print(json.dumps(out, indent=2))
          PY
      - name: Commit
        if: always()
        run: |
          git config user.email "verify-lab@field"; git config user.name "FIELD CI"
          git add outbox/verify-field-laboratory-deploy-*.json || echo "(none)"
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "chore: field-laboratory deploy verification [skip ci]"
          for i in 1 2 3 4 5; do
            git fetch origin main -q && git rebase origin/main -q && git push origin main && exit 0
            sleep $((i * 3))
          done
          exit 1
