name: mcp-remaining-tools-verify
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcp-remaining-tools-verify.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Live-verify get_ci_status/get_deploy_status/get_smoke_count multi-repo
        env:
          FIELD_MCP_SECRET: ${{ secrets.FIELD_MCP_SECRET }}
        run: |
          echo "" | base64 -d > /tmp/mcp_repo_tools_verify.py
          python3 /tmp/mcp_repo_tools_verify.py
