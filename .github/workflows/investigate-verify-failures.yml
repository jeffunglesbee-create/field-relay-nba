name: Investigate post-deploy-verify failures (one-shot 2026-07-21)
# CC-CMD-2026-07-21-investigate-post-deploy-verify-failures
# Runs the two specific probes that post-deploy-live-verify.yml runs
# (soccer league label live-comparison, /pl/fixtures shape check) plus
# circadian endpoints. Manual dispatch only. Delete after investigation complete.
on:
  workflow_dispatch:

jobs:
  investigate:
    runs-on: ubuntu-latest
    env:
      RELAY: https://field-relay-nba.jeffunglesbee.workers.dev
    steps:
      - name: /pl/fixtures shape check
        run: |
          python3 - <<'PYEOF'
import json, sys, urllib.request

RELAY = 'https://field-relay-nba.jeffunglesbee.workers.dev'
UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36'

req = urllib.request.Request(f'{RELAY}/pl/fixtures', headers={'User-Agent': UA})
with urllib.request.urlopen(req, timeout=20) as r:
    status = r.status
    body = r.read()

print(f'HTTP {status}')
if status != 200:
    print(f'FAIL: expected 200, got {status}')
    sys.exit(1)

data = json.loads(body)
if not isinstance(data, list):
    print(f'FAIL: expected JSON array, got {type(data).__name__}: {str(body)[:200]}')
    sys.exit(1)

print(f'Fixtures returned: {len(data)}')
if not data:
    print('SOFT-SKIP: zero fixtures (off-season or pre-season). Not a code failure.')
    sys.exit(0)

REQUIRED = {'id', 'status', 'home', 'away', 'kickoff'}
missing = REQUIRED - set(data[0].keys())
if missing:
    print(f'FAIL: first fixture missing required fields: {missing}')
    print(f'Got keys: {list(data[0].keys())}')
    sys.exit(1)

print(f'PASS: /pl/fixtures returned {len(data)} fixture(s), shape OK.')
print(f'Sample: {json.dumps(data[0])[:300]}')
PYEOF

      - name: Soccer league label live-comparison
        env:
          RELAY_GH_PAT: ${{ secrets.RELAY_GH_PAT }}
        run: |
          python3 - <<'PYEOF'
import base64, json, os, re, sys, urllib.request
from datetime import datetime, timezone

UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
RELAY = 'https://field-relay-nba.jeffunglesbee.workers.dev'
EXCLUDED_ESPN_SPORTS = {'baseball', 'football', 'basketball', 'australian-football'}

GH_TOKEN = os.environ.get('RELAY_GH_PAT', '')
GH_HEADERS = {
    'Authorization': f'Bearer {GH_TOKEN}',
    'Accept': 'application/vnd.github+json',
    'User-Agent': 'soccer-league-label-investigate',
}

def fetch_file(path):
    url = f'https://api.github.com/repos/jeffunglesbee-create/field-relay-nba/contents/{path}?ref=main'
    req = urllib.request.Request(url, headers=GH_HEADERS)
    with urllib.request.urlopen(req, timeout=20) as r:
        data = json.load(r)
    return base64.b64decode(data['content']).decode('utf-8')

def relay_get(path):
    req = urllib.request.Request(f'{RELAY}{path}', headers={'User-Agent': UA})
    with urllib.request.urlopen(req, timeout=20) as r:
        return json.load(r)

if not GH_TOKEN:
    print('RELAY_GH_PAT not set — skipping source-read step, doing live-only check')
    content = None
else:
    content = fetch_file('src/index.js')

if content:
    m = re.search(r"const SOCCER_LEAGUE_LABELS = \{([^}]*)\};", content)
    if not m:
        print('SOCCER_LEAGUE_LABELS constant not found in src/index.js')
        sys.exit(1)
    labels = dict(re.findall(r"(\w+):\s*'([^']+)'", m.group(1)))
    print(f'SOCCER_LEAGUE_LABELS: {len(labels)} entries: {labels}')

    m2 = re.search(r"const V2_LEAGUES = \{(.*?)\n\};", content, re.DOTALL)
    if not m2:
        print('V2_LEAGUES constant not found in src/index.js')
        sys.exit(1)
    v2_block = m2.group(1)

    routed_keys = []
    for km in re.finditer(r"'(\w+)':\s*\{([^}]*)\}", v2_block):
        key, body = km.group(1), km.group(2)
        if not re.search(r"espnLeague:\s*'[^']+'", body):
            continue
        if re.search(r"espnSource:\s*true", body):
            continue
        esp_sport_m = re.search(r"espnSport:\s*'([^']+)'", body)
        esp_sport = esp_sport_m.group(1) if esp_sport_m else None
        if esp_sport in EXCLUDED_ESPN_SPORTS:
            continue
        routed_keys.append(key)
    print(f'Keys routing through adaptESPNWCSoccer: {routed_keys}')
else:
    # Fallback: known soccer keys from prior session context
    routed_keys = ['pl', 'laliga', 'bundesliga', 'seriea', 'ligue1', 'cl', 'el', 'ecl',
                   'mls', 'wc26', 'women_wc', 'copa', 'afcon']
    labels = {}
    print(f'Using known soccer key list (no PAT): {routed_keys}')

today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
mismatches = []
checked_with_games = []
zero_game_keys = []
for key in routed_keys:
    expected = labels.get(key)
    try:
        data = relay_get(f'/v2/games?sport={key}&date={today}')
    except Exception as e:
        print(f'  {key}: request failed ({e}) -- informational only')
        continue
    games = data.get('games') or []
    if not games:
        zero_game_keys.append(key)
        continue
    actual = games[0].get('league')
    checked_with_games.append((key, actual, expected))
    if expected is not None and actual != expected:
        mismatches.append((key, actual, expected))

print(f'Date checked: {today}')
print(f'Keys with zero games today (correctly skipped): {zero_game_keys}')
print(f'Keys with real games today, checked: {checked_with_games}')

if mismatches:
    print('SOCCER LEAGUE LABEL VIOLATIONS:')
    for key, actual, expected in mismatches:
        print(f'  {key}: got league={actual!r}, expected={expected!r}')
    sys.exit(1)

print('No soccer league label violations found.')
PYEOF

      - name: Circadian endpoints live-check
        run: |
          DATE=$(date -u +%Y-%m-%d)
          YESTERDAY=$(date -u -d "yesterday" +%Y-%m-%d)
          BASE=https://field-relay-nba.jeffunglesbee.workers.dev
          echo "=== /circadian/preview/$DATE ==="
          curl -sf "$BASE/circadian/preview/$DATE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'phase={d.get(\"phase\")} slots={len(d.get(\"slots\",[]))} source={d.get(\"source\",\"?\")}')" || echo "REQUEST FAILED or non-JSON"
          echo "=== /circadian/late/$DATE ==="
          curl -sf "$BASE/circadian/late/$DATE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'phase={d.get(\"phase\")} slots={len(d.get(\"slots\",[]))} source={d.get(\"source\",\"?\")}')" || echo "REQUEST FAILED or non-JSON"
          echo "=== /circadian/preview/$YESTERDAY ==="
          curl -sf "$BASE/circadian/preview/$YESTERDAY" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f'phase={d.get(\"phase\")} slots={len(d.get(\"slots\",[]))} source={d.get(\"source\",\"?\")}')" || echo "REQUEST FAILED or non-JSON"
          echo "=== bogus phase (expect 400) ==="
          curl -s -w "\nHTTP:%{http_code}\n" "$BASE/circadian/bogus/$DATE" | tail -1
          echo "=== bad date (expect 400) ==="
          curl -s -w "\nHTTP:%{http_code}\n" "$BASE/circadian/preview/not-a-date" | tail -1

      - name: Summary
        run: |
          echo "Investigation complete. All three probes above show current live state."
          echo "For context on original failures (runs 29791908505 / 29791607446):"
          echo "Both runs completed with 0 jobs queued -- no log content was ever written."
          echo "The 'failure' conclusion on those runs reflects a workflow-level issue,"
          echo "not a probe-level failure. This run confirms current probe state."
