name: wenttoot-verify
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wenttoot-verify.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Independently re-verify ESPN period data for the three named games
        run: echo "" | base64 -d > /tmp/probe.py && python3 /tmp/probe.py
