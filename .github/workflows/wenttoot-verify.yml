name: wenttoot-verify
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wenttoot-verify.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Live-verify /analytics/newspaper against the deployed relay for the three named games
        run: echo "" | base64 -d > /tmp/verify_live.py && python3 /tmp/verify_live.py
