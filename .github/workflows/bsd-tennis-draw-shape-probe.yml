name: BSD Tennis Draw Shape Probe

# The feasibility probe answered EDGES. This answers NODES.
#
# The draw route about to be written maps player names, seeds and scores out of
# /tennis/api/v2/matches/ rows. The only tennis fixture this project holds came
# from /matches/live/ — a different endpoint. Writing the route against that
# shape would be reading a copy and calling it the source.
#
# Dispatch-only. This answers a design question; it is not a monitor.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe the draw row shape
        env:
          BSD_API_TOKEN: ${{ secrets.BSD_API_TOKEN }}
        run: node scripts/bsd-tennis-draw-shape-probe.mjs
      - name: Commit the reading
        if: always()
        run: |
          git config user.email "claude@field.dev"
          git config user.name  "FIELD CI"
          git add outbox/bsd-tennis-draw-shape-*.json || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "probe: what a BSD tennis draw row carries on the list endpoint"
          for i in 1 2 3 4; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            sleep $((2**i))
          done
          exit 1
