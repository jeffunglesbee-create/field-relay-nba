name: TEMP Cluster3 Verify

# TEMP-CLUSTER3-VERIFY-2026-07-13: forced-failure + success-path verification
# for relay-empty-catches-cluster3. Triggers real GET /context/game/{id}
# calls while tailing the worker to confirm the new catches fire correctly.
# Delete after use — see docs/CC-CMD-2026-07-13-relay-empty-catches-cluster3.md

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install --no-save wrangler

      - name: Trigger real context/game calls, capture tail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -x
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          OUT="outbox/temp-cluster3-tail-${TS}.json"
          mkdir -p outbox

          (
            sleep 6
            echo "=== forced-failure: corrupted findGame row ==="
            curl -sS "https://field-relay-nba.jeffunglesbee.workers.dev/context/game/CATCHTEST-cluster3-findgame" -o "outbox/temp-cluster3-forced-result-${TS}.json" -w "HTTP %{http_code}\n"
            cat "outbox/temp-cluster3-forced-result-${TS}.json"
            echo "=== success-path: real recent game id ==="
            curl -sS "https://field-relay-nba.jeffunglesbee.workers.dev/context/game/WNBA_2026-07-13_lynx_mercury" -o "outbox/temp-cluster3-success-result-${TS}.json" -w "HTTP %{http_code}\n"
            cat "outbox/temp-cluster3-success-result-${TS}.json"
          ) &

          timeout -k 5s 40s npx wrangler tail field-relay-nba --format json --search "FIND-GAME" > "$OUT" 2>tail.err || true

          echo "=== tail.err ==="
          cat tail.err || true
          echo "=== File: $OUT (line count) ==="
          wc -l "$OUT" || true

          echo "OUT=$OUT" >> $GITHUB_ENV

      - name: Push result
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Debug-Probe"
          git add outbox/
          git commit -m "temp: cluster3 verify capture [skip ci]" || echo "(nothing to commit)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
