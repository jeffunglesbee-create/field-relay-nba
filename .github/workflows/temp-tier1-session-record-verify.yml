name: TEMP Tier1 Session Record Verify

# TEMP-TIER1-SESSION-RECORD-VERIFY-2026-07-14: real live verification for
# the /session/record carry_forwards_written accurate-count fix
# (CC-CMD-2026-07-13-promise-catch-tier1). Delete after use.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Real live POST /session/record
        run: |
          set -x
          mkdir -p outbox
          OUT="outbox/temp-tier1-session-record-result.json"
          curl -sS -X POST "https://field-relay-nba.jeffunglesbee.workers.dev/session/record" \
            -H "Content-Type: application/json" \
            -d '{
              "client_head": "TIER1TEST_client_head",
              "relay_head": "TIER1TEST_relay_head",
              "summary": "TEMP verification for promise-catch-tier1 carry-forwards fix",
              "carry_forwards": ["TIER1TEST carry-forward one", "TIER1TEST carry-forward two"]
            }' > "$OUT"
          cat "$OUT"
      - name: Push result
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Debug-Probe"
          git add outbox/
          git commit -m "temp: tier1 session-record verify capture [skip ci]" || echo "(nothing to commit)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
