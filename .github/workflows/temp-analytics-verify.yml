name: TEMP Analytics Index Fix Verify

# TEMP-ANALYTICS-VERIFY-2026-07-13: live verification for analytics-index-fix.
# Triggers a real POST /journalism/run?force=true while tailing the worker,
# to confirm the [ANALYTICS] cron-slate write error is now GONE (not just
# re-observed) and the cycle still produces real fresh content.
# Delete after use — see docs/CC-CMD-2026-07-13-analytics-index-fix.md

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install --no-save wrangler

      - name: Trigger real journalism cycle run, capture tail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -x
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          OUT="outbox/temp-analytics-tail-${TS}.json"
          mkdir -p outbox

          timeout 90s npx wrangler tail field-relay-nba --format json > "$OUT" 2>tail.err &
          sleep 10

          echo "=== triggering /journalism/run?force=true ==="
          curl -sS -X POST "https://field-relay-nba.jeffunglesbee.workers.dev/journalism/run?force=true" -o "outbox/temp-analytics-run-result-${TS}.json" -w "HTTP %{http_code}\n"
          cat "outbox/temp-analytics-run-result-${TS}.json"

          sleep 15
          wait || true

          echo "=== tail.err ==="
          cat tail.err || true
          echo "=== File: $OUT (line count) ==="
          wc -l "$OUT" || true

          echo "OUT=$OUT" >> $GITHUB_ENV

      - name: Push result
        if: always()
        run: |
          git config user.email "probe@field"
          git config user.name "Debug-Probe"
          git add outbox/
          git commit -m "temp: analytics-index-fix verify capture [skip ci]" || echo "(nothing to commit)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
