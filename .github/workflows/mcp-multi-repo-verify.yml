name: mcp-multi-repo-verify
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mcp-multi-repo-verify.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Live-verify MCP multi-repo + create-file support against the deployed relay
        env:
          FIELD_MCP_SECRET: ${{ secrets.FIELD_MCP_SECRET }}
        run: echo "" | base64 -d > /tmp/mcp_verify.py && python3 /tmp/mcp_verify.py
