name               = "field-relay-nba"
main               = "src/index.js"
compatibility_date = "2026-05-16"
# global_fetch_strictly_public: allows this Worker to fetch the field-claude-proxy
# Worker via its public workers.dev URL. Without it, Worker→Worker fetch on the
# same account is blocked with error 1042 — which silently broke the journalism
# cron (it could never reach the proxy → KV never populated). May 29 2026.
compatibility_flags = ["global_fetch_strictly_public"]

# Bootstrap trigger 2026-05-18T18:39:02Z

# ── Push Notifications (PUSH B — May 24 2026) ────────────────────────────────
# KV namespace for push subscriptions. Create in CF dashboard first:
#   wrangler kv:namespace create "PUSH_SUBS"
# Then replace the id below with the actual namespace ID.
# Binding name PUSH_SUBS is referenced in src/index.js.
[[kv_namespaces]]
binding = "PUSH_SUBS"
id      = "46b6d8db59ea49eca8b1d89c576a6158"

# ── O(1) Journalism (Layer 2 — May 25 2026) ──────────────────────────────────
# KV namespace for pre-rendered journalism prose.
# Relay cron generates prose every 15 min, stores here.
# Clients read /journalism/tonight — zero AI calls from browser.
# ADR-002 Rule A: this KV stores PROSE ONLY. No interest level values.
[[kv_namespaces]]
binding = "FIELD_JOURNALISM"
id      = "83edf19398da4ed184a42746cb85c9d7"

# ── MCP OAuth (Tier 1 Phase 2 — June 2 2026 PM-14) ──────────────────────────
# KV namespace backing OAuth 2.1 server for claude.ai custom-connector MCP
# tool surface. Stores DCR clients, authorization codes (PKCE-bound), access
# and refresh tokens, plus rotating request-log entries used for diagnostic.
# Bootstrap step in deploy.yml creates "field-mcp-oauth" namespace if absent
# and patches the placeholder ID below. Binding MCP_OAUTH consumed by
# src/mcp-oauth.js and the /mcp auth gate in src/index.js.
[[kv_namespaces]]
binding = "MCP_OAUTH"
id      = "MCP_OAUTH_PLACEHOLDER_REPLACE_WITH_REAL_ID"

# Cron triggers: push heartbeat every 5 min + journalism cycle every 15 min
[triggers]
crons = ["*/5 * * * *", "*/15 * * * *"]

# ── Durable Objects (WOW 1 + WOW 2 — May 31 2026, Workers Plus) ─────────────
# GameDO: one DO per active game. Browsers WebSocket-connect for live score
# fan-out (replaces N polls with 1). Browsers signal CRUNCH TIME → DO fans
# out Web Push to pinned subscribers. ADR-002 compliant: DO ships raw facts
# only, never computes interest levels. See src/game-do.js for full spec.
[[durable_objects.bindings]]
name       = "GAME_DO"
class_name = "GameDO"

# Migration: introduce the GameDO class. Required when first deploying a DO.
[[migrations]]
tag         = "v1-game-do"
new_classes = ["GameDO"]

# ── Analytics Engine (WOW 7 — Journalism Quality observability, May 31 2026) ─
# Append-only time-series sink for JQ Gate metrics. Bound as JQ_ANALYTICS in
# src/index.js, written inside /journalism/generate after runQualityChain.
# Schema per row:
#   indexes: [briefType, sport]                  (filtering dimensions)
#   blobs:   [layersFired]                        (comma-separated layer names)
#   doubles: [score, retries, ms, initialCliches, finalCliches,
#             initialCrossSport, finalCrossSport, promptLength, textLength]
# Dataset auto-creates on first write. Queried via /accounts/{ID}/analytics_engine/sql.
# RUWT/ADR-002 compliance: records OUTCOMES of quality enforcement, not
# editorial decisions about interest level. We log what happened to the prose,
# not what we decided to do with it. Pure editorial-quality observability.
[[analytics_engine_datasets]]
binding = "JQ_ANALYTICS"
dataset = "field_jq_analytics"

# ── Queues (WOW 8 — Async journalism pipeline, June 1 2026) ──────────────────
# Queue created via CF API: id 88f2861897ce4439af2a3c78f58b0508
# Producer binding (writer) — called from /journalism/enqueue endpoint to defer
# heavy journalism generation off the live request path. Consumer (queue handler
# in src/index.js) drains the queue at upstream-permitted rate with retry on 429.
# Result persisted to FIELD_JOURNALISM KV by jobId; browser polls /journalism/result/:jobId.
# Eliminates the synchronous 400/700/1000ms stagger that was the prior workaround.
[[queues.producers]]
binding    = "JOURNALISM_QUEUE"
queue      = "field-journalism-queue"

[[queues.consumers]]
queue              = "field-journalism-queue"
max_batch_size     = 5
max_batch_timeout  = 30
max_retries        = 3

# ── D1 World Cup Group Table (WC D1 — June 4 2026) ───────────────────────────
# SQLite at edge. Stores WC2026 group standings + results for permutations engine.
# Database: wc2026 (ID: f26669de-e772-4b56-a6d1-f8fdea08a4d4, region: ENAM)
# Tables: wc_group, wc_results | View: wc_third_place_standings
# Auto-written when /v2/games?sport=wc26 returns final-state group games.
# Relay-is-dumb: relay writes arithmetic facts (scores) only. No intelligence.
[[d1_databases]]
binding       = "WC2026_DB"
database_name = "wc2026"
database_id   = "f26669de-e772-4b56-a6d1-f8fdea08a4d4"
